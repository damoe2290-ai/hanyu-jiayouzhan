 if(S.ui.py==null?D.defpy:S.ui.py)document.body.classList.add('py');if(S.ui.ar)document.body.classList.add('ar');syncSw();show(tab);upd();
}
function syncSw(){$('#spy').setAttribute('aria-pressed',document.body.classList.contains('py'));$('#sar').setAttribute('aria-pressed',document.body.classList.contains('ar'))}
var cur=-1;
function pop(i){var t=TERMS[i];cur=i;var p=$('#pop');p.hidden=false;p.innerHTML='<div class="r"><div class="zz">'+esc(t.zh)+'</div><div><div class="pp" style="font-family:var(--font-py);direction:ltr">'+pyh(t.py)+'</div><div>'+esc(t.ar)+'</div></div><div class="cl" style="display:flex;gap:6px"><button class="sm" data-pop="say" aria-label="استمع">🔊</button><button class="sm'+(inRev(t.zh)?' on':'')+'" data-pop="add" aria-label="مراجعة">'+(inRev(t.zh)?'✓':'+')+'</button><button class="sm" data-pop="x" aria-label="إغلاق">✕</button></div></div>'+(t.ex?'<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">'+ZP(sp(t.ex)[0])+'<span class="mut">'+esc(sp(t.ex)[1])+'</span></div>':'')}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-g],[data-tab],[data-pop],[data-say-sec],[data-say-t],[data-add-t],#addall,#slow,[data-fc],#spy,#sar,#prs,[data-fr],[data-say-m],[data-sz]');
 if(!t){if(!e.target.closest('#pop')){$('#pop').hidden=true}return}
 var d=t.dataset;
 if(d.g!=null){speak(TERMS[+d.g].zh);pop(+d.g)}
 else if(d.tab)show(d.tab);
 else if(d.pop){if(d.pop==='x')$('#pop').hidden=true;else if(d.pop==='say')speak(TERMS[cur].zh);else{var on=addRev(TERMS[cur].zh);pop(cur);toast(on?'أُضيف إلى مفردات '+D.cname:'أُزيل من المراجعة');refreshTerms()}}
 else if(d.saySec!=null)speak(secText(+d.saySec));
 else if(d.sayT!=null)speak(TERMS[+d.sayT].zh);
 else if(d.addT!=null){var on2=addRev(TERMS[+d.addT].zh);toast(on2?'أُضيف إلى مفردات '+D.cname:'أُزيل من المراجعة');refreshTerms()}
 else if(t.id==='addall'){TERMS.forEach(function(x){if(!inRev(x.zh))addRev(x.zh)});toast('أُضيفت كل المصطلحات');refreshTerms()}
 else if(t.id==='slow'){var s=document.body.classList.toggle('slow');S.ui.slow=s?1:0;save();t.setAttribute('aria-pressed',s)}
 else if(d.fc){fcAct(d.fc)}
 else if(t.id==='spy'||t.id==='sar'){var c=t.id==='spy'?'py':'ar';document.body.classList.toggle(c);S.ui[c]=document.body.classList.contains(c)?1:0;save();syncSw()}
 else if(t.id==='prs'){if(confirm('مسح نتائج التدريبات وإعادتها؟')){S.prac={};save();initPractice();[].forEach.call(document.querySelectorAll('.qs'),function(q){q.textContent='';q.className='qs'});[].forEach.call(document.querySelectorAll('.fb'),function(f){f.hidden=true});upd()}}
 else if(d.fr!=null){var sec=t.closest('[data-d]'),i=+sec.dataset.d,ta=$('textarea',sec),f=D.discuss[i].frames[+d.fr],p=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.value=ta.value.slice(0,p)+f+ta.value.slice(p);ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}
 else if(d.sz!=null)speak(SAYS[+d.sz]);
 else if(d.sayM!=null)speak(sp(D.discuss[+d.sayM].model)[0]);
});
function refreshTerms(){var y=window.scrollY;$('#p-terms').innerHTML=termsTab();window.scrollTo(0,y)}
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('g')){e.preventDefault();e.target.click()}});
document.addEventListener('input',function(e){var ta=e.target;if(ta.dataset&&ta.dataset.ta!=null){var i=+ta.dataset.ta;S.txt[i]=ta.value;save();chk(i);upd()}});
$('#th').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')};
init();
})();
</script>
</body></html>
