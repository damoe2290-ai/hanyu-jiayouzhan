<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img,svg{max-width:100%}</style></head><body><title>الدرس الثاني · الأعياد الصينية الكبرى · 中国的节日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{--bg:#FBF6EE;--surface:#FFFDF9;--surface2:#F3EBDD;--fg:#2B1D18;--muted:#7B6A5E;--line:#E8DCC8;--accent:#B8322A;--accent-fg:#fff;--accent-soft:#F8E4DF;--seal:#B8322A;--seal-fg:#fff;--gold:#C98A0A;--good:#2E7D4F;--good-soft:#DDF0E2;--bad:#B3261E;--bad-soft:#F7DBD8;--c1:#7A4FA3;--c2:#E0952B;--c3:#2F6DB5;--c4:#2E8B57;--t1:#C0392B;--t2:#A66A00;--t3:#1D7A45;--t4:#2759B8;--t5:#6A7B77;
--font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-han:'Noto Serif SC','Songti SC',serif;--font-py:'IBM Plex Sans','Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.7 var(--font-ui);padding:0 max(16px,env(safe-area-inset-left)) 90px}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}h1,h2,h3,p{margin:0}
.han{font-family:var(--font-han)}.py{font-family:var(--font-py)}.mut{color:var(--muted);font-size:14px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:10px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;font-size:17px;line-height:1.3}
.ib{font-size:20px;line-height:1;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.pg{height:6px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tabs{display:flex;gap:4px;margin-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sw{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.sw[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.banner{border-radius:20px;margin-top:12px;padding:22px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface2))}
.banner .big{font:700 52px/1 var(--font-han);color:var(--accent);min-width:1.6em;text-align:center}
.banner h2{font-size:22px;line-height:1.3}.banner p{color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.sec{margin-top:26px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:21px;line-height:1.35;border-inline-start:5px solid var(--accent);padding-inline-start:10px}
.sec>h2 .har{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--font-ui)}
.zb{display:block}.zb .t{display:block}
.pyl{display:none;font:14px/1.5 var(--font-py);color:var(--muted);direction:ltr;text-align:left;margin-top:1px}
body.py .pyl{display:block}
.ar2{display:none;color:var(--muted);font-size:15px;line-height:1.7;margin-top:2px}
body.ar .ar2{display:block}
.zh{font-family:var(--font-han);font-size:19px;line-height:1.95;direction:ltr;text-align:left;display:block}
.blk{margin-top:12px}
.p .zh{font-size:19px}
.g{border-bottom:2px dotted var(--accent);cursor:pointer;padding-bottom:1px}.g:hover,.g.on{background:var(--accent-soft)}
.key{border-inline-start:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:10px;padding:10px 14px}
.key:before{content:'重点 · نقطة مهمة';display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px}
ul.ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.ul li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tl{display:grid;gap:0;position:relative;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl .lb{font:700 15px/1.3 var(--font-han);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 8px;text-align:center;align-self:start;direction:ltr}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.cd .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cd .hd b{font:700 24px/1.2 var(--font-han);direction:ltr}.cd .hd .ar{font-size:13px;color:var(--muted)}
.cd .zh{font-size:16px;line-height:1.75}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:480px;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);vertical-align:top;text-align:start}
th{background:var(--accent-soft);font-family:var(--font-han)}td:first-child{font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .zh,th .zh{font-size:16px;line-height:1.7}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sm{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.sm.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
/* terms */
.tg{display:grid;gap:8px;margin-top:12px}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tm .z{font:700 26px/1.2 var(--font-han);direction:ltr;min-width:2em;text-align:center}
.tm .ex{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.tm .ex .han{font-size:17px;direction:ltr;display:block;text-align:left}
.tm .pp{font-family:var(--font-py);direction:ltr;text-align:start}
/* practice */
.pq{position:relative}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qn{width:28px;height:28px;border-radius:8px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 14px var(--font-py)}
.qty{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:99px;padding:0 10px}
.qs{margin-inline-start:auto;font-size:13px;font-weight:700}.qs.ok{color:var(--good)}.qs.no{color:var(--bad)}
.q .zh{font-size:19px}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:block;width:100%;text-align:start;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.op .zh{font-size:17px;line-height:1.7}
.op.sel{border-color:var(--accent);background:var(--accent-soft)}
.op.good{border-color:var(--good);background:var(--good-soft)}
.op.bad{border-color:var(--bad);background:var(--bad-soft)}
.op:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--good-soft);color:var(--good)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ar{color:var(--fg)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mt .col{display:grid;gap:8px;align-content:start}
.mt .op{min-height:52px;padding:6px 10px}
.mt .op.done{opacity:.55;border-color:var(--good);background:var(--good-soft)}
.mt .op.flash{border-color:var(--bad);background:var(--bad-soft)}
.line{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr;align-items:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:start;max-width:100%}
.chip .zh{font-size:16px;line-height:1.6}
.chip.bad{border-color:var(--bad);background:var(--bad-soft)}.chip.good{border-color:var(--good);background:var(--good-soft)}
.chip .nn{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:var(--seal);color:var(--seal-fg);font:700 12px var(--font-py);margin-inline-end:6px}
.rows{display:grid;gap:8px;margin-top:10px}
.rw{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.rw.good{border-color:var(--good);background:var(--good-soft)}.rw.bad{border-color:var(--bad);background:var(--bad-soft)}
.rw .cs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cs button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font:600 15px var(--font-han)}
.cs button.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cz{font:19px/2.4 var(--font-han);direction:ltr;text-align:left;margin-top:8px}
.cz select{font:inherit;font-size:16px;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:0 6px;margin:0 3px;max-width:100%}
.cz select.good{border-color:var(--good);background:var(--good-soft)}.cz select.bad{border-color:var(--bad);background:var(--bad-soft)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sum b{font:700 22px var(--font-py)}
/* discuss */
textarea{width:100%;min-height:130px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;font:19px/1.8 var(--font-han);margin-top:10px;resize:vertical;direction:ltr;text-align:left}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fr button{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font:600 15px var(--font-han);direction:ltr}
.us{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.us span{font:600 14px var(--font-han);padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.us span.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
details.md{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface2)}
details.md summary{cursor:pointer;font-weight:600;min-height:32px}
/* popover */
#pop{position:fixed;inset-inline:12px;bottom:12px;z-index:30;max-width:560px;margin-inline:auto;background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#pop .r{display:flex;align-items:center;gap:12px}
#pop .zz{font:700 30px/1.2 var(--font-han);direction:ltr;white-space:nowrap}#pop .r>div:nth-child(2){min-width:0;flex:1}
#pop .cl{flex:none}
.toast{position:fixed;inset:auto 16px 90px;margin:auto;max-width:360px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:40}
.foot{text-align:center;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:520px){.mt{grid-template-columns:1fr}.tl li{grid-template-columns:70px 1fr}.banner{grid-template-columns:1fr;text-align:center}}
</style>

<script>
(function(){
var D={"n":2,"big":"节","title_zh":"中国的节日","title_ar":"الدرس الثاني · الأعياد الصينية الكبرى","intro_ar":"عيد الربيع، تشينغمينغ، قوارب التنين، ومنتصف الخريف: أصولها وأساطيرها وعاداتها.","sections":[{"h":"中国四大传统节日","ar":"نظرة عامة","b":[{"p":"中国有四大传统节日：春节、清明节、端午节和中秋节。每个节日都有自己的传说、习俗和文化意义。｜للصين أربعة أعياد تقليدية كبرى، ولكل منها أساطيره وعاداته ودلالته الثقافية."},{"table":{"head":["节日｜العيد","日期｜التاريخ","主要习俗｜أهم العادات","文化意义｜الدلالة"],"rows":[["春节","农历正月初一","贴春联、吃年夜饭、守岁、拜年","除旧布新，团圆"],["清明节","公历4月5日前后","扫墓、踏青、插柳","祭祖，怀念亲人"],["端午节","农历五月初五","赛龙舟、吃粽子、挂艾草","纪念屈原，驱邪避疫"],["中秋节","农历八月十五","赏月、吃月饼","团圆美满"]]}}]},{"h":"一、春节","ar":"عيد الربيع","b":[{"p":"春节，即农历新年，是一年之岁首，就是传统意义上的“年节”，俗称新春、新岁、新年、大年等，又称过年、过大年。｜عيد الربيع هو رأس السنة القمرية، أي «عيد السنة» بالمعنى التقليدي، ويُسمّى شعبياً الربيع الجديد أو السنة الجديدة أو «السنة الكبرى»، ويقال له أيضاً «قضاء السنة»."},{"ul":["除旧布新｜نودّع القديم ونستقبل الجديد","迎禧接福｜نستقبل الفرح والحظ","拜神祭祖｜تكريم الآلهة والأجداد","祈求丰年｜الدعاء بعام وفير"]},{"p":"起源与发展｜الأصل والتطور"},{"tl":[["上古时代","“岁首祈年祭祀”：农事结束，祭天地、祖先，祈求丰年。｜في العصور القديمة: بعد انتهاء الأعمال الزراعية تُقدَّم القرابين للسماء والأرض والأجداد طلباً لعام وفير."],["立春","古时“春节”指“立春”；南北朝泛指整个春季。｜كان «عيد الربيع» قديماً يعني بداية الربيع (ليتشون)، وفي عهد الأسرتين الجنوبية والشمالية صار يشمل الربيع كله."],["辛亥革命","为区别于阳历新年，农历正月初一定名“春节”。｜للتمييز عن رأس السنة الشمسية سُمّي أول يوم من الشهر القمري الأول «عيد الربيع»."],["2006年5月20日","“春节”民俗列入第一批国家级非物质文化遗产名录。｜أُدرجت عادات عيد الربيع في أول قائمة وطنية للتراث الثقافي غير المادي."]]}]},{"h":"年的传说","ar":"أسطورة الوحش «نيان»","b":[{"p":"相传古时候有一种叫“年”的怪兽，每到除夕就从深山里出来，伤害人畜。｜يُروى أنه في القديم كان هناك وحش اسمه «نيان» يخرج من الجبال العميقة كل ليلة رأس السنة فيؤذي الناس والمواشي."},{"p":"人们发现“年”害怕红色、火光和响声，于是家家户户贴红纸、点火、放爆竹来赶走它。｜اكتشف الناس أن «نيان» يخاف اللون الأحمر والنار والأصوات العالية، فصارت كل أسرة تلصق الورق الأحمر وتشعل النار وتطلق المفرقعات لطرده."},{"table":{"head":["“年”怕什么｜مما يخاف","对应的习俗｜العادة المقابلة"],"rows":[["红色｜الأحمر","贴春联｜لصق أبيات الربيع"],["火光｜ضوء النار","守岁｜السهر ليلة رأس السنة"],["响声｜الصوت العالي","放鞭炮｜إطلاق المفرقعات"]]}}]},{"h":"春节习俗","ar":"عادات عيد الربيع","b":[{"cards":[["办年货","شراء مستلزمات العيد","春节前，家家户户都要采购食品、衣物、装饰品和礼品。｜قبل العيد تشتري كل أسرة الطعام والملابس والزينة والهدايا."],["祭灶","تقديم القرابين لإله المطبخ","传说灶王爷每年腊月二十三上天向玉帝汇报这家人一年的善恶，所以人们要祭灶，摆上糖果。｜يُقال إن إله المطبخ يصعد إلى السماء ليخبر إمبراطور اليشم بأعمال الأسرة، فيقدّمون له الحلوى."],["扫尘","التنظيف الكبير","春节前要彻底打扫房屋。“尘”与“陈”谐音，有“除陈布新”的意思。｜تُنظَّف البيوت بالكامل قبل العيد؛ و«تشن» (غبار) تشبه «تشن» (قديم) في النطق، فالمعنى: إزالة القديم وتجديد الحياة."],["贴春联","لصق أبيات الربيع","春联是红纸写的对联，贴在大门两侧；“福”字常常倒着贴，寓意“福到了”。｜أبيات مكتوبة على ورق أحمر تُعلَّق على جانبي الباب، وتُلصق كلمة «فو» (حظ) مقلوبة لأن «داو» تعني «مقلوب» و«وصل»: الحظ قد وصل."],["年夜饭","عشاء ليلة رأس السنة","除夕夜，全家人围坐在一起吃“年夜饭”，也叫“团圆饭”；北方吃饺子，南方吃年糕，鱼象征“年年有余”。｜تجتمع الأسرة كلها على العشاء، ويُسمّى «وجبة لمّ الشمل»؛ في الشمال الجياوزي وفي الجنوب كعك النيانغاو، والسمك رمز «الوفرة كل عام»."],["守岁","السهر حتى الفجر","吃完饭后一家人聊天、看电视，通宵守岁。｜بعد العشاء تتحدث الأسرة وتشاهد التلفاز وتسهر الليل كله."],["放鞭炮","إطلاق المفرقعات","除夕午夜零点，人们燃放鞭炮和烟花，用响声赶走“年”，迎接新年。｜عند منتصف الليل تُطلق المفرقعات والألعاب النارية لطرد «نيان» واستقبال العام الجديد."],["压岁钱","العيدية","长辈把钱装在红包里送给晚辈；“岁”与“祟”谐音，传说压岁钱能压住邪祟，保佑孩子平安。｜يعطي الكبار الصغار نقوداً في ظرف أحمر؛ و«سوي» (عام) تشبه «سوي» (الشر)، فيُقال إنها تكبح الأرواح الشريرة وتحمي الأطفال."],["拜年","زيارات التهنئة","大年初一，人们穿上新衣服，先给家里的长辈拜年，然后走亲访友，互相说吉祥话。｜في اليوم الأول يلبس الناس ثياباً جديدة ويهنئون كبار الأسرة أولاً ثم يزورون الأقارب والأصدقاء ويتبادلون الدعوات الطيبة."]]},{"ul":["新年快乐！｜سنة سعيدة!","恭喜发财！｜مبارك، رزقاً وفيراً!","万事如意！｜كل شيء كما تتمنى!"]}]},{"h":"二、清明节","ar":"عيد تشينغمينغ","b":[{"p":"清明节在每年公历4月5日前后，是二十四节气之一，也是中国最重要的祭祀节日之一。清明时节，天气转暖，万物生长，人们既扫墓祭祖，又春游踏青。｜يقع حول 5 أبريل، وهو أحد «الفصول الشمسية الأربعة والعشرين» ومن أهم أعياد إحياء الذكرى. في هذا الوقت يدفأ الجو وتنمو الأشياء، فيزور الناس القبور ويخرجون لنزهات الربيع."},{"key":"起源：古代帝王有春天到祖先墓前祭拜的“墓祭”礼俗，后世沿用；清明前一两天是寒食节，这天禁止生火，只吃冷食，后来寒食与清明合二为一。｜الأصل: كان الأباطرة القدماء يزورون قبور الأجداد في الربيع، ثم استمرت العادة. وقبل تشينغمينغ بيوم أو يومين «عيد الطعام البارد» يُمنع فيه إشعال النار، ثم اندمج العيدان."},{"p":"介子推的传说｜أسطورة جيه تسي تويه"},{"tl":[["①","春秋时期，晋国公子重耳逃亡在外，饥饿难忍。随从介子推悄悄割下自己腿上的肉，煮汤给他喝。｜في عصر الربيع والخريف هرب الأمير تشونغ إر وكاد يهلك جوعاً، فقطع تابعه جيه تسي تويه لحماً من فخذه وطبخه له حساءً."],["②","十九年后，重耳回国当了国君，就是晋文公。他重赏功臣，却忘了介子推；介子推不愿邀功，带着母亲隐居绵山。｜بعد تسعة عشر عاماً عاد وصار حاكماً (دوق جين ون). كافأ أصحابه ونسي جيه، الذي لم يشأ طلب المكافأة فاعتزل مع أمه في جبل ميان."],["③","晋文公为了逼介子推出山，下令放火烧山。大火烧了三天，介子推母子却抱着一棵柳树被烧死了。｜أمر الحاكم بإحراق الجبل ليُجبره على الخروج، فاحترق ثلاثة أيام وماتت الأم وابنها محتضنين شجرة صفصاف."],["④","晋文公十分悔恨，下令这一天全国禁火，只吃冷食，这就是“寒食节”；第二年他又去祭奠，看见柳树复活，便称它为“清明柳”。｜ندم الحاكم ندماً شديداً وأمر بمنع النار في هذا اليوم في البلاد كلها، وهذا هو «عيد الطعام البارد». وفي العام التالي رأى الصفصافة قد عادت للحياة فسمّاها «صفصاف تشينغمينغ»."]]}]},{"h":"清明习俗","ar":"عادات تشينغمينغ","b":[{"cards":[["扫墓","زيارة القبور","人们到墓地清除杂草，培上新土，摆上鲜花和祭品，烧纸钱，表达对逝者的怀念和敬意。｜ينظّف الناس المقبرة ويضعون التراب الجديد والزهور والقرابين ويحرقون النقود الورقية تعبيراً عن الشوق والاحترام للراحلين."],["踏青","نزهة الربيع","清明正是春光明媚的时节，人们到郊外踏青，欣赏春天的景色。｜في ربيع مشرق يخرج الناس إلى الضواحي ويستمتعون بمناظره."],["插柳","وضع الصفصاف","人们折下柳枝，插在门前或戴在头上，相传可以驱邪，也纪念介子推。｜تُقطع أغصان الصفصاف وتوضع أمام الباب أو على الرأس، ويُقال إنها تطرد الشر وتخلّد ذكرى جيه تسي تويه."],["放风筝","إطلاق الطائرات الورقية","人们还常常放风筝、荡秋千、蹴鞠，让身心得到放松。｜وكثيراً ما يطلقون الطائرات الورقية ويتأرجحون ويلعبون «تسوجو» (كرة قديمة) ليرتاح الجسد والنفس."]]}]},{"h":"三、端午节","ar":"عيد قوارب التنين","b":[{"p":"端午节在农历五月初五，又称端阳节、重午节、龙舟节等。“端”是“开始”的意思，“端午”就是五月初五。它是中国人最重要的传统节日之一，也已被列入世界非物质文化遗产名录。｜يقع في الخامس من الشهر القمري الخامس، ويُسمّى أيضاً عيد دوانيانغ وعيد قوارب التنين. «دوان» تعني «بداية»، فـ«دوان وو» هو اليوم الخامس من الشهر الخامس. وقد أُدرج في قائمة التراث العالمي غير المادي."},{"cards":[["龙图腾崇拜","عبادة طوطم التنين","古代吴越地区以龙为图腾，端午是祭龙的节日。｜كان أهل منطقة وو ويويه القدماء يتخذون التنين طوطماً، وكان العيد لتقديس التنين."],["驱邪避疫","طرد الشر وتجنّب الأوبئة","五月天气渐热，毒虫、疾病增多，古人认为五月是“恶月”，要驱邪避疫。｜مع ارتفاع الحرارة تكثر الحشرات السامة والأمراض، فاعتبر القدماء الشهر الخامس «شهراً سيئاً»."],["纪念屈原","إحياء ذكرى تشو يوان","最广为流传的说法是为了纪念爱国诗人屈原。｜أشهر الروايات أنه لإحياء ذكرى الشاعر الوطني تشو يوان."]]},{"p":"屈原的传说｜أسطورة تشو يوان"},{"tl":[["①","屈原是战国时期楚国的大臣和伟大诗人，主张改革、联齐抗秦，却遭到贵族排挤，被流放。｜وزير وشاعر عظيم من مملكة تشو، دعا للإصلاح والتحالف مع تشي ضد تشين، فحاربه النبلاء ونُفي."],["②","公元前278年，秦军攻破楚国都城，屈原悲愤万分，于五月初五投汨罗江自尽。｜عام 278 ق.م اقتحم جيش تشين عاصمة تشو، فحزن حزناً شديداً وألقى بنفسه في نهر ميلو في اليوم الخامس من الشهر الخامس."],["③","百姓划船抢救，又把粽子投入江中，让鱼虾不去吃他的身体。后来就有了赛龙舟和吃粽子的习俗。｜أسرع الناس بالقوارب لإنقاذه وألقوا الزونغزي في النهر كي لا تأكل الأسماك والروبيان جسده؛ ومن هنا نشأت عادتا سباق القوارب وأكل الزونغزي."]]}]},{"h":"端午习俗","ar":"عادات دوانوو","b":[{"cards":[["赛龙舟","سباق قوارب التنين","龙舟上有鼓手、舵手和许多划桨手，大家随着鼓声齐心协力向前划。龙舟竞渡不仅是纪念屈原，也体现了中华民族团结合作、奋勇拼搏的精神。｜في القارب قارع طبل وموجّه ومجدّفون كثر يجدّفون بقلب واحد على إيقاع الطبل. وهو يعبّر عن روح التعاون والكفاح، وقد انتشر اليوم في بلدان كثيرة."],["吃粽子","أكل الزونغزي","粽子是用糯米和各种馅料包在苇叶或竹叶里，再用线扎紧，煮熟后食用。北方多吃甜粽，南方有咸粽。｜أرز لزج وحشوات تُلفّ بأوراق القصب أو الخيزران وتُربط بخيط ثم تُسلق. في الشمال الحلو غالباً (تمر أحمر وعجينة فاصولياء) وفي الجنوب المالح (لحم خنزير وصفار البيض)."],["挂艾草","تعليق الأرطماسيا","把艾草挂在门上，驱邪避疫。｜تُعلَّق على الباب لطرد الشر والأوبئة."],["佩香囊","حمل الأكياس العطرية","小孩佩戴香囊，用来驱虫避邪。｜يحمل الأطفال أكياساً عطرة لطرد الحشرات والشر."],["喝雄黄酒","نبيذ الزرنيخ الأصفر","古代有喝雄黄酒的习俗。｜عادة قديمة (لم تعد شائعة اليوم)."],["拴五色线","ربط خيوط خمسة ألوان","在手腕上拴五色线，祈求平安。｜تُربط على المعصم طلباً للسلامة."]]},{"key":"甜粽（红枣、豆沙）—北方；咸粽（猪肉、蛋黄）—南方。｜الزونغزي الحلو (التمر الأحمر، عجينة الفاصولياء) في الشمال؛ والمالح (لحم الخنزير، صفار البيض) في الجنوب."}]},{"h":"四、中秋节","ar":"عيد منتصف الخريف","b":[{"p":"中秋节在农历八月十五，正好在秋季中间，所以叫“中秋”。这天晚上月亮又圆又亮，象征着团圆，所以又叫“团圆节”。｜يقع في اليوم الخامس عشر من الشهر القمري الثامن، في منتصف الخريف تماماً. في ليلته يكون القمر مستديراً ساطعاً فيرمز إلى لمّ الشمل، ولذلك يُسمّى «عيد لمّ الشمل»."},{"tl":[["祭月","中秋节起源于古代的祭月活动，古人秋天拜月，感谢收成。｜نشأ من تقديس القمر القديم؛ كانوا يعبدونه في الخريف شكراً على الحصاد."],["唐宋盛行","到唐代，赏月、玩月成为风气；宋代正式定为中秋节。｜في عهد تانغ شاع التأمل في القمر، وفي عهد سونغ اعتُمد رسمياً عيداً."],["今天","中秋节是国家法定节日，也列入非物质文化遗产名录。｜هو اليوم عطلة رسمية ومدرج في قائمة التراث غير المادي."]]},{"p":"嫦娥奔月｜أسطورة تشانغ آه تصعد إلى القمر"},{"tl":[["①","传说远古时候天上有十个太阳，射手后羿射下九个，拯救了百姓。西王母送给他一包长生不老药。｜في القديم كانت في السماء عشر شموس، فأسقط الرامي هو يي تسعاً منها وأنقذ الناس، فأهدته ملكة الغرب إكسير الخلود."],["②","他的妻子嫦娥为了不让坏人逢蒙抢走仙药，自己吞下，身体飘起来，飞到了月亮上。｜ولئلا يسرق الشرير بانغ منغ الإكسير ابتلعته زوجته تشانغ آه، فطفا جسدها وطارت إلى القمر."],["③","后羿十分思念她，八月十五夜晚，在院子里摆上她爱吃的东西。后来人们也在这天拜月，祈求平安团圆。｜اشتاق إليها هو يي كثيراً فوضع في فناء بيته ما تحب من الطعام ليلة 15 أغسطس القمري، ثم صار الناس يكرّمون القمر في هذا اليوم طلباً للسلامة ولمّ الشمل."]]}]},{"h":"中秋习俗","ar":"عادات منتصف الخريف","b":[{"cards":[["赏月","التأمل في القمر","全家人围坐在一起，一边赏月，一边分食月饼。｜تجلس الأسرة معاً تتأمل القمر وتتقاسم كعك القمر."],["吃月饼","أكل كعك القمر","月饼是圆形的点心，形状像满月，寓意团圆美满。常见馅料有莲蓉、豆沙、五仁、蛋黄。｜حلوى مستديرة كالبدر ترمز إلى لمّ الشمل والسعادة؛ من حشواتها عجينة اللوتس والفاصولياء والمكسرات الخمسة وصفار البيض."],["赏桂花","تذوّق زهر الأوزمانثوس","中秋时节桂花盛开，人们赏桂花，吃桂花糕，喝桂花酒，传说月亮里还有一棵桂树。｜يتفتح الأوزمانثوس في هذا الوقت، فيستمتعون برائحته ويأكلون كعكه ويشربون نبيذه، ويُقال إن في القمر شجرة منه."],["拜月","تكريم القمر","人们拜月，祈求平安团圆。｜يكرّم الناس القمر طلباً للسلامة ولمّ الشمل."],["玩花灯","اللعب بالفوانيس","晚上，孩子们提着各种形状的花灯，猜灯谜。｜في المساء يحمل الأطفال فوانيس بأشكال مختلفة ويحلّون ألغازها."],["阖家团圆","اجتماع الأسرة كلها","月光下一家人说说笑笑，共度美好的团圆夜。｜تحت ضوء القمر تتحدث الأسرة وتضحك وتقضي ليلة لمّ شمل جميلة."]]}]}],"terms":[{"zh":"节日","ar":"عيد / مناسبة","py":"jié rì","ex":null},{"zh":"农历","ar":"التقويم القمري الصيني","py":"nóng lì","e "],["响声","放鞭炮"]]},{"t":"order","q":"按顺序排列介子推的故事：","items":["重耳逃亡，介子推割肉煮汤","重耳回国当了晋文公，却忘了介子推","介子推带着母亲隐居绵山","晋文公放火烧山，介子推母子被烧死","晋文公下令禁火，形成寒食节"]},{"t":"order","q":"按顺序排列嫦娥奔月的故事：","items":["后羿射下九个太阳","西王母送给他长生不老药","嫦娥吞下仙药，飞到月亮上","后羿在院子里摆上嫦娥爱吃的东西","人们在八月十五拜月"]},{"t":"mcq","q":"“扫尘”有什么意思？","o":["打扫房屋，除陈布新，扫走晦气","只打扫院子","清洗衣服","祭拜祖先"],"a":0,"why":"«尘» و«陈» تتجانسان صوتياً."},{"t":"mcq","q":"为什么说压岁钱能保佑孩子平安？","o":["因为钱很多","因为“岁”与“祟”谐音，传说能压住邪祟","因为红包是红色的","因为孩子喜欢钱"],"a":1,"why":"تجانس «岁» و«祟»."},{"t":"match","q":"连线：人物和节日","p":[["介子推","清明节"],["屈原","端午节"],["嫦娥","中秋节"],["“年”怪兽","春节"]]},{"t":"tf","q":"端午节只是为了纪念屈原，没有别的起源。","a":false,"why":"للعيد أصول أخرى: عبادة التنين وطرد الأوبئة."},{"t":"tf","q":"北方的粽子多是甜的，南方有咸粽。","a":true,"why":"حسب النص."},{"t":"cloze","q":"春节的年夜饭也叫“___”，北方人吃___，南方人吃年糕。","bank":["团圆饭","饺子","月饼","粽子"],"a":["团圆饭","饺子"]},{"t":"cloze","q":"中秋节的晚上，月亮又圆又亮，象征着___，所以又叫“___节”。","bank":["团圆","团圆","平安","春联"],"a":["团圆","团圆"]},{"t":"mcq","q":"清明节为什么要“禁火，只吃冷食”？","o":["为了省钱","晋文公为了纪念介子推下令禁火","因为天气很热","为了过春节"],"a":1,"why":"أصل «عيد الطعام البارد»."},{"t":"cls","q":"哪些是食物？哪些是活动？","cats":["食物","活动"],"items":[["粽子",0],["月饼",0],["年糕",0],["赛龙舟",1],["放风筝",1],["猜灯谜",1],["饺子",0],["拜年",1]]}],"discuss":[{"q":"请比较春节和你们国家的开斋节（或宰牲节）：它们有什么相同和不同？","ar":"قارن بين عيد الربيع وعيد الفطر (أو الأضحى) في بلدك.","frames":["春节和……都……","不同的是，……","在春节，人们……","而在……，人们……"],"use":["团圆","习俗","节日","传统"],"model":"春节和开斋节都是团圆的节日，家人会聚在一起吃饭。不同的是，春节人们贴春联、放鞭炮，而开斋节人们先去清真寺祈祷。｜عيد الربيع وعيد الفطر كلاهما عيد لمّ شمل تجتمع فيه الأسرة على الطعام. والفرق أن الصينيين يلصقون أبيات الربيع ويطلقون المفرقعات، بينما نذهب نحن أولاً إلى المسجد للصلاة."},{"q":"选择一个中国传统节日，介绍它的起源、传说和习俗。","ar":"اختر عيداً صينياً واشرح أصله وأسطورته وعاداته.","frames":["……节在……","相传……","人们会……","这个节日表达了……"],"use":["传说","习俗","起源","纪念"],"model":"端午节在农历五月初五。相传屈原在这天投江，人们为了纪念他，会赛龙舟、吃粽子。这个节日表达了人们对爱国诗人的怀念。｜يقع عيد دوانوو في الخامس من الشهر القمري الخامس. يُروى أن تشو يوان ألقى بنفسه في النهر في هذا اليوم، فيسابق الناس بالقوارب ويأكلون الزونغزي إحياءً لذكراه."},{"q":"你们国家有没有传统节日的传说？请讲一讲。","ar":"هل لأعياد بلدك قصة أو أسطورة؟ احكها.","frames":["在我们国家，……","故事是这样的：……","后来，……","所以……"],"use":["传说","后来","所以","节日"],"model":"在我们国家，有很多关于节日的故事。故事是这样的：很久以前……后来人们就有了这个习俗。所以每年我们都会庆祝。｜في بلدنا قصص كثيرة عن الأعياد… (أكمل قصتك)."}],"py":{"节":"jié","中国的节日":"zhōng guó de jié rì","中国四大传统节日":"zhōng guó sì dà chuán tǒng jié rì","中国有四大传统节日：春节、清明节、端午节和中秋节。每个节日都有自己的传说、习俗和文化意义。":"zhōng guó yǒu sì dà chuán tǒng jié rì: chūn jié, qīng míng jié, duān wǔ jié hé zhōng qiū jié. měi gè jié rì dōu yǒu zì jǐ de chuán shuō, xí sú hé wén huà yì yì.","节日":"jié rì","日期":"rì qī","主要习俗":"zhǔ yào xí sú","文化意义":"wén huà yì yì","春节":"chūn jié","农历正月初一":"nóng lì zhēng yuè chū yī","贴春联、吃年夜饭、守岁、拜年":"tiē chūn lián, chī nián yè fàn, shǒu suì, bài nián","除旧布新，团圆":"chú jiù bù xīn, tuán yuán","清明节":"qīng míng jié","公历4月5日前后":"gōng lì 4 yuè 5 rì qián hòu","扫墓、踏青、插柳":"sǎo mù, tà qīng, chā liǔ","祭祖，怀念亲人":"jì zǔ, huái niàn qīn rén","端午节":"duān wǔ jié","农历五月初五":"nóng lì wǔ yuè chū wǔ","赛龙舟、吃粽子、挂艾草":"sài lóng zhōu, chī zòng zi, guà ài cǎo","纪念屈原，驱邪避疫":"jì niàn qū yuán, qū xié bì yì","中秋节":"zhōng qiū jié","农历八月十五":"nóng lì bā yuè shí wǔ","赏月、吃月饼":"shǎng yuè, chī yuè bǐng","团圆美满":"tuán yuán měi mǎn","一、春节":"yī, chūn jié","春节，即农历新年，是一年之岁首，就是传统意义上的“年节”，俗称新春、新岁、新年、大年等，又称过年、过大年。":"chūn jié, jí nóng lì xīn nián, shì yī nián zhī suì shǒu, jiù shì chuán tǒng yì yì shàng de “nián jié”, sú chēng xīn chūn, xīn suì, xīn nián, dà nián děng, yòu chēng guò nián, guò dà nián.","除旧布新":"chú jiù bù xīn","迎禧接福":"yíng xǐ jiē fú","拜神祭祖":"bài shén jì zǔ","祈求丰年":"qí qiú fēng nián","起源与发展":"qǐ yuán yǔ fā zhǎn","上古时代":"shàng gǔ shí dài","“岁首祈年祭祀”：农事结束，祭天地、祖先，祈求丰年。":"“suì shǒu qí nián jì sì”: nóng shì jié shù, jì tiān dì, zǔ xiān, qí qiú fēng nián.","立春":"lì chūn","古时“春节”指“立春”；南北朝泛指整个春季。":"gǔ shí “chūn jié” zhǐ “lì chūn”; nán běi cháo fàn zhǐ zhěng gè chūn jì.","辛亥革命":"xīn hài gé mìng","为区别于阳历新年，农历正月初一定名“春节”。":"wèi qū bié yú yáng lì xīn nián, nóng lì zhēng yuè chū yí dìng míng “chūn jié”.","“春节”民俗列入第一批国家级非物质文化遗产名录。":"“chūn jié” mín sú liè rù dì yī pī guó jiā jí fēi wù zhì wén huà yí chǎn míng lù.","年的传说":"nián de chuán shuō","相传古时候有一种叫“年”的怪兽，每到除夕就从深山里出来，伤害人畜。":"xiāng chuán gǔ shí hòu yǒu yī zhǒng jiào “nián” de guài shòu, měi dào chú xī jiù cóng shēn shān lǐ chū lái, shāng hài rén chù.","人们发现“年”害怕红色、火光和响声，于是家家户户贴红纸、点火、放爆竹来赶走它。":"rén men fā xiàn “nián” hài pà hóng sè, huǒ guāng hé xiǎng shēng, yú shì jiā jiā hù hù tiē hóng zhǐ, diǎn huǒ, fàng bào zhú lái gǎn zǒu tā.","“年”怕什么":"“nián” pà shén me","对应的习俗":"duì yìng de xí sú","红色":"hóng sè","贴春联":"tiē chūn lián","火光":"huǒ guāng","守岁":"shǒu suì","响声":"xiǎng shēng","放鞭炮":"fàng biān pào","春节习俗":"chūn jié xí sú","办年货":"bàn nián huò","春节前，家家户户都要采购食品、衣物、装饰品和礼品。":"chūn jié qián, jiā jiā hù hù dōu yào cǎi gòu shí pǐn, yī wù, zhuāng shì pǐn hé lǐ pǐn.","祭灶":"jì zào","传说灶王爷每年腊月二十三上天向玉帝汇报这家人一年的善恶，所以人们要祭灶，摆上糖果。":"chuán shuō zào wáng yé měi nián là yuè èr shí sān shàng tiān xiàng yù dì huì bào zhè jiā rén yī nián de shàn è, suǒ yǐ rén men yào jì zào, bǎi shàng táng guǒ.","扫尘":"sǎo chén","春节前要彻底打扫房屋。“尘”与“陈”谐音，有“除陈布新”的意思。":"chūn jié qián yào chè dǐ dǎ sǎo fáng wū.“chén” yǔ “chén” xié yīn, yǒu “chú chén bù xīn” de yì si.","春联是红纸写的对联，贴在大门两侧；“福”字常常倒着贴，寓意“福到了”。":"chūn lián shì hóng zhǐ xiě de duì lián, tiē zài dà mén liǎng cè;“fú” zì cháng cháng dào zhe tiē, yù yì “fú dào le”.","年夜饭":"nián yè fàn","除夕夜，全家人围坐在一起吃“年夜饭”，也叫“团圆饭”；北方吃饺子，南方吃年糕，鱼象征“年年有余”。":"chú xī yè, quán jiā rén wéi zuò zài yì qǐ chī “nián yè fàn”, yě jiào “tuán yuán fàn”; běi fāng chī jiǎo zi, nán fāng chī nián gāo, yú xiàng zhēng “nián nián yǒu yú”.","吃完饭后一家人聊天、看电视，通宵守岁。":"chī wán fàn hòu yī jiā rén liáo tiān, kàn diàn shì, tōng xiāo shǒu suì.","除夕午夜零点，人们燃放鞭炮和烟花，用响声赶走“年”，迎接新年。":"chú xī wǔ yè líng diǎn, rén men rán fàng biān pào hé yān huā, yòng xiǎng shēng gǎn zǒu “nián”, yíng jiē xīn nián.","压岁钱":"yā suì qián","长辈把钱装在红包里送给晚辈；“岁”与“祟”谐音，传说压岁钱能压住邪祟，保佑孩子平安。":"zhǎng bèi bǎ qián zhuāng zài hóng bāo lǐ sòng gěi wǎn bèi;“suì” yǔ “suì” xié yīn, chuán shuō yā suì qián néng yā zhù xié suì, bǎo yòu hái zi píng ān.","拜年":"bài nián","大年初一，人们穿上新衣服，先给家里的长辈拜年，然后走亲访友，互相说吉祥话。":"dà nián chū yī, rén men chuān shàng xīn yī fú, xiān gěi jiā lǐ de zhǎng bèi bài nián, rán hòu zǒu qīn fǎng yǒu, hù xiāng shuō jí xiáng huà.","新年快乐！":"xīn nián kuài lè!","恭喜发财！":"gōng xǐ fā cái!","万事如意！":"wàn shì rú yì!","二、清明节":"èr, qīng míng jié","清明节在每年公历4月5日前后，是二十四节气之一，也是中国最重要的祭祀节日之一。清明时节，天气转暖，万物生长，人们既扫墓祭祖，又春游踏青。":"qīng míng jié zài měi nián gōng lì 4 yuè 5 rì qián hòu, shì èr shí sì jié qì zhī yī, yě shì zhōng guó zuì zhòng yào de jì sì jié rì zhī yī. qīng míng shí jié, tiān qì zhuǎn nuǎn, wàn wù shēng zhǎng, rén men jì sǎo mù jì zǔ, yòu chūn yóu tà qīng.","起源：古代帝王有春天到祖先墓前祭拜的“墓祭”礼俗，后世沿用；清明前一两天是寒食节，这天禁止生火，只吃冷食，后来寒食与清明合二为一。":"qǐ yuán: gǔ dài dì wáng yǒu chūn tiān dào zǔ xiān mù qián jì bài de “mù jì” lǐ sú, hòu shì yán yòng; qīng míng qián yī liǎng tiān shì hán shí jié, zhè tiān jìn zhǐ shēng huǒ, zhǐ chī lěng shí, hòu lái hán shí yǔ qīng míng hé èr wéi yī.","介子推的传说":"jiè zǐ tuī de chuán shuō","春秋时期，晋国公子重耳逃亡在外，饥饿难忍。随从介子推悄悄割下自己腿上的肉，煮汤给他喝。":"chūn qiū shí qī, jìn guó gōng zǐ chóng ěr táo wáng zài wài, jī è nán rěn. suí cóng jiè zǐ tuī qiāo qiāo gē xià zì jǐ tuǐ shàng de ròu, zhǔ tāng gěi tā hē.","十九年后，重耳回国当了国君，就是晋文公。他重赏功臣，却忘了介子推；介子推不愿邀功，带着母亲隐居绵山。":"shí jiǔ nián hòu, chóng ěr huí guó dāng le guó jūn, jiù shì jìn wén gōng. tā zhòng shǎng gōng chén, què wàng le jiè zǐ tuī; jiè zǐ tuī bù yuàn yāo gōng, dài zhe mǔ qīn yǐn jū mián shān.","晋文公为了逼介子推出山，下令放火烧山。大火烧了三天，介子推母子却抱着一棵柳树被烧死了。":"jìn wén gōng wèi le bī jiè zǐ tuī chū shān, xià lìng fàng huǒ shāo shān. dà huǒ shāo le sān tiān, jiè zǐ tuī mǔ zǐ què bào zhe yī kē liǔ shù bèi shāo sǐ le.","晋文公十分悔恨，下令这一天全国禁火，只吃冷食，这就是“寒食节”；第二年他又去祭奠，看见柳树复活，便称它为“清明柳”。":"jìn wén gōng shí fēn huǐ hèn, xià lìng zhè yī tiān quán guó jìn huǒ, zhǐ chī lěng shí, zhè jiù shì “hán shí jié”; dì èr nián tā yòu qù jì diàn, kàn jiàn liǔ shù fù huó, biàn chēng tā wèi “qīng míng liǔ”.","清明习俗":"qīng míng xí sú","扫墓":"sǎo mù","人们到墓地清除杂草，培上新土，摆上鲜花和祭品，烧纸钱，表达对逝者的怀念和敬意。":"rén men dào mù dì qīng chú zá cǎo, péi shàng xīn tǔ, bǎi shàng xiān huā hé jì pǐn, shāo zhǐ qián, biǎo dá duì shì zhě de huái niàn hé jìng yì.","踏青":"tà qīng","清明正是春光明媚的时节，人们到郊外踏青，欣赏春天的景色。":"qīng míng zhèng shì chūn guāng míng mèi de shí jié, rén men dào jiāo wài tà qīng, xīn shǎng chūn tiān de jǐng sè.","插柳":"chā liǔ","人们折下柳枝，插在门前或戴在头上，相传可以驱邪，也纪念介子推。":"rén men zhé xià liǔ zhī, chā zài mén qián huò dài zài tóu shàng, xiāng chuán kě yǐ qū xié, yě jì niàn jiè zǐ tuī.","放风筝":"fàng fēng zhēng","人们还常常放风筝、荡秋千、蹴鞠，让身心得到放松。":"rén men hái cháng cháng fàng fēng zhēng, dàng qiū qiān, cù jū, ràng shēn xīn dé dào fàng sōng.","三、端午节":"sān, duān wǔ jié","端午节在农历五月初五，又称端阳节、重午节、龙舟节等。“端”是“开始”的意思，“端午”就是五月初五。它是中国人最重要的传统节日之一，也已被列入世界非物质文化遗产名录。":"duān wǔ jié zài nóng lì wǔ yuè chū wǔ, yòu chēng duān yáng jié, chóng wǔ jié, lóng zhōu jié děng.“duān” shì “kāi shǐ” de yì si,“duān wǔ” jiù shì wǔ yuè chū wǔ. tā shì zhōng guó rén zuì zhòng yào de chuán tǒng jié rì zhī yī, yě yǐ bèi liè rù shì jiè fēi wù zhì wén huà yí chǎn míng lù.","龙图腾崇拜":"lóng tú téng chóng bài","古代吴越地区以龙为图腾，端午是祭龙的节日。":"gǔ dài wú yuè dì qū yǐ lóng wèi tú téng, duān wǔ shì jì lóng de jié rì.","驱邪避疫":"qū xié bì yì","五月天气渐热，毒虫、疾病增多，古人认为五月是“恶月”，要驱邪避疫。":"wǔ yuè tiān qì jiàn rè, dú chóng, jí bìng zēng duō, gǔ rén rèn wéi wǔ yuè shì “è yuè”, yào qū xié bì yì.","纪念屈原":"jì niàn qū yuán","最广为流传的说法是为了纪念爱国诗人屈原。":"zuì guǎng wèi liú chuán de shuō fǎ shì wèi le jì niàn ài guó shī rén qū yuán.","屈原的传说":"qū yuán de chuán shuō","屈原是战国时期楚国的大臣和伟大诗人，主张改革、联齐抗秦，却遭到贵族排挤，被流放。":"qū yuán shì zhàn guó shí qī chǔ guó de dà chén hé wěi dà shī rén, zhǔ zhāng gǎi gé, lián qí kàng qín, què zāo dào guì zú pái jǐ, bèi liú fàng.","公元前278年，秦军攻破楚国都城，屈原悲愤万分，于五月初五投汨罗江自尽。":"gōng yuán qián 278 nián, qín jūn gōng pò chǔ guó dū chéng, qū yuán bēi fèn wàn fēn, yú wǔ yuè chū wǔ tóu mì luó jiāng zì jìn.","百姓划船抢救，又把粽子投入江中，让鱼虾不去吃他的身体。后来就有了赛龙舟和吃粽子的习俗。":"bǎi xìng huá chuán qiǎng jiù, yòu bǎ zòng zi tóu rù jiāng zhōng, ràng yú xiā bù qù chī tā de shēn tǐ. hòu lái jiù yǒu le sài lóng zhōu hé chī zòng zi de xí sú.","端午习俗":"duān wǔ xí sú","赛龙舟":"sài lóng zhōu","龙舟上有鼓手、舵手和许多划桨手，大家随着鼓声齐心协力向前划。龙舟竞渡不仅是纪念屈原，也体现了中华民族团结合作、奋勇拼搏的精神。":"lóng zhōu shàng yǒu gǔ shǒu, duò shǒu hé xǔ duō huá jiǎng shǒu, dà jiā suí zhe gǔ shēng qí xīn xié lì xiàng qián huà. lóng zhōu jìng dù bù jǐn shì jì niàn qū yuán, yě tǐ xiàn le zhōng huá mín zú tuán jié hé zuò, fèn yǒng pīn bó de jīng shén.","吃粽子":"chī zòng zi","粽子是用糯米和各种馅料包在苇叶或竹叶里，再用线扎紧，煮熟后食用。北方多吃甜粽，南方有咸粽。":"zòng zi shì yòng nuò mǐ hé gè zhǒng xiàn liào bāo zài wěi yè huò zhú yè lǐ, zài yòng xiàn zhā jǐn, zhǔ shú hòu shí yòng. běi fāng duō chī tián zòng, nán fāng yǒu xián zòng.","挂艾草":"guà ài cǎo","把艾草挂在门上，驱邪避疫。":"bǎ ài cǎo guà zài mén shàng, qū xié bì yì.","佩香囊":"pèi xiāng náng","小孩佩戴香囊，用来驱虫避邪。":"xiǎo hái pèi dài xiāng náng, yòng lái qū chóng bì xié.","喝雄黄酒":"hē xióng huáng jiǔ","古代有喝雄黄酒的习俗。":"gǔ dài yǒu hē xióng huáng jiǔ de xí sú.","拴五色线":"shuān wǔ sè xiàn","在手腕上拴五色线，祈求平安。":"zài shǒu wàn shàng shuān wǔ sè xiàn, qí qiú píng ān.","甜粽（红枣、豆沙）—北方；咸粽（猪肉、蛋黄）—南方。":"tián zòng (hóng zǎo, dòu shā)— běi fāng; xián zòng (zhū ròu, dàn huáng)— nán fāng.","四、中秋节":"sì, zhōng qiū jié","中秋节在农历八月十五，正好在秋季中间，所以叫“中秋”。这天晚上月亮又圆又亮，象征着团圆，所以又叫“团圆节”。":"zhōng qiū jié zài nóng lì bā yuè shí wǔ, zhèng hǎo zài qiū jì zhōng jiān, suǒ yǐ jiào “zhōng qiū”. zhè tiān wǎn shàng yuè liàng yòu yuán yòu liàng, xiàng zhēng zhe tuán yuán, suǒ yǐ yòu jiào “tuán yuán jié”.","祭月":"jì yuè","中秋节起源于古代的祭月活动，古人秋天拜月，感谢收成。":"zhōng qiū jié qǐ yuán yú gǔ dài de jì yuè huó dòng, gǔ rén qiū tiān bài yuè, gǎn xiè shōu chéng.","唐宋盛行":"táng sòng shèng xíng","到唐代，赏月、玩月成为风气；宋代正式定为中秋节。":"dào táng dài, shǎng yuè, wán yuè chéng wéi fēng qì; sòng dài zhèng shì dìng wèi zhōng qiū jié.","今天":"jīn tiān","中秋节是国家法定节日，也列入非物质文化遗产名录。":"zhōng qiū jié shì guó jiā fǎ dìng jié rì, yě liè rù fēi wù zhì wén huà yí chǎn míng lù.","嫦娥奔月":"cháng é bēn yuè","传说远古时候天上有十个太阳，射手后羿射下九个，拯救了百姓。西王母送给他一包长生不老药。":"chuán shuō yuǎn gǔ shí hòu tiān shàng yǒu shí gè tài yáng, shè shǒu hòu yì shè xià jiǔ gè, zhěng jiù le bǎi xìng. xī wáng mǔ sòng gěi tā yī bāo cháng shēng bù lǎo yào.","他的妻子嫦娥为了不让坏人逢蒙抢走仙药，自己吞下，身体飘起来，飞到了月亮上。":"tā de qī zi cháng é wèi le bù ràng huài rén páng méng qiǎng zǒu xiān yào, zì jǐ tūn xià, shēn tǐ piāo qǐ lái, fēi dào le yuè liàng shàng.","后羿十分思念她，八月十五夜晚，在院子里摆上她爱吃的东西。后来人们也在这天拜月，祈求平安团圆。":"hòu yì shí fēn sī niàn tā, bā yuè shí wǔ yè wǎn, zài yuàn zi lǐ bǎi shàng tā ài chī de dōng xī. hòu lái rén men yě zài zhè tiān bài yuè, qí qiú píng ān tuán yuán.","中秋习俗":"zhōng qiū xí sú","赏月":"shǎng yuè","全家人围坐在一起，一边赏月，一边分食月饼。":"quán jiā rén wéi zuò zài yì qǐ, yī biān shǎng yuè, yī biān fēn shí yuè bǐng.","吃月饼":"chī yuè bǐng","月饼是圆形的点心，形状像满月，寓意团圆美满。常见馅料有莲蓉、豆沙、五仁、蛋黄。":"yuè bǐng shì yuán xíng de diǎn xīn, xíng zhuàng xiàng mǎn yuè, yù yì tuán yuán měi mǎn. cháng jiàn xiàn liào yǒu lián róng, dòu shā, wǔ rén, dàn huáng.","赏桂花":"shǎng guì huā","中秋时节桂花盛开，人们赏桂花，吃桂花糕，喝桂花酒，传说月亮里还有一棵桂树。":"zhōng qiū shí jié guì huā shèng kāi, rén men shǎng guì huā, chī guì huā gāo, hē guì huā jiǔ, chuán shuō yuè liàng lǐ hái yǒu yī kē guì shù.","拜月":"bài yuè","人们拜月，祈求平安团圆。":"rén men bài yuè, qí qiú píng ān tuán yuán.","玩花灯":"wán huā dēng","晚上，孩子们提着各种形状的花灯，猜灯谜。":"wǎn shàng, hái zi men tí zhe gè zhǒng xíng zhuàng de huā dēng, cāi dēng mí.","阖家团圆":"hé jiā tuán yuán","月光下一家人说说笑笑，共度美好的团圆夜。":"yuè guāng xià yī jiā rén shuō shuō xiào xiào, gòng dù měi hǎo de tuán yuán yè.","连线：节日和日期":"lián xiàn: jié rì hé rì qī","这些习俗属于哪个节日？":"zhè xiē xí sú shǔ yú nǎ ge jié rì?","连线：“年”怕什么？对应什么习俗？":"lián xiàn:“nián” pà shén me? duì yìng shén me xí sú?","按顺序排列介子推的故事：":"àn shùn xù pái liè jiè zǐ tuī de gù shì:","重耳逃亡，介子推割肉煮汤":"chóng ěr táo wáng, jiè zǐ tuī gē ròu zhǔ tāng","重耳回国当了晋文公，却忘了介子推":"chóng ěr huí guó dāng le jìn wén gōng, què wàng le jiè zǐ tuī","介子推带着母亲隐居绵山":"jiè zǐ tuī dài zhe mǔ qīn yǐn jū mián shān","晋文公放火烧山，介子推母子被烧死":"jìn wén gōng fàng huǒ shāo shān, jiè zǐ tuī mǔ zǐ bèi shāo sǐ","晋文公下令禁火，形成寒食节":"jìn wén gōng xià lìng jìn huǒ, xíng chéng hán shí jié","按顺序排列嫦娥奔月的故事：":"àn shùn xù pái liè cháng é bēn yuè de gù shì:","后羿射下九个太阳":"hòu yì shè xià jiǔ gè tài yáng","西王母送给他长生不老药":"xī wáng mǔ sòng gěi tā cháng shēng bù lǎo yào","嫦娥吞下仙药，飞到月亮上":"cháng é tūn xià xiān yào, fēi dào yuè liàng shàng","后羿在院子里摆上嫦娥爱吃的东西":"hòu yì zài yuàn zi lǐ bǎi shàng cháng é ài chī de dōng xī","人们在八月十五拜月":"rén men zài bā yuè shí wǔ bài yuè","“扫尘”有什么意思？":"“sǎo chén” yǒu shén me yì si?","打扫房屋，除陈布新，扫走晦气":"dǎ sǎo fáng wū, chú chén bù xīn, sǎo zǒu huì qì","只打扫院子":"zhǐ dǎ sǎo yuàn zi","清洗衣服":"qīng xǐ yī fú","祭拜祖先":"jì bài zǔ xiān","为什么说压岁钱能保佑孩子平安？":"wèi shén me shuō yā suì qián néng bǎo yòu hái zi píng ān?","因为钱很多":"yīn wèi qián hěn duō","因为“岁”与“祟”谐音，传说能压住邪祟":"yīn wèi “suì” yǔ “suì” xié yīn, chuán shuō néng yā zhù xié suì","因为红包是红色的":"yīn wèi hóng bāo shì hóng sè de","因为孩子喜欢钱":"yīn wèi hái zi xǐ huān qián","连线：人物和节日":"lián xiàn: rén wù hé jié rì","介子推":"jiè zǐ tuī","屈原":"qū yuán","嫦娥":"cháng é","“年”怪兽":"“nián” guài shòu","端午节只是为了纪念屈原，没有别的起源。":"duān wǔ jié zhǐ shì wèi le jì niàn qū yuán, méi yǒu bié de qǐ yuán.","北方的粽子多是甜的，南方有咸粽。":"běi fāng de zòng zi duō shì tián de, nán fāng yǒu xián zòng.","春节的年夜饭也叫“___”，北方人吃___，南方人吃年糕。":"chūn jié de nián yè fàn yě jiào “___”, běi fāng rén chī ___, nán fāng rén chī nián gāo.","春节的年夜饭也叫“＿＿”，北方人吃＿＿，南方人吃年糕。":"chūn jié de nián yè fàn yě jiào “＿＿”, běi fāng rén chī ＿＿, nán fāng rén chī nián gāo.","团圆饭":"tuán yuán fàn","饺子":"jiǎo zi","月饼":"yuè bǐng","粽子":"zòng zi","中秋节的晚上，月亮又圆又亮，象征着___，所以又叫“___节”。":"zhōng qiū jié de wǎn shàng, yuè liàng yòu yuán yòu liàng, xiàng zhēng zhe ___, suǒ yǐ yòu jiào “___ jié”.","中秋节的晚上，月亮又圆又亮，象征着＿＿，所以又叫“＿＿节”。":"zhōng qiū jié de wǎn shàng, yuè liàng yòu yuán yòu liàng, xiàng zhēng zhe ＿＿, suǒ yǐ yòu jiào “＿＿ jié”.","团圆":"tuán yuán","平安":"píng ān","春联":"chūn lián","清明节为什么要“禁火，只吃冷食”？":"qīng míng jié wèi shén me yào “jìn huǒ, zhǐ chī lěng shí”?","为了省钱":"wèi le shěng qián","晋文公为了纪念介子推下令禁火":"jìn wén gōng wèi le jì niàn jiè zǐ tuī xià lìng jìn huǒ","因为天气很热":"yīn wèi tiān qì hěn rè","为了过春节":"wèi le guò chūn jié","哪些是食物？哪些是活动？":"nǎ xiē shì shí wù? nǎ xiē shì huó dòng?","食物":"shí wù","活动":"huó dòng","年糕":"nián gāo","猜灯谜":"cāi dēng mí","请比较春节和你们国家的开斋节（或宰牲节）：它们有什么相同和不同？":"qǐng bǐ jiào chūn jié hé nǐ men guó jiā de kāi zhāi jié (huò zǎi shēng jié): tā men yǒu shén me xiāng tóng hé bù tóng?","春节和……都……":"chūn jié hé …… dōu ……","不同的是，……":"bù tóng de shì,……","在春节，人们……":"zài chūn jié, rén men ……","而在……，人们……":"ér zài ……, rén men ……","习俗":"xí sú","传统":"chuán tǒng","春节和开斋节都是团圆的节日，家人会聚在一起吃饭。不同的是，春节人们贴春联、放鞭炮，而开斋节人们先去清真寺祈祷。":"chūn jié hé kāi zhāi jié dōu shì tuán yuán de jié rì, jiā rén huì jù zài yì qǐ chī fàn. bù tóng de shì, chūn jié rén men tiē chūn lián, fàng biān pào, ér kāi zhāi jié rén men xiān qù qīng zhēn sì qí dǎo.","选择一个中国传统节日，介绍它的起源、传说和习俗。":"xuǎn zé yí gè zhōng guó chuán tǒng jié rì, jiè shào tā de qǐ yuán, chuán shuō hé xí sú.","……节在……":"…… jié zài ……","相传……":"xiāng chuán ……","人们会……":"rén men huì ……","这个节日表达了……":"zhè ge jié rì biǎo dá le ……","传说":"chuán shuō","起源":"qǐ yuán","纪念":"jì niàn","端午节在农历五月初五。相传屈原在这天投江，人们为了纪念他，会赛龙舟、吃粽子。这个节日表达了人们对爱国诗人的怀念。":"duān wǔ jié zài nóng lì wǔ yuè chū wǔ. xiāng chuán qū yuán zài zhè tiān tóu jiāng, rén men wèi le jì niàn tā, huì sài lóng zhōu, chī zòng zi. zhè ge jié rì biǎo dá le rén men duì ài guó shī rén de huái niàn.","你们国家有没有传统节日的传说？请讲一讲。":"nǐ men guó jiā yǒu méi yǒu chuán tǒng jié rì de chuán shuō? qǐng jiǎng yī jiǎng.","在我们国家，……":"zài wǒ men guó jiā,……","故事是这样的：……":"gù shì shì zhè yàng de:……","后来，……":"hòu lái,……","所以……":"suǒ yǐ ……","后来":"hòu lái","所以":"suǒ yǐ","在我们国家，有很多关于节日的故事。故事是这样的：很久以前……后来人们就有了这个习俗。所以每年我们都会庆祝。":"zài wǒ men guó jiā, yǒu hěn duō guān yú jié rì de gù shì. gù shì shì zhè yàng de: hěn jiǔ yǐ qián …… hòu lái rén men jiù yǒu le zhè ge xí sú. suǒ yǐ měi nián wǒ men dū huì qìng zhù.","春节有很多习俗。":"chūn jié yǒu hěn duō xí sú.","中秋节是团圆的节日。":"zhōng qiū jié shì tuán yuán de jié rì."}},PY=D.py,KEY='noor-cult'+D.n+'-v1',HUB='zh-hub-v1';

function speak(t){if(!window.speechSynthesis){toast('الصوت غير متاح');return}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[“”《》]/g,''));u.lang='zh-CN';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
function toneOf(s){var d=s.normalize('NFD');if(/̄/.test(d))return 1;if(/́/.test(d))return 2;if(/̌/.test(d))return 3;if(/̀/.test(d))return 4;return 5}
function pyh(py){return py.split(' ').map(function(x){return '<span class="t'+toneOf(x)+'">'+esc(x)+'</span>'}).join(' ')}
/* glossary */
var TERMS=D.terms,TI={};TERMS.forEach(function(t,i){TI[t.zh]=i});
var TRE=null;(function(){var a=TERMS.map(function(t){return t.zh}).sort(function(x,y){return y.length-x.length}).map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});if(a.length)TRE=new RegExp(a.join('|'),'g')})();
function gl(z){var e=esc(z);return TRE?e.replace(TRE,function(m){return '<span class="g" data-g="'+TI[m]+'" tabindex="0" role="button">'+m+'</span>'}):e}
function sp(s){var i=s.indexOf('｜');return i<0?[s,'']:[s.slice(0,i),s.slice(i+1)]}
function Z(zh,cls){return '<span class="zb"><span class="zh '+(cls||'')+'" lang="zh">'+gl(zh)+'</span><span class="pyl">'+esc(PY[zh]||'')+'</span></span>'}
function ZA(s,cls){var p=sp(s);return Z(p[0],cls)+(p[1]?'<span class="ar2">'+esc(p[1])+'</span>':'')}
function ZP(zh){return '<span class="zb"><span class="han" lang="zh" dir="ltr">'+esc(zh)+'</span><span class="pyl">'+esc(PY[zh]||'')+'</span></span>'}
/* hub review */
function addRev(zh){var h={};try{h=JSON.parse(localStorage.getItem(HUB)||'{}')||{}}catch(e){}h.dues=h.dues||{};h.dues.cult=h.dues.cult||{};var has=!!h.dues.cult[zh];if(has)delete h.dues.cult[zh];else h.dues.cult[zh]={i:0,t:Date.now()};try{localStorage.setItem(HUB,JSON.stringify(h))}catch(e){}return !has}
function inRev(zh){try{var h=JSON.parse(localStorage.getItem(HUB)||'{}');return !!(h.dues&&h.dues.cult&&h.dues.cult[zh])}catch(e){return false}}
/* ---------- reading ---------- */
function block(b){
 if(b.p)return '<div class="blk p">'+ZA(b.p)+'</div>';
 if(b.key)return '<div class="blk key">'+ZA(b.key)+'</div>';
 if(b.ul)return '<ul class="ul blk">'+b.ul.map(function(x){return '<li>'+ZA(x)+'</li>'}).join('')+'</ul>';
 if(b.tl)return '<ol class="tl blk">'+b.tl.map(function(x){return '<li><span class="lb">'+esc(x[0])+'</span><div>'+ZA(x[1])+'</div></li>'}).join('')+'</ol>';
 if(b.cards)return '<div class="cards blk">'+b.cards.map(function(c){return '<div class="cd"><div class="hd"><b>'+gl(c[0])+'</b><span class="ar">'+esc(c[1])+'</span></div>'+(c[2]?ZA(c[2]):'')+'</div>'}).join('')+'</div>';
 if(b.table){var t=b.table;return '<div class="tw blk"><table><thead><tr>'+t.head.map(function(h){return '<th>'+ZA(h)+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+ZA(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 return '';
}
function reading(){
 return '<div class="banner"><div class="big" aria-hidden="true">'+esc(D.big)+'</div><div><h2>'+esc(D.title_ar)+'</h2><p>'+esc(D.intro_ar)+'</p></div></div>'+
 D.sections.map(function(s){return '<section class="sec"><h2><span class="han" lang="zh" dir="ltr">'+gl(s.h)+'</span><span class="har">'+esc(s.ar)+'</span></h2>'+(PY[s.h]?'<div class="pyl" style="margin-inline-start:15px">'+esc(PY[s.h])+'</div>':'')+s.b.map(block).join('')+
  '<div class="act"><button class="btn" data-say-sec="'+D.sections.indexOf(s)+'">🔊 استمع للقسم</button></div></section>'}).join('');
}
function secText(i){var s=D.sections[i],t=[s.h];s.b.forEach(function(b){['p','key'].forEach(function(k){if(b[k])t.push(sp(b[k])[0])});if(b.ul)b.ul.forEach(function(x){t.push(sp(x)[0])});if(b.tl)b.tl.forEach(function(x){t.push(sp(x[1])[0])});if(b.cards)b.cards.forEach(function(c){t.push(c[0]);if(c[2])t.push(sp(c[2])[0])})});return t.join('。')}
/* ---------- terms ---------- */
var tf='';
function termsTab(){
 return '<div class="card"><b>'+TERMS.length+' مصطلحاً أساسياً</b><p class="mut">اضغط «+» لإضافة المصطلح إلى مفردات مادة الثقافة (للمراجعة بالتكرار المتباعد في الصفحة الرئيسية).</p><div class="act"><button class="btn p" id="addall">أضف كل المصطلحات</button></div></div><div class="tg">'+
 TERMS.map(function(t,i){var on=inRev(t.zh);return '<div class="tm"><div class="z">'+esc(t.zh)+'</div><div><div class="pp">'+pyh(t.py)+'</div><div>'+esc(t.ar)+'</div></div><div style="display:flex;gap:6px"><button class="sm" data-say-t="'+i+'" aria-label="استمع">🔊</button><button class="sm'+(on?' on':'')+'" data-add-t="'+i+'" aria-label="مراجعة">'+(on?'✓':'+')+'</button></div>'+(t.ex?'<div class="ex">'+ZP(sp(t.ex)[0])+'<span class="mut">'+esc(sp(t.ex)[1])+'</span></div>':'')+'</div>'}).join('')+'</div>';
}
/* ---------- practice ---------- */
var TY={mcq:'اختيار من متعدد',tf:'صح أو خطأ',match:'مطابقة',order:'ترتيب',cls:'تصنيف',cloze:'إكمال'};
var B={};
function rec(i,ok){if(!S.prac[i]){S.prac[i]={c:ok?1:0};save();upd()}var q=$('#s'+i);if(q){var r=S.prac[i];q.className='qs '+(r.c?'ok':'no');q.textContent=r.c?'✓ من أول محاولة':'أُنجز'}}
function fb(el,ok,msg){var f=$('.fb',el);f.hidden=false;f.className='fb '+(ok?'ok':'no');f.innerHTML=(ok?'أحسنت! ':'')+(msg?'<span class="ar">'+esc(msg)+'</span>':'')}
B.mcq=function(el,it,i){var b=$('.qb',el),ord=shuf(it.o.map(function(_,k){return k}));
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="opts">'+ord.map(function(k){return '<button class="op" data-k="'+k+'">'+Z(it.o[k])+'</button>'}).join('')+'</div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.disabled)return;var k=+x.dataset.k,ok=k===it.a;[].forEach.call(b.querySelectorAll('.op'),function(o){o.disabled=true;if(+o.dataset.k===it.a)o.classList.add('good')});if(!ok)x.classList.add('bad');rec(i,ok);fb(el,ok,it.why)}};
B.tf=function(el,it,i){var b=$('.qb',el);
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="tf"><button class="op" data-v="1"><span class="zh" style="text-align:center">对 ✓</span></button><button class="op" data-v="0"><span class="zh" style="text-align:center">错 ✗</span></button></div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.disabled)return;var v=x.dataset.v==='1',ok=v===it.a;[].forEach.call(b.querySelectorAll('.op'),function(o){o.disabled=true;if((o.dataset.v==='1')===it.a)o.classList.add('good')});if(!ok)x.classList.add('bad');rec(i,ok);fb(el,ok,it.why)}};
B.match=function(el,it,i){var b=$('.qb',el),R=shuf(it.p.map(function(_,k){return k})),sel=null,left=it.p.length,miss=0;
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="mt"><div class="col" id="L'+i+'">'+it.p.map(function(p,k){return '<button class="op" data-k="'+k+'">'+Z(p[0])+'</button>'}).join('')+'</div><div class="col" id="R'+i+'">'+R.map(function(k){return '<button class="op" data-k="'+k+'">'+Z(it.p[k][1])+'</button>'}).join('')+'</div></div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.classList.contains('done'))return;var side=x.parentNode.id.charAt(0);
  if(side==='L'){[].forEach.call(b.querySelectorAll('#L'+i+' .op'),function(o){o.classList.remove('sel')});x.classList.add('sel');sel=x;return}
  if(!sel){toast('اختر من العمود الأول أولاً');return}
  if(sel.dataset.k===x.dataset.k){sel.classList.remove('sel');sel.classList.add('done');x.classList.add('done');sel=null;left--;if(!left){rec(i,miss===0);fb(el,miss===0,miss?'عدد الأخطاء: '+miss:'')}}
  else{miss++;x.classList.add('flash');setTimeout(function(){x.classList.remove('flash')},500)}}};
B.order=function(el,it,i){var b=$('.qb',el),n=it.items.length,pool=shuf(it.items.map(function(_,k){return k})),pl=[],tries=0;
 if(n>1&&pool.join()===it.items.map(function(_,k){return k}).join())pool.reverse();
 function draw(){b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="line" aria-label="الترتيب">'+pl.map(function(k,j){return '<button class="chip" data-r="'+j+'"><span class="nn">'+(j+1)+'</span>'+Z(it.items[k])+'</button>'}).join('')+(pl.length?'':'<span class="mut">اضغط على العناصر بالترتيب الصحيح</span>')+'</div><div class="pool">'+pool.map(function(k){return '<button class="chip" data-p="'+k+'">'+Z(it.items[k])+'</button>'}).join('')+'</div><div class="act"><button class="btn p" data-chk="1"'+(pool.length?' disabled':'')+'>تحقق</button><button class="btn" data-rs="1">إعادة</button><button class="btn" data-sol="1">أظهر الحل</button></div>'}
 draw();
 b.onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.p!=null){var k=+t.dataset.p;pool.splice(pool.indexOf(k),1);pl.push(k);draw()}
  else if(t.dataset.r!=null){pool.push(pl.splice(+t.dataset.r,1)[0]);draw()}
  else if(t.dataset.rs){pool=pool.concat(pl);pl=[];draw();$('.fb',el).hidden=true}
  else if(t.dataset.sol){pl=it.items.map(function(_,k){return k});pool=[];draw();[].forEach.call(b.querySelectorAll('.line .chip'),function(c){c.classList.add('good')});rec(i,false);fb(el,false,'هذا هو الترتيب الصحيح.')}
  else if(t.dataset.chk){var ok=true;[].forEach.call(b.querySelectorAll('.line .chip'),function(c,j){var g=pl[j]===j;if(!g)ok=false;c.classList.add(g?'good':'bad')});tries++;rec(i,ok&&tries===1);fb(el,ok,ok?'':'بعض العناصر في غير موضعها (الأحمر). اضغط «إعادة» وجرّب مجدداً.')}}};
B.cls=function(el,it,i){var b=$('.qb',el),ch=[];
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="rows">'+it.items.map(function(x,k){return '<div class="rw" data-k="'+k+'">'+Z(x[0])+'<div class="cs">'+it.cats.map(function(c,j){return '<button data-j="'+j+'">'+esc(c)+'</button>'}).join('')+'</div></div>'}).join('')+'</div><div class="act"><button class="btn p" data-chk="1">تحقق</button></div>';
 b.onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.j!=null){var rw=t.closest('.rw'),k=+rw.dataset.k;ch[k]=+t.dataset.j;[].forEach.call(rw.querySelectorAll('button'),function(x){x.classList.toggle('sel',x===t)});rw.classList.remove('good','bad')}
  else if(t.dataset.chk){var good=0,all=it.items.length;if(ch.filter(function(x){return x!=null}).length<all){toast('صنّف كل العناصر أولاً');return}
   [].forEach.call(b.querySelectorAll('.rw'),function(rw){var k=+rw.dataset.k,g=ch[k]===it.items[k][1];if(g)good++;rw.classList.remove('good','bad');rw.classList.add(g?'good':'bad')});
   rec(i,good===all);fb(el,good===all,good+' من '+all+(good<all?' — صحّح العناصر الحمراء وأعد التحقق.':''))}}};
B.cloze=function(el,it,i){var b=$('.qb',el),parts=it.q.split('___'),bank=shuf(it.bank||it.a),h='';
 parts.forEach(function(p,k){h+=esc(p);if(k<parts.length-1)h+='<select data-k="'+k+'" aria-label="الفراغ '+(k+1)+'"><option value="">…</option>'+bank.map(function(w){return '<option>'+esc(w)+'</option>'}).join('')+'</select>'});
 b.innerHTML='<div class="q">'+Z(it.q.replace(/___/g,'＿＿'))+'</div><div class="cz">'+h+'</div><div class="act"><button class="btn p" data-chk="1">تحقق</button></div>';
 b.onclick=function(e){var t=e.target.closest('[data-chk]');if(!t)return;var sels=b.querySelectorAll('select'),good=0;[].forEach.call(sels,function(s,k){var g=s.value===it.a[k];if(g)good++;s.classList.remove('good','bad');s.classList.add(g?'good':'bad')});rec(i,good===sels.length);fb(el,good===sels.length,good+' من '+sels.length)}};
function practice(){return '<div class="card sum"><div><b id="psc">0</b> <span class="mut">/ '+D.practice.length+' أُنجزت</span></div><div class="mut" id="pok"></div><button class="btn" id="prs">إعادة التدريبات</button></div>'+D.practice.map(function(it,i){return '<section class="card pq" data-i="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="qty">'+TY[it.t]+'</span><span class="qs" id="s'+i+'"></span></div><div class="qb"></div><div class="fb" hidden></div></section>'}).join('')}
function initPractice(){D.practice.forEach(function(it,i){var el=$('.pq[data-i="'+i+'"]');B[it.t](el,it,i);var r=S.prac[i];if(r){var q=$('#s'+i);q.className='qs '+(r.c?'ok':'no');q.textContent=r.c?'✓ من أول محاولة':'أُنجز'}})}
/* ---------- discuss ---------- */
function discuss(){return D.discuss.map(function(d,i){return '<section class="card" data-d="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="qty">نقاش وكتابة</span></div><div class="q">'+Z(d.q)+'</div><p class="mut" style="margin-top:4px">'+esc(d.ar)+'</p>'+
 '<div class="fr">'+d.frames.map(function(f,k){return '<button data-fr="'+k+'">'+esc(f)+'</button>'}).join('')+'</div>'+
 '<textarea data-ta="'+i+'" placeholder="اكتب إجابتك بالصينية (٥٠ حرفاً على الأقل)…" lang="zh" aria-label="إجابتك"></textarea>'+
 '<div class="mut" style="margin-top:4px"><span data-cc="'+i+'">0</span> حرفاً · المصطلحات المستخدمة:</div><div class="us">'+d.use.map(function(u){return '<span data-u="'+esc(u)+'">'+esc(u)+'</span>'}).join('')+'</div>'+
 '<details class="md"><summary>نموذج إجابة</summary>'+ZA(d.model)+'<div class="act"><button class="btn" data-say-m="'+i+'">🔊 استمع</button></div></details></section>'}).join('')}
function initDisc(){D.discuss.forEach(function(d,i){var ta=$('[data-ta="'+i+'"]'),v=S.txt[i]||'';ta.value=v;chk(i)})}
function chk(i){var ta=$('[data-ta="'+i+'"]'),el=$('[data-d="'+i+'"]'),v=ta.value;$('[data-cc="'+i+'"]').textContent=v.replace(/\s/g,'').length;[].forEach.call(el.querySelectorAll('[data-u]'),function(s){s.classList.toggle('on',v.indexOf(s.dataset.u)>-1)})}
/* ---------- shell ---------- */
var TABS=[['read','📖 القراءة'],['terms','🔤 المصطلحات'],['prac','✍️ التدريبات'],['disc','💬 نقاش']],tab=S.ui.tab||'read';
function upd(){var pd=Object.keys(S.prac).length,ok=0,k;for(k in S.prac)if(S.prac[k].c)ok++;var dn=D.discuss.filter(function(d,i){return (S.txt[i]||'').replace(/\s/g,'').length>=50}).length,tot=D.practice.length+D.discuss.length;
 $('#pgb').style.width=Math.round((pd+dn)/tot*100)+'%';var a=$('#psc');if(a){a.textContent=pd;$('#pok').textContent=pd?'من أول محاولة: '+ok+' من '+pd:''}}
function show(t){$('#pop').hidden=true;tab=t;S.ui.tab=t;save();[].forEach.call(document.querySelectorAll('.pane'),function(p){p.hidden=p.id!=='p-'+t});$('#tabs').innerHTML=TABS.map(function(x){return '<button class="tab" role="tab" aria-selected="'+(x[0]===t)+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('');window.scrollTo(0,0)}
function init(){
 document.title=D.title_ar+' · '+D.title_zh;$('#ttl').innerHTML='<span class="han" lang="zh" dir="ltr">'+esc(D.title_zh)+'</span><span class="mut" style="display:block;font-size:12px;font-weight:400">'+esc(D.title_ar)+'</span>';
 var tools='<div class="tools"><button class="sw" id="spy" aria-pressed="false">拼音 · البينيين</button><button class="sw" id="sar" aria-pressed="false">الترجمة العربية</button><span class="mut">المصطلحات المسطّرة بنقط: اضغط عليها لمعناها</span></div>';
 $('#main').innerHTML='<div id="p-read" class="pane">'+tools+reading()+'</div><div id="p-terms" class="pane" hidden>'+termsTab()+'</div><div id="p-prac" class="pane" hidden>'+practice()+'</div><div id="p-disc" class="pane" hidden>'+discuss()+'</div>';
 initPractice();initDisc();
 if(S.ui.py)document.body.classList.add('py');if(S.ui.ar)document.body.classList.add('ar');syncSw();show(tab);upd();
}
function syncSw(){$('#spy').setAttribute('aria-pressed',document.body.classList.contains('py'));$('#sar').setAttribute('aria-pressed',document.body.classList.contains('ar'))}
var cur=-1;
function pop(i){var t=TERMS[i];cur=i;var p=$('#pop');p.hidden=false;p.innerHTML='<div class="r"><div class="zz">'+esc(t.zh)+'</div><div><div class="pp" style="font-family:var(--font-py);direction:ltr">'+pyh(t.py)+'</div><div>'+esc(t.ar)+'</div></div><div class="cl" style="display:flex;gap:6px"><button class="sm" data-pop="say" aria-label="استمع">🔊</button><button class="sm'+(inRev(t.zh)?' on':'')+'" data-pop="add" aria-label="مراجعة">'+(inRev(t.zh)?'✓':'+')+'</button><button class="sm" data-pop="x" aria-label="إغلاق">✕</button></div></div>'+(t.ex?'<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">'+ZP(sp(t.ex)[0])+'<span class="mut">'+esc(sp(t.ex)[1])+'</span></div>':'')}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-g],[data-tab],[data-pop],[data-say-sec],[data-say-t],[data-add-t],#addall,#spy,#sar,#prs,[data-fr],[data-say-m]');
 if(!t){if(!e.target.closest('#pop')){$('#pop').hidden=true}return}
 var d=t.dataset;
 if(d.g!=null){speak(TERMS[+d.g].zh);pop(+d.g)}
 else if(d.tab)show(d.tab);
 else if(d.pop){if(d.pop==='x')$('#pop').hidden=true;else if(d.pop==='say')speak(TERMS[cur].zh);else{var on=addRev(TERMS[cur].zh);pop(cur);toast(on?'أُضيف إلى مفردات الثقافة':'أُزيل من المراجعة');refreshTerms()}}
 else if(d.saySec!=null)speak(secText(+d.saySec));
 else if(d.sayT!=null)speak(TERMS[+d.sayT].zh);
 else if(d.addT!=null){var on2=addRev(TERMS[+d.addT].zh);toast(on2?'أُضيف إلى مفردات الثقافة':'أُزيل من المراجعة');refreshTerms()}
 else if(t.id==='addall'){TERMS.forEach(function(x){if(!inRev(x.zh))addRev(x.zh)});toast('أُضيفت كل المصطلحات');refreshTerms()}
 else if(t.id==='spy'||t.id==='sar'){var c=t.id==='spy'?'py':'ar';document.body.classList.toggle(c);S.ui[c]=document.body.classList.contains(c)?1:0;save();syncSw()}
 else if(t.id==='prs'){if(confirm('مسح نتائج التدريبات وإعادتها؟')){S.prac={};save();initPractice();[].forEach.call(document.querySelectorAll('.qs'),function(q){q.textContent='';q.className='qs'});[].forEach.call(document.querySelectorAll('.fb'),function(f){f.hidden=true});upd()}}
 else if(d.fr!=null){var sec=t.closest('[data-d]'),i=+sec.dataset.d,ta=$('textarea',sec),f=D.discuss[i].frames[+d.fr],p=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.value=ta.value.slice(0,p)+f+ta.value.slice(p);ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}
 else if(d.sayM!=null)speak(sp(D.discuss[+d.sayM].model)[0]);
});
function refreshTerms(){var y=window.scrollY;$('#p-terms').innerHTML=termsTab();window.scrollTo(0,y)}
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('g')){e.preventDefault();e.target.click()}});
document.addEventListener('input',function(e){var ta=e.target;if(ta.dataset&&ta.dataset.ta!=null){var i=+ta.dataset.ta;S.txt[i]=ta.value;save();chk(i);upd()}});
$('#th').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')};
init();
})();
