<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img,svg{max-width:100%}</style></head><body><title>الدرس الثالث · الإسلام والقوميات المسلمة في الصين · 伊斯兰教与中国穆斯林民族</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{--bg:#FBF6EE;--surface:#FFFDF9;--surface2:#F3EBDD;--fg:#2B1D18;--muted:#7B6A5E;--line:#E8DCC8;--accent:#B8322A;--accent-fg:#fff;--accent-soft:#F8E4DF;--seal:#B8322A;--seal-fg:#fff;--gold:#C98A0A;--good:#2E7D4F;--good-soft:#DDF0E2;--bad:#B3261E;--bad-soft:#F7DBD8;--c1:#7A4FA3;--c2:#E0952B;--c3:#2F6DB5;--c4:#2E8B57;--t1:#C0392B;--t2:#A66A00;--t3:#1D7A45;--t4:#2759B8;--t5:#6A7B77;
--font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-han:'Noto Serif SC','Songti SC',serif;--font-py:'IBM Plex Sans','Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.7 var(--font-ui);padding:0 max(16px,env(safe-area-inset-left)) 90px}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}h1,h2,h3,p{margin:0}
.han{font-family:var(--font-han)}.py{font-family:var(--font-py)}.mut{color:var(--muted);font-size:14px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:10px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;font-size:17px;line-height:1.3}
.ib{font-size:20px;line-height:1;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.pg{height:6px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tabs{display:flex;gap:4px;margin-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sw{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.sw[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.banner{border-radius:20px;margin-top:12px;padding:22px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface2))}
.banner .big{font:700 52px/1 var(--font-han);color:var(--accent);min-width:1.6em;text-align:center}
.banner h2{font-size:22px;line-height:1.3}.banner p{color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.sec{margin-top:26px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:21px;line-height:1.35;border-inline-start:5px solid var(--accent);padding-inline-start:10px}
.sec>h2 .har{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--font-ui)}
.zb{display:block}.zb .t{display:block}
.pyl{display:none;font:14px/1.5 var(--font-py);color:var(--muted);direction:ltr;text-align:left;margin-top:1px}
body.py .pyl{display:block}
.ar2{display:none;color:var(--muted);font-size:15px;line-height:1.7;margin-top:2px}
body.ar .ar2{display:block}
.zh{font-family:var(--font-han);font-size:19px;line-height:1.95;direction:ltr;text-align:left;display:block}
.blk{margin-top:12px}
.p .zh{font-size:19px}
.g{border-bottom:2px dotted var(--accent);cursor:pointer;padding-bottom:1px}.g:hover,.g.on{background:var(--accent-soft)}
.key{border-inline-start:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:10px;padding:10px 14px}
.key:before{content:'重点 · نقطة مهمة';display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px}
ul.ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.ul li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tl{display:grid;gap:0;position:relative;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl .lb{font:700 15px/1.3 var(--font-han);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 8px;text-align:center;align-self:start;direction:ltr}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.cd .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cd .hd b{font:700 24px/1.2 var(--font-han);direction:ltr}.cd .hd .ar{font-size:13px;color:var(--muted)}
.cd .zh{font-size:16px;line-height:1.75}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:480px;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);vertical-align:top;text-align:start}
th{background:var(--accent-soft);font-family:var(--font-han)}td:first-child{font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .zh,th .zh{font-size:16px;line-height:1.7}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sm{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.sm.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
/* terms */
.tg{display:grid;gap:8px;margin-top:12px}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tm .z{font:700 26px/1.2 var(--font-han);direction:ltr;min-width:2em;text-align:center}
.tm .ex{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.tm .ex .han{font-size:17px;direction:ltr;display:block;text-align:left}
.tm .pp{font-family:var(--font-py);direction:ltr;text-align:start}
/* practice */
.pq{position:relative}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qn{width:28px;height:28px;border-radius:8px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 14px var(--font-py)}
.qty{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:99px;padding:0 10px}
.qs{margin-inline-start:auto;font-size:13px;font-weight:700}.qs.ok{color:var(--good)}.qs.no{color:var(--bad)}
.q .zh{font-size:19px}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:block;width:100%;text-align:start;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.op .zh{font-size:17px;line-height:1.7}
.op.sel{border-color:var(--accent);background:var(--accent-soft)}
.op.good{border-color:var(--good);background:var(--good-soft)}
.op.bad{border-color:var(--bad);background:var(--bad-soft)}
.op:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--good-soft);color:var(--good)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ar{color:var(--fg)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mt .col{display:grid;gap:8px;align-content:start}
.mt .op{min-height:52px;padding:6px 10px}
.mt .op.done{opacity:.55;border-color:var(--good);background:var(--good-soft)}
.mt .op.flash{border-color:var(--bad);background:var(--bad-soft)}
.line{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr;align-items:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:start;max-width:100%}
.chip .zh{font-size:16px;line-height:1.6}
.chip.bad{border-color:var(--bad);background:var(--bad-soft)}.chip.good{border-color:var(--good);background:var(--good-soft)}
.chip .nn{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:var(--seal);color:var(--seal-fg);font:700 12px var(--font-py);margin-inline-end:6px}
.rows{display:grid;gap:8px;margin-top:10px}
.rw{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.rw.good{border-color:var(--good);background:var(--good-soft)}.rw.bad{border-color:var(--bad);background:var(--bad-soft)}
.rw .cs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cs button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font:600 15px var(--font-han)}
.cs button.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cz{font:19px/2.4 var(--font-han);direction:ltr;text-align:left;margin-top:8px}
.cz select{font:inherit;font-size:16px;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:0 6px;margin:0 3px;max-width:100%}
.cz select.good{border-color:var(--good);background:var(--good-soft)}.cz select.bad{border-color:var(--bad);background:var(--bad-soft)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sum b{font:700 22px var(--font-py)}
/* discuss */
textarea{width:100%;min-height:130px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;font:19px/1.8 var(--font-han);margin-top:10px;resize:vertical;direction:ltr;text-align:left}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fr button{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font:600 15px var(--font-han);direction:ltr}
.us{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.us span{font:600 14px var(--font-han);padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.us span.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
details.md{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface2)}
details.md summary{cursor:pointer;font-weight:600;min-height:32px}
/* popover */
#pop{position:fixed;inset-inline:12px;bottom:12px;z-index:30;max-width:560px;margin-inline:auto;background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#pop .r{display:flex;align-items:center;gap:12px}
#pop .zz{font:700 30px/1.2 var(--font-han);direction:ltr;white-space:nowrap}#pop .r>div:nth-child(2){min-width:0;flex:1}
#pop .cl{flex:none}
.toast{position:fixed;inset:auto 16px 90px;margin:auto;max-width:360px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:40}
.foot{text-align:center;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:520px){.mt{grid-template-columns:1fr}.tl li{grid-template-columns:70px 1fr}.banner{grid-template-columns:1fr;text-align:center}}
</style>

<script>
(function(){
var D={"n":3,"big":"民族","title_zh":"伊斯兰教与中国穆斯林民族","title_ar":"الدرس الثالث · الإسلام والقوميات المسلمة في الصين","intro_ar":"كيف دخل الإسلام الصين؟ وما ملامح قومية «الهوي» وقومية «الأويغور»: اللباس والطعام والعادات والمحرّمات.","sections":[{"h":"一、伊斯兰教在中国","ar":"الإسلام في الصين","b":[{"p":"伊斯兰教是世界性的宗教之一，与基督教、佛教并称为世界三大宗教。｜الإسلام من الأديان العالمية، ويُذكر مع المسيحية والبوذية بوصفها الأديان الثلاثة الكبرى في العالم."},{"p":"伊斯兰教的名称｜أسماء الإسلام في الصين"},{"ul":["大食教、大食法｜«دا شي» اسم قديم للعرب (الدولة الإسلامية)","天方教｜«تيانفانغ» اسم قديم للجزيرة العربية","清真教｜«تشينغجن» أي «النقاء والصفاء»","回回教门、回回教、回教｜أسماء ارتبطت بقومية الهوي"]},{"key":"到公元18世纪，中国人民多了解称为“伊斯兰教”。｜وفي القرن الثامن عشر الميلادي صار الصينيون يعرفونه غالباً باسم «يي سي لان جياو» (الإسلام)."}]},{"h":"二、传入与发展","ar":"الدخول والتطور","b":[{"tl":[["7世纪中叶","伊斯兰教开始由阿拉伯传入中国。｜بدأ الإسلام ينتقل من الجزيرة العربية إلى الصين."],["唐、宋、元","这三个朝代是伊斯兰教在中国传播的主要时期。｜هذه الأسر الثلاث هي المرحلة الرئيسية لانتشار الإسلام في الصين."],["长期演变","经过长期的传播、发展和演变，形成了具有民族特色的中国伊斯兰教。｜بعد انتشار وتطور وتحوّل طويل تكوّن إسلام صيني ذو خصائص قومية."],["到明代为止","中国先后有十个少数民族信奉伊斯兰教。｜اعتنقه حتى عهد مينغ عشر قوميات من الأقليات."]]}]},{"h":"三、信奉伊斯兰教的少数民族","ar":"القوميات التي تعتنق الإسلام","b":[{"p":"到明代为止，中国先后有回、维吾尔、哈萨克、乌孜别克、柯尔克孜、塔吉克、塔塔尔、东乡、撒拉、保安等十个少数民族信奉伊斯兰教。｜حتى عهد مينغ اعتنق الإسلام عشر قوميات: الهوي والأويغور والكازاخ والأوزبك والقرغيز والطاجيك والتتار ودونغشيانغ وسالار وباوان."},{"cards":[["回","الهوي",""],["维吾尔","الأويغور",""],["哈萨克","الكازاخ",""],["乌孜别克","الأوزبك",""],["柯尔克孜","القرغيز",""],["塔吉克","الطاجيك",""],["塔塔尔","التتار",""],["东乡","دونغشيانغ",""],["撒拉","السالار",""],["保安","باوان",""]]},{"p":"伊斯兰教对各穆斯林民族的历史文化、伦理道德、生活方式和习俗产生了深刻影响。伊斯兰文化同中国传统文化交流融合，成为各穆斯林民族文化不可分割的组成部分，并丰富了中华民族的历史文化宝库。｜أثّر الإسلام تأثيراً عميقاً في تاريخ القوميات المسلمة وثقافتها وأخلاقها وأسلوب حياتها وعاداتها. وتفاعلت الثقافة الإسلامية مع الثقافة الصينية واندمجت معها، فصارت جزءاً لا يتجزأ من ثقافة هذه القوميات، وأغنت الكنز الثقافي التاريخي للأمة الصينية."}]},{"h":"四、回族","ar":"قومية الهوي","b":[{"ul":["13世纪，大批穆斯林从西辽迁入黄河流域，同当地的汉族、维吾尔族、蒙古族等融合，在长期历史过程中通过通婚等多种形式，逐渐形成了回族。｜في القرن 13 هاجر عدد كبير من المسلمين من «شي لياو» إلى حوض النهر الأصفر واندمجوا مع الهان والأويغور والمغول وغيرهم، وبالزواج وغيره تكوّنت قومية الهوي تدريجياً.","回族主要聚居在宁夏回族自治区，也分布在全国各地；人口有一千多万。｜يتركّز الهوي في منطقة نينغشيا الذاتية الحكم ويتوزعون في أنحاء الصين؛ ويبلغ عددهم أكثر من عشرة ملايين.","当代回族通用汉语，不同地区说不同方言。回族先民东迁初期，同时使用阿拉伯语、波斯语和汉语。｜يتحدث الهوي المعاصرون الصينية بلهجات مختلفة. وفي بدايات هجرة أجدادهم شرقاً كانوا يستخدمون العربية والفارسية والصينية معاً.","伊斯兰教在回族的形成和发展中始终起着不可忽视的作用，回族形成后，各地回族一直延续着这一信仰。｜كان للإسلام دور لا يُهمل في تكوّن الهوي وتطورهم، وظلّوا يحافظون على هذا الإيمان في كل مكان."]},{"cards":[["服饰","اللباس","回族服饰的主要标志在头部。男子们都喜爱戴白色的圆帽，回族妇女常戴盖头。｜علامة لباسهم على الرأس: الرجال يحبون القلنسوة البيضاء المستديرة، والنساء يرتدين غطاء الرأس."],["传统饮食","الطعام التقليدي","回族人的基本饮食以小麦制品、牛肉和羊肉为主；拉面（手工拉面）是其中的重要组成部分。｜غذاؤهم الأساسي منتجات القمح ولحم البقر والضأن، والمعكرونة المسحوبة يدوياً (لاميان) جزء مهم."],["传统节日","الأعياد","回族有三大节日：开斋节、宰牲节（古尔邦节）、圣纪节，最重要的是开斋节，在斋月结束之后。｜للهوي ثلاثة أعياد كبرى: عيد الفطر وعيد الأضحى والمولد النبوي، وأهمها عيد الفطر الذي يأتي بعد انتهاء رمضان."],["禁忌","المحرّمات","回族穆斯林忌食猪肉、狗肉、马肉、驴肉和骡肉，不吃自死的和不是穆斯林屠宰的牲畜肉，不吃动物的血等；必须吃清真寺阿訇或刀师傅屠宰的。｜يتجنب مسلمو الهوي لحم الخنزير والكلب والحصان والحمار والبغل، ولا يأكلون الميتة ولا ما ذبحه غير المسلم ولا الدم؛ ويجب أن يُذبح الحيوان على يد الإمام أو الذابح المعتمد في المسجد."]]}]},{"h":"五、维吾尔族","ar":"قومية الأويغور","b":[{"ul":["维吾尔族是一个多源民族，最主要的来源有两支：一支是来自蒙古草原的回纥人，另一支是南疆绿洲上的土著居民。｜الأويغور شعب متعدد الأصول، أهمها فرعان: «الهويخه» القادمون من سهوب منغوليا، وسكان واحات جنوب شينجيانغ الأصليون.","这两部分人于公元840年大规模汇合，至16世纪初完全融合。｜التقى الفرعان بأعداد كبيرة عام 840م، واكتمل الاندماج في أوائل القرن 16.","维吾尔族的民族语言为维吾尔语，属阿尔泰语系突厥语族，他们普遍信仰伊斯兰教。“维吾尔”意为“联合”。｜لغتهم الأويغورية من الأسرة الألطية، فرع اللغات التركية، وهم يعتنقون الإسلام عموماً. و«ويغور» تعني «الاتحاد».","维吾尔族主要聚居在新疆维吾尔自治区，人口有一千多万。｜يسكنون أساساً منطقة شينجيانغ الأويغورية الذاتية الحكم، ويبلغ عددهم أكثر من عشرة ملايين."]},{"cards":[["服饰","اللباس","维吾尔族不论男女老幼都喜欢戴“尕巴”（四楞花帽），用黑白两色或彩色丝线绣出各种民族形式的花纹图案。｜يحب الجميع ارتداء قبعة «غابا» رباعية الزوايا المطرزة بخيوط بيضاء وسوداء أو ملونة بزخارف قومية."],["传统饮食","الطعام التقليدي","以面食为主，喜食牛羊肉，蔬菜吃得相对较少。常吃的有馕、抓饭、包子、拉面等。｜معظمه من المعجنات مع لحم البقر والضأن وخضار أقل نسبياً: الخبز «نان» والأرز «بولو» والباوزي واللاميان."],["馕","خبز النان","馕是用小麦面或玉米面制成的，在特制的火坑内烤熟，为形状大小和厚薄不一的圆形饼。｜يُصنع من دقيق القمح أو الذرة ويُخبز في حفرة نار خاصة، أقراص مستديرة مختلفة الحجم والسماكة."],["习俗与礼节","العادات والآداب","路遇尊长或朋友，要把右手放在胸口，男子相见要握手；晚辈要先向长辈施礼。｜عند لقاء كبير أو صديق يضع الرجل يده اليمنى على صدره ويصافح، والصغير يبدأ بالتحية للكبير."],["禁忌","المحرّمات","在人际关系中不直接称呼别人的名字，长幼辈之间、师徒之间也忌讳相互直呼对方的名字。｜لا يُنادى الشخص باسمه مباشرة، ويُكره ذلك بين الكبار والصغار وبين المعلم والتلميذ."]]}]},{"h":"六、回族与维吾尔族比较","ar":"مقارنة بين الهوي والأويغور","b":[{"table":{"head":["比较内容｜وجه المقارنة","回族｜الهوي","维吾尔族｜الأويغور"],"rows":[["形成｜التكوّن","13世纪，穆斯林与汉族等融合形成","回纥人与南疆土著融合，16世纪初完成"],["主要聚居地｜الموطن","宁夏回族自治区","新疆维吾尔自治区"],["语言｜اللغة","通用汉语","维吾尔语（突厥语族）"],["特色服饰｜اللباس","白色圆帽、盖头","四楞花帽“尕巴”"],["特色饮食｜الطعام","拉面、牛羊肉","馕、抓饭、拉面、包子"],["人口｜العدد","一千多万","一千多万"]]}},{"key":"共同点：都信仰伊斯兰教，都忌食猪肉，都喜爱面食和牛羊肉。｜القاسم المشترك: الإيمان بالإسلام وتجنب لحم الخنزير وحب المعجنات ولحم البقر والضأن."}]}],"terms":[{"zh":"宗教","ar":"دين","py":"zōng jiào","ex":null},{"zh":"世界三大宗教","ar":"الأديان العالمية الثلاثة الكبرى","py":"shì jiè sān dà zōng jiào","ex":null},{"zh":"大食教","ar":"«دا شي جياو» (اسم قديم للإسلام)","py":"dà shí jiào","ex":null},{"zh":"清真教","ar":"«تشينغجن جياو» (الدين النقي)","py":"qīng zhēn jiào","ex":null},{"zh":"传入","ar":"دخل / انتقل إلى","py":"chuán rù","ex":null},{"zh":"传播","ar":"انتشار / نشر","py":"chuán bō","ex":null},{"zh":"演变","ar":"تطوّر وتحوّل","py":"yǎn biàn","ex":null},{"zh":"形成","ar":"تكوّن / يتشكّل","py":"xíng chéng","ex":null},{"zh":"少数民族","ar":"قومية أقلية","py":"shǎo shù mín zú","ex":"中国有五十六个民族。｜في الصين ست وخمسون قومية."},{"zh":"信奉","ar":"يعتنق / يؤمن بـ","py":"xìn fèng","ex":null},{"zh":"穆斯林","ar":"مسلم","py":"mù sī lín","ex":null},{"zh":"伦理道德","ar":"الأخلاق والقيم","py":"lún lǐ dào dé","ex":null},{"zh":"习俗","ar":"عادات وتقاليد","py":"xí sú","ex":null},{"zh":"深刻","ar":"عميق","py":"shēn kè","ex":null},{"zh":"融合","ar":"اندماج","py":"róng hé","ex":null},{"zh":"不可分割","ar":"لا يتجزأ","py":"bù kě fēn gē","ex":null},{"zh":"丰富","ar":"يُغني","py":"fēng fù","ex":null},{"zh":"宝库","ar":"كنز","py":"bǎo kù","ex":null},{"zh":"通婚","ar":"التزاوج بين القوميات","py":"tōng hūn","ex":null},{"zh":"自治区","ar":"منطقة ذاتية الحكم","py":"zì zhì qū","ex":null},{"zh":"方言","ar":"لهجة","py":"fāng yán","ex":null},{"zh":"先民","ar":"الأسلاف الأوائل","py":"xiān mín","ex":null},{"zh":"东迁","ar":"الهجرة شرقاً","py":"dōng qiān","ex":null},{"zh":"阿拉伯语","ar":"اللغة العربية","py":"ā lā bó yǔ","ex":null},{"zh":"波斯语","ar":"اللغة الفارسية","py":"bō sī yǔ","ex":null},{"zh":"盖头","ar":"غطاء الرأس","py":"gài tou","ex":null},{"zh":"拉面","ar":"اللاميان (معكرونة مسحوبة)","py":"lā miàn","ex":null},{"zh":"开斋节","ar":"عيد الفطر","py":"kāi zhāi jié","ex":null},{"zh":"宰牲节","ar":"عيد الأضحى","py":"zǎi shēng jié","ex":null},{"zh":"圣纪节","ar":"المولد النبوي","py":"shèng jì jié","ex":null},{"zh":"斋月","ar":"شهر رمضان","py":"zhāi yuè","ex":null},{"zh":"禁忌","ar":"المحرّمات / المحظورات","py":"jìn jì","ex":null},{"zh":"清真寺","ar":"المسجد","py":"qīng zhēn sì","ex":null},{"zh":"阿訇","ar":"الإمام (阿訇)","py":"ā hōng","ex":null},{"zh":"屠宰","ar":"الذبح","py":"tú zǎi","ex":null},{"zh":"回纥","ar":"الهويخه (أسلاف الأويغور)","py":"huí hé","ex":null},{"zh":"突厥语族","ar":"فرع اللغات التركية","py":"tū jué yǔ zú","ex":null},{"zh":"尕巴","ar":"قبعة «غابا»","py":"gǎ bā","ex":null},{"zh":"馕","ar":"خبز النان","py":"náng","ex":null},{"zh":"抓饭","ar":"أرز بولو","py":"zhuā fàn","ex":null},{"zh":"尊长","ar":"الكبار والمقام الرفيع","py":"zūn zhǎng","ex":null},{"zh":"施礼","ar":"يؤدي التحية","py":"shī lǐ","ex":null},{"zh":"直呼","ar":"يُنادي مباشرة باسمه","py":"zhí hū","ex":null},{"zh":"聚居","ar":"يسكنون متجمعين","py":"jù jū","ex":null}],"practice":[{"t":"mcq","q":"伊斯兰教是在什么时候开始传入中国的？","o":["公元前2世纪","7世纪中叶","13世纪","18世纪"],"a":1,"why":"«7世纪中叶»."},{"t":"match","q":"连线：古代名称和意思","p":[["大食教","古代对伊斯兰教的称呼"],["天方教","天方指阿拉伯地区"],["清真教","强调“清净、真诚”"],["伊斯兰教","18世纪起中国人常用的名称"]]},{"t":"order","q":"按时间顺序排列：","items":["7世纪中叶伊斯兰教传入中国","唐、宋、元：传播的主要时期","13世纪回族逐渐形成","到明代十个少数民族信奉伊斯兰教","18世纪起多称“伊斯兰教”"]},{"t":"cls","q":"这些特点属于回族还是维吾尔族？","cats":["回族","维吾尔族"],"items":[["主要聚居在宁夏",0],["主要聚居在新疆",1],["当代通用汉语",0],["语言属突厥语族",1],["戴白色圆帽",0],["戴“尕巴”花帽",1],["爱吃馕和抓饭",1],["有开斋节、宰牲节、圣纪节",0],["来源之一是回纥人",1],["13世纪形成于黄河流域",0]]},{"t":"tf","q":"中国有十个少数民族信奉伊斯兰教（到明代为止）。","a":true,"why":"عشر قوميات: الهوي والأويغور والكازاخ وغيرهم."},{"t":"tf","q":"回族最重要的节日是圣纪节。","a":false,"why":"الأهم هو عيد الفطر (开斋节)."},{"t":"mcq","q":"“维吾尔”这个词的意思是什么？","o":["沙漠","联合","草原","骑手"],"a":1,"why":"«ويغور» تعني «الاتحاد»."},{"t":"cloze","q":"馕是用___或玉米面制成的，在特制的___内烤熟。","bank":["小麦面","火坑","牛奶","锅"],"a":["小麦面","火坑"]},{"t":"mcq","q":"伊斯兰文化与中国传统文化的关系是什么？","o":["互相排斥","交流融合，丰富了中华文化","没有关系","完全一样"],"a":1,"why":"تفاعل الثقافتان واندمجتا وأغنتا الكنز الثقافي الصيني."},{"t":"match","q":"连线：食物和民族特点","p":[["拉面","回族饮食的重要组成部分"],["馕","维吾尔族的圆形烤饼"],["抓饭","维吾尔族常吃的主食"],["牛羊肉","回、维吾尔族都喜爱"]]},{"t":"mcq","q":"维吾尔族的习俗中，哪一项是忌讳？","o":["握手","直接称呼别人的名字","戴花帽","吃馕"],"a":1,"why":"لا يُنادى باسمه مباشرة."},{"t":"cloze","q":"回族是在___世纪，由迁入的穆斯林同汉族等___而逐渐形成的。","bank":["13","融合","7","战争"],"a":["13","融合"]}],"discuss":[{"q":"请比较回族、维吾尔族的饮食禁忌和你们国家的饮食习惯有什么相同点。","ar":"قارن محرّمات الطعام عند الهوي والأويغور بعاداتك الغذائية.","frames":["回族……，我们也……","相同的是，……","在饮食方面，……","我觉得……"],"use":["禁忌","清真","习俗","饮食"],"model":"回族不吃猪肉，我们也不吃。相同的是，肉必须按照伊斯兰教的方法屠宰。在饮食方面，我们的习惯很相似。｜لا يأكل الهوي لحم الخنزير ونحن كذلك؛ ويتفق الطرفان على وجوب الذبح على الطريقة الإسلامية. فعاداتنا الغذائية متشابهة."},{"q":"你对回族或维吾尔族的哪一个文化特点最感兴趣？为什么？","ar":"ما أكثر جانب أثار اهتمامك عند الهوي أو الأويغور؟ ولماذا؟","frames":["我对……最感兴趣","因为……","它体现了……","我想了解更多……"],"use":["服饰","饮食","节日","融合"],"model":"我对回族的拉面最感兴趣，因为它体现了伊斯兰饮食和中国面食文化的融合。我想了解更多。｜يهمني لاميان الهوي أكثر، لأنه يجسّد اندماج الطعام الإسلامي وثقافة المعجنات الصينية، وأريد معرفة المزيد."},{"q":"请说一说伊斯兰教在中国是怎样传播和发展的。","ar":"اشرح كيف انتشر الإسلام في الصين وتطور.","frames":["7世纪中叶，……","唐、宋、元时期，……","后来，……","因此，……"],"use":["传入","传播","形成","融合"],"model":"7世纪中叶，伊斯兰教从阿拉伯传入中国。唐、宋、元时期是传播的主要时期。后来，穆斯林同汉族等融合，形成了回族。｜في منتصف القرن السابع انتقل الإسلام من بلاد العرب إلى الصين، وكانت عهود تانغ وسونغ ويوان المرحلة الرئيسية، ثم اندمج المسلمون مع الهان وغيرهم فتكوّن الهوي."}],"py":{"民族":"mín zú","伊斯兰教与中国穆斯林民族":"yī sī lán jiào yǔ zhōng guó mù sī lín mín zú","一、伊斯兰教在中国":"yī, yī sī lán jiào zài zhōng guó","伊斯兰教是世界性的宗教之一，与基督教、佛教并称为世界三大宗教。":"yī sī lán jiào shì shì jiè xìng de zōng jiào zhī yī, yǔ jī dū jiào, fó jiào bìng chēng wèi shì jiè sān dà zōng jiào.","伊斯兰教的名称":"yī sī lán jiào de míng chēng","大食教、大食法":"dà shí jiào, dà shí fǎ","天方教":"tiān fāng jiào","清真教":"qīng zhēn jiào","回回教门、回回教、回教":"huí huí jiào mén, huí huí jiào, huí jiào","到公元18世纪，中国人民多了解称为“伊斯兰教”。":"dào gōng yuán 18 shì jì, zhōng guó rén mín duō liǎo jiě chēng wéi “yī sī lán jiào”.","二、传入与发展":"èr, chuán rù yǔ fā zhǎn","7世纪中叶":"7 shì jì zhōng yè","伊斯兰教开始由阿拉伯传入中国。":"yī sī lán jiào kāi shǐ yóu ā lā bó chuán rù zhōng guó.","唐、宋、元":"táng, sòng, yuán","这三个朝代是伊斯兰教在中国传播的主要时期。":"zhè sān gè cháo dài shì yī sī lán jiào zài zhōng guó chuán bō de zhǔ yào shí qī.","长期演变":"cháng qī yǎn biàn","经过长期的传播、发展和演变，形成了具有民族特色的中国伊斯兰教。":"jīng guò cháng qī de chuán bō, fā zhǎn hé yǎn biàn, xíng chéng le jù yǒu mín zú tè sè de zhōng guó yī sī lán jiào.","到明代为止":"dào míng dài wéi zhǐ","中国先后有十个少数民族信奉伊斯兰教。":"zhōng guó xiān hòu yǒu shí gè shǎo shù mín zú xìn fèng yī sī lán jiào.","三、信奉伊斯兰教的少数民族":"sān, xìn fèng yī sī lán jiào de shǎo shù mín zú","到明代为止，中国先后有回、维吾尔、哈萨克、乌孜别克、柯尔克孜、塔吉克、塔塔尔、东乡、撒拉、保安等十个少数民族信奉伊斯兰教。":"dào míng dài wéi zhǐ, zhōng guó xiān hòu yǒu huí, wéi wú ěr, hā sà kè, wū zī bié kè, kē ěr kè zī, tǎ jí kè, tǎ tǎ ěr, dōng xiāng, sā lā, bǎo ān děng shí gè shǎo shù mín zú xìn fèng yī sī lán jiào.","回":"huí","维吾尔":"wéi wú ěr","哈萨克":"hā sà kè","乌孜别克":"wū zī bié kè","柯尔克孜":"kē ěr kè zī","塔吉克":"tǎ jí kè","塔塔尔":"tǎ tǎ ěr","东乡":"dōng xiāng","撒拉":"sā lā","保安":"bǎo ān","伊斯兰教对各穆斯林民族的历史文化、伦理道德、生活方式和习俗产生了深刻影响。伊斯兰文化同中国传统文化交流融合，成为各穆斯林民族文化不可分割的组成部分，并丰富了中华民族的历史文化宝库。":"yī sī lán jiào duì gè mù sī lín mín zú de lì shǐ wén huà, lún lǐ dào dé, shēng huó fāng shì hé xí sú chǎn shēng le shēn kè yǐng xiǎng. yī sī lán wén huà tóng zhōng guó chuán tǒng wén huà jiāo liú róng hé, chéng wéi gè mù sī lín mín zú wén huà bù kě fēn gē de zǔ chéng bù fèn, bìng fēng fù le zhōng huá mín zú de lì shǐ wén huà bǎo kù.","四、回族":"sì, huí zú","13世纪，大批穆斯林从西辽迁入黄河流域，同当地的汉族、维吾尔族、蒙古族等融合，在长期历史过程中通过通婚等多种形式，逐渐形成了回族。":"13 shì jì, dà pī mù sī lín cóng xī liáo qiān rù huáng hé liú yù, tóng dāng dì de hàn zú, wéi wú ěr zú, měng gǔ zú děng róng hé, zài cháng qī lì shǐ guò chéng zhōng tōng guò tōng hūn děng duō zhǒng xíng shì, zhú jiàn xíng chéng le huí zú.","回族主要聚居在宁夏回族自治区，也分布在全国各地；人口有一千多万。":"huí zú zhǔ yào jù jū zài níng xià huí zú zì zhì qū, yě fēn bù zài quán guó gè dì; rén kǒu yǒu yī qiān duō wàn.","当代回族通用汉语，不同地区说不同方言。回族先民东迁初期，同时使用阿拉伯语、波斯语和汉语。":"dāng dài huí zú tōng yòng hàn yǔ, bù tóng dì qū shuō bù tóng fāng yán. huí zú xiān mín dōng qiān chū qī, tóng shí shǐ yòng ā lā bó yǔ, bō sī yǔ hé hàn yǔ.","伊斯兰教在回族的形成和发展中始终起着不可忽视的作用，回族形成后，各地回族一直延续着这一信仰。":"yī sī lán jiào zài huí zú de xíng chéng hé fā zhǎn zhōng shǐ zhōng qǐ zhe bù kě hū shì de zuò yòng, huí zú xíng chéng hòu, gè dì huí zú yì zhí yán xù zhe zhè yī xìn yǎng.","服饰":"fú shì","回族服饰的主要标志在头部。男子们都喜爱戴白色的圆帽，回族妇女常戴盖头。":"huí zú fú shì de zhǔ yào biāo zhì zài tóu bù. nán zi men dōu xǐ ài dài bái sè de yuán mào, huí zú fù nǚ cháng dài gài tou.","传统饮食":"chuán tǒng yǐn shí","回族人的基本饮食以小麦制品、牛肉和羊肉为主；拉面（手工拉面）是其中的重要组成部分。":"huí zú rén de jī běn yǐn shí yǐ xiǎo mài zhì pǐn, niú ròu hé yáng ròu wéi zhǔ; lā miàn (shǒu gōng lā miàn) shì qí zhōng de zhòng yào zǔ chéng bù fèn.","传统节日":"chuán tǒng jié rì","回族有三大节日：开斋节、宰牲节（古尔邦节）、圣纪节，最重要的是开斋节，在斋月结束之后。":"huí zú yǒu sān dà jié rì: kāi zhāi jié, zǎi shēng jié (gǔ ěr bāng jié), shèng jì jié, zuì zhòng yào de shì kāi zhāi jié, zài zhāi yuè jié shù zhī hòu.","禁忌":"jìn jì","回族穆斯林忌食猪肉、狗肉、马肉、驴肉和骡肉，不吃自死的和不是穆斯林屠宰的牲畜肉，不吃动物的血等；必须吃清真寺阿訇或刀师傅屠宰的。":"huí zú mù sī lín jì shí zhū ròu, gǒu ròu, mǎ ròu, lǘ ròu hé luó ròu, bù chī zì sǐ de hé bú shì mù sī lín tú zǎi de shēng chù ròu, bù chī dòng wù de xuè děng; bì xū chī qīng zhēn sì ā hōng huò dāo shī fù tú zǎi de.","五、维吾尔族":"wǔ, wéi wú ěr zú","维吾尔族是一个多源民族，最主要的来源有两支：一支是来自蒙古草原的回纥人，另一支是南疆绿洲上的土著居民。":"wéi wú ěr zú shì yí gè duō yuán mín zú, zuì zhǔ yào de lái yuán yǒu liǎng zhī: yī zhī shì lái zì méng gǔ cǎo yuán de huí hé rén, lìng yī zhī shì nán jiāng lǜ zhōu shàng de tǔ zhù jū mín.","这两部分人于公元840年大规模汇合，至16世纪初完全融合。":"zhè liǎng bù fèn rén yú gōng yuán 840 nián dà guī mó huì hé, zhì 16 shì jì chū wán quán róng hé.","维吾尔族的民族语言为维吾尔语，属阿尔泰语系突厥语族，他们普遍信仰伊斯兰教。“维吾尔”意为“联合”。":"wéi wú ěr zú de mín zú yǔ yán wèi wéi wú ěr yǔ, shǔ ā ěr tài yǔ xì tū jué yǔ zú, tā men pǔ biàn xìn yǎng yī sī lán jiào.“wéi wú ěr” yì wèi “lián hé”.","维吾尔族主要聚居在新疆维吾尔自治区，人口有一千多万。":"wéi wú ěr zú zhǔ yào jù jū zài xīn jiāng wéi wú ěr zì zhì qū, rén kǒu yǒu yī qiān duō wàn.","维吾尔族不论男女老幼都喜欢戴“尕巴”（四楞花帽），用黑白两色或彩色丝线绣出各种民族形式的花纹图案。":"wéi wú ěr zú bù lùn nán nǚ lǎo yòu dōu xǐ huān dài “gǎ bā”(sì léng huā mào), yòng hēi bái liǎng sè huò cǎi sè sī xiàn xiù chū gè zhǒng mín zú xíng shì de huā wén tú àn.","以面食为主，喜食牛羊肉，蔬菜吃得相对较少。常吃的有馕、抓饭、包子、拉面等。":"yǐ miàn shí wéi zhǔ, xǐ shí niú yáng ròu, shū cài chī dé xiāng duì jiào shǎo. cháng chī de yǒu náng, zhuā fàn, bāo zi, lā miàn děng.","馕":"náng","馕是用小麦面或玉米面制成的，在特制的火坑内烤熟，为形状大小和厚薄不一的圆形饼。":"náng shì yòng xiǎo mài miàn huò yù mǐ miàn zhì chéng de, zài tè zhì de huǒ kēng nèi kǎo shú, wèi xíng zhuàng dà xiǎo hé hòu bó bù yī de yuán xíng bǐng.","习俗与礼节":"xí sú yǔ lǐ jié","路遇尊长或朋友，要把右手放在胸口，男子相见要握手；晚辈要先向长辈施礼。":"lù yù zūn zhǎng huò péng yǒu, yào bǎ yòu shǒu fàng zài xiōng kǒu, nán zi xiāng jiàn yào wò shǒu; wǎn bèi yào xiān xiàng zhǎng bèi shī lǐ.","在人际关系中不直接称呼别人的名字，长幼辈之间、师徒之间也忌讳相互直呼对方的名字。":"zài rén jì guān xì zhōng bù zhí jiē chēng hū bié rén de míng zì, zhǎng yòu bèi zhī jiān, shī tú zhī jiān yě jì huì xiāng hù zhí hū duì fāng de míng zì.","六、回族与维吾尔族比较":"liù, huí zú yǔ wéi wú ěr zú bǐ jiào","比较内容":"bǐ jiào nèi róng","回族":"huí zú","维吾尔族":"wéi wú ěr zú","形成":"xíng chéng","13世纪，穆斯林与汉族等融合形成":"13 shì jì, mù sī lín yǔ hàn zú děng róng hé xíng chéng","回纥人与南疆土著融合，16世纪初完成":"huí hé rén yǔ nán jiāng tǔ zhù róng hé,16 shì jì chū wán chéng","主要聚居地":"zhǔ yào jù jū dì","宁夏回族自治区":"níng xià huí zú zì zhì qū","新疆维吾尔自治区":"xīn jiāng wéi wú ěr zì zhì qū","语言":"yǔ yán","通用汉语":"tōng yòng hàn yǔ","维吾尔语（突厥语族）":"wéi wú ěr yǔ (tū jué yǔ zú)","特色服饰":"tè sè fú shì","白色圆帽、盖头":"bái sè yuán mào, gài tou","四楞花帽“尕巴”":"sì léng huā mào “gǎ bā”","特色饮食":"tè sè yǐn shí","拉面、牛羊肉":"lā miàn, niú yáng ròu","馕、抓饭、拉面、包子":"náng, zhuā fàn, lā miàn, bāo zi","人口":"rén kǒu","一千多万":"yī qiān duō wàn","共同点：都信仰伊斯兰教，都忌食猪肉，都喜爱面食和牛羊肉。":"gòng tóng diǎn: dōu xìn yǎng yī sī lán jiào, dōu jì shí zhū ròu, dōu xǐ ài miàn shí hé niú yáng ròu.","伊斯兰教是在什么时候开始传入中国的？":"yī sī lán jiào shì zài shén me shí hòu kāi shǐ chuán rù zhōng guó de?","公元前2世纪":"gōng yuán qián 2 shì jì","连线：古代名称和意思":"lián xiàn: gǔ dài míng chēng hé yì si","大食教":"dà shí jiào","古代对伊斯兰教的称呼":"gǔ dài duì yī sī lán jiào de chēng hū","天方指阿拉伯地区":"tiān fāng zhǐ ā lā bó dì qū","强调“清净、真诚”":"qiáng diào “qīng jìng, zhēn chéng”","伊斯兰教":"yī sī lán jiào","18世纪起中国人常用的名称":"18 shì jì qǐ zhōng guó rén cháng yòng de míng chēng","按时间顺序排列：":"àn shí jiān shùn xù pái liè:","7世纪中叶伊斯兰教传入中国":"7 shì jì zhōng yè yī sī lán jiào chuán rù zhōng guó","唐、宋、元：传播的主要时期":"táng, sòng, yuán: chuán bō de zhǔ yào shí qī","13世纪回族逐渐形成":"13 shì jì huí zú zhú jiàn xíng chéng","到明代十个少数民族信奉伊斯兰教":"dào míng dài shí gè shǎo shù mín zú xìn fèng yī sī lán jiào","18世纪起多称“伊斯兰教”":"18 shì jì qǐ duō chēng “yī sī lán jiào”","这些特点属于回族还是维吾尔族？":"zhè xiē tè diǎn shǔ yú huí zú hái shì wéi wú ěr zú?","主要聚居在宁夏":"zhǔ yào jù jū zài níng xià","主要聚居在新疆":"zhǔ yào jù jū zài xīn jiāng","当代通用汉语":"dāng dài tōng yòng hàn yǔ","语言属突厥语族":"yǔ yán shǔ tū jué yǔ zú","戴白色圆帽":"dài bái sè yuán mào","戴“尕巴”花帽":"dài “gǎ bā” huā mào","爱吃馕和抓饭":"ài chī náng hé zhuā fàn","有开斋节、宰牲节、圣纪节":"yǒu kāi zhāi jié, zǎi shēng jié, shèng jì jié","来源之一是回纥人":"lái yuán zhī yī shì huí hé rén","13世纪形成于黄河流域":"13 shì jì xíng chéng yú huáng hé liú yù","中国有十个少数民族信奉伊斯兰教（到明代为止）。":"zhōng guó yǒu shí gè shǎo shù mín zú xìn fèng yī sī lán jiào (dào míng dài wéi zhǐ).","回族最重要的节日是圣纪节。":"huí zú zuì zhòng yào de jié rì shì shèng jì jié.","“维吾尔”这个词的意思是什么？":"“wéi wú ěr” zhè ge cí de yì si shì shén me?","沙漠":"shā mò","联合":"lián hé","草原":"cǎo yuán","骑手":"qí shǒu","馕是用___或玉米面制成的，在特制的___内烤熟。":"náng shì yòng ___ huò yù mǐ miàn zhì chéng de, zài tè zhì de ___ nèi kǎo shú.","馕是用＿＿或玉米面制成的，在特制的＿＿内烤熟。":"náng shì yòng ＿＿ huò yù mǐ miàn zhì chéng de, zài tè zhì de ＿＿ nèi kǎo shú.","小麦面":"xiǎo mài miàn","火坑":"huǒ kēng","牛奶":"niú nǎi","锅":"guō","伊斯兰文化与中国传统文化的关系是什么？":"yī sī lán wén huà yǔ zhōng guó chuán tǒng wén huà de guān xì shì shén me?","互相排斥":"hù xiāng pái chì","交流融合，丰富了中华文化":"jiāo liú róng hé, fēng fù le zhōng huá wén huà","没有关系":"méi yǒu guān xì","完全一样":"wán quán yī yàng","连线：食物和民族特点":"lián xiàn: shí wù hé mín zú tè diǎn","拉面":"lā miàn","回族饮食的重要组成部分":"huí zú yǐn shí de zhòng yào zǔ chéng bù fèn","维吾尔族的圆形烤饼":"wéi wú ěr zú de yuán xíng kǎo bǐng","抓饭":"zhuā fàn","维吾尔族常吃的主食":"wéi wú ěr zú cháng chī de zhǔ shí","牛羊肉":"niú yáng ròu","回、维吾尔族都喜爱":"huí, wéi wú ěr zú dōu xǐ ài","维吾尔族的习俗中，哪一项是忌讳？":"wéi wú ěr zú de xí sú zhōng, nǎ yī xiàng shì jì huì?","握手":"wò shǒu","直接称呼别人的名字":"zhí jiē chēng hū bié rén de míng zì","戴花帽":"dài huā mào","吃馕":"chī náng","回族是在___世纪，由迁入的穆斯林同汉族等___而逐渐形成的。":"huí zú shì zài ___ shì jì, yóu qiān rù de mù sī lín tóng hàn zú děng ___ ér zhú jiàn xíng chéng de.","回族是在＿＿世纪，由迁入的穆斯林同汉族等＿＿而逐渐形成的。":"huí zú shì zài ＿＿ shì jì, yóu qiān rù de mù sī lín tóng hàn zú děng ＿＿ ér zhú jiàn xíng chéng de.","融合":"róng hé","战争":"zhàn zhēng","请比较回族、维吾尔族的饮食禁忌和你们国家的饮食习惯有什么相同点。":"qǐng bǐ jiào huí zú, wéi wú ěr zú de yǐn shí jìn jì hé nǐ men guó jiā de yǐn shí xí guàn yǒu shén me xiāng tóng diǎn.","回族……，我们也……":"huí zú ……, wǒ men yě ……","相同的是，……":"xiāng tóng de shì,……","在饮食方面，……":"zài yǐn shí fāng miàn,……","我觉得……":"wǒ jué de ……","清真":"qīng zhēn","习俗":"xí sú","饮食":"yǐn shí","回族不吃猪肉，我们也不吃。相同的是，肉必须按照伊斯兰教的方法屠宰。在饮食方面，我们的习惯很相似。":"huí zú bù chī zhū ròu, wǒ men yě bù chī. xiāng tóng de shì, ròu bì xū àn zhào yī sī lán jiào de fāng fǎ tú zǎi. zài yǐn shí fāng miàn, wǒ men de xí guàn hěn xiāng sì.","你对回族或维吾尔族的哪一个文化特点最感兴趣？为什么？":"nǐ duì huí zú huò wéi wú ěr zú de nǎ yí gè wén huà tè diǎn zuì gǎn xìng qù? wèi shén me?","我对……最感兴趣":"wǒ duì …… zuì gǎn xìng qù","因为……":"yīn wèi ……","它体现了……":"tā tǐ xiàn le ……","我想了解更多……":"wǒ xiǎng liǎo jiě gèng duō ……","节日":"jié rì","我对回族的拉面最感兴趣，因为它体现了伊斯兰饮食和中国面食文化的融合。我想了解更多。":"wǒ duì huí zú de lā miàn zuì gǎn xìng qù, yīn wèi tā tǐ xiàn le yī sī lán yǐn shí hé zhōng guó miàn shí wén huà de róng hé. wǒ xiǎng liǎo jiě gèng duō.","请说一说伊斯兰教在中国是怎样传播和发展的。":"qǐng shuō yī shuō yī sī lán jiào zài zhōng guó shì zěn yàng chuán bō hé fā zhǎn de.","7世纪中叶，……":"7 shì jì zhōng yè,……","唐、宋、元时期，……":"táng, sòng, yuán shí qī,……","后来，……":"hòu lái,……","因此，……":"yīn cǐ,……","传入":"chuán rù","传播":"chuán bō","7世纪中叶，伊斯兰教从阿拉伯传入中国。唐、宋、元时期是传播的主要时期。后来，穆斯林同汉族等融合，形成了回族。":"7 shì jì zhōng yè, yī sī lán jiào cóng ā lā bó chuán rù zhōng guó. táng, sòng, yuán shí qī shì chuán bō de zhǔ yào shí qī. hòu lái, mù sī lín tóng hàn zú děng róng hé, xíng chéng le huí zú.","中国有五十六个民族。":"zhōng guó yǒu wǔ shí liù gè mín zú."}},PY=D.py,KEY='noor-cult'+D.n+'-v1',HUB='zh-hub-v1';
var S={prac:{},txt:{},ui:{}};try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in o)S[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2200)}
var voice=null;function pick(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.filter(function(x){return /^zh/i.test(x.lang)})[0]||null}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function speak(t){if(!window.speechSynthesis){toast('الصوت غير متاح');return}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[“”《》]/g,''));u.lang='zh-CN';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
function toneOf(s){var d=s.normalize('NFD');if(/̄/.test(d))return 1;if(/́/.test(d))return 2;if(/̌/.test(d))return 3;if(/̀/.test(d))return 4;return 5}
function pyh(py){return py.split(' ').map(function(x){return '<span class="t'+toneOf(x)+'">'+esc(x)+'</span>'}).join(' ')}
/* glossary */
var TERMS=D.terms,TI={};TERMS.forEach(function(t,i){TI[t.zh]=i});
var TRE=null;(function(){var a=TERMS.map(function(t){return t.zh}).sort(function(x,y){return y.length-x.length}).map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});if(a.length)TRE=new RegExp(a.join('|'),'g')})();
function gl(z){var e=esc(z);return TRE?e.replace(TRE,function(m){return '<span class="g" data-g="'+TI[m]+'" tabindex="0" role="button">'+m+'</span>'}):e}
function sp(s){var i=s.indexOf('｜');return i<0?[s,'']:[s.slice(0,i),s.slice(i+1)]}
function Z(zh,cls){return '<span class="zb"><span class="zh '+(cls||'')+'" lang="zh">'+gl(zh)+'</span><span class="pyl">'+esc(PY[zh]||'')+'</span></span>'}
function ZA(s,cls){var p=sp(s);return Z(p[0],cls)+(p[1]?'<span class="ar2">'+esc(p[1])+'</span>':'')}
function ZP(zh){return '<span class="zb"><span class="han" lang="zh" dir="ltr">'+esc(zh)+'</span><span class="pyl">'+esc(PY[zh]||'')+'</span></span>'}
/* hub review */
function addRev(zh){var h={};try{h=JSON.parse(localStorage.getItem(HUB)||'{}')||{}}catch(e){}h.dues=h.dues||{};h.dues.cult=h.dues.cult||{};var has=!!h.dues.cult[zh];if(has)delete h.dues.cult[zh];else h.dues.cult[zh]={i:0,t:Date.now()};try{localStorage.setItem(HUB,JSON.stringify(h))}catch(e){}return !has}
function inRev(zh){try{var h=JSON.parse(localStorage.getItem(HUB)||'{}');return !!(h.dues&&h.dues.cult&&h.dues.cult[zh])}catch(e){return false}}
/* ---------- reading ---------- */
function block(b){
 if(b.p)return '<div class="blk p">'+ZA(b.p)+'</div>';
 if(b.key)return '<div class="blk key">'+ZA(b.key)+'</div>';
 if(b.ul)return '<ul class="ul blk">'+b.ul.map(function(x){return '<li>'+ZA(x)+'</li>'}).join('')+'</ul>';
 if(b.tl)return '<ol class="tl blk">'+b.tl.map(function(x){return '<li><span class="lb">'+esc(x[0])+'</span><div>'+ZA(x[1])+'</div></li>'}).join('')+'</ol>';
 if(b.cards)return '<div class="cards blk">'+b.cards.map(function(c){return '<div class="cd"><div class="hd"><b>'+gl(c[0])+'</b><span class="ar">'+esc(c[1])+'</span></div>'+(c[2]?ZA(c[2]):'')+'</div>'}).join('')+'</div>';
 if(b.table){var t=b.table;return '<div class="tw blk"><table><thead><tr>'+t.head.map(function(h){return '<th>'+ZA(h)+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+ZA(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 return '';
}
function reading(){
 return '<div class="banner"><div class="big" aria-hidden="true">'+esc(D.big)+'</div><div><h2>'+esc(D.title_ar)+'</h2><p>'+esc(D.intro_ar)+'</p></div></div>'+
 D.sections.map(function(s){return '<section class="sec"><h2><span class="han" lang="zh" dir="ltr">'+gl(s.h)+'</span><span class="har">'+esc(s.ar)+'</span></h2>'+(PY[s.h]?'<div class="pyl" style="margin-inline-start:15px">'+esc(PY[s.h])+'</div>':'')+s.b.map(block).join('')+
  '<div class="act"><button class="btn" data-say-sec="'+D.sections.indexOf(s)+'">🔊 استمع للقسم</button></div></section>'}).join('');
}
function secText(i){var s=D.sections[i],t=[s.h];s.b.forEach(function(b){['p','key'].forEach(function(k){if(b[k])t.push(sp(b[k])[0])});if(b.ul)b.ul.forEach(function(x){t.push(sp(x)[0])});if(b.tl)b.tl.forEach(function(x){t.push(sp(x[1])[0])});if(b.cards)b.cards.forEach(function(c){t.push(c[0]);if(c[2])t.push(sp(c[2])[0])})});return t.join('。')}
/* ---------- terms ---------- */
var tf='';
function termsTab(){
 return '<div class="card"><b>'+TERMS.length+' مصطلحاً أساسياً</b><p class="mut">اضغط «+» لإضافة المصطلح إلى مفردات مادة الثقافة (للمراجعة بالتكرار المتباعد في الصفحة الرئيسية).</p><div class="act"><button class="btn p" id="addall">أضف كل المصطلحات</button></div></div><div class="tg">'+
 TERMS.map(function(t,i){var on=inRev(t.zh);return '<div class="tm"><div class="z">'+esc(t.zh)+'</div><div><div class="pp">'+pyh(t.py)+'</div><div>'+esc(t.ar)+'</div></div><div style="display:flex;gap:6px"><button class="sm" data-say-t="'+i+'" aria-label="استمع">🔊</button><button class="sm'+(on?' on':'')+'" data-add-t="'+i+'" aria-label="مراجعة">'+(on?'✓':'+')+'</button></div>'+(t.ex?'<div class="ex">'+ZP(sp(t.ex)[0])+'<span class="mut">'+esc(sp(t.ex)[1])+'</span></div>':'')+'</div>'}).join('')+'</div>';
}
/* ---------- practice ---------- */
var TY={mcq:'اختيار من متعدد',tf:'صح أو خطأ',match:'مطابقة',order:'ترتيب',cls:'تصنيف',cloze:'إكمال'};
var B={};
function rec(i,ok){if(!S.prac[i]){S.prac[i]={c:ok?1:0};save();upd()}var q=$('#s'+i);if(q){var r=S.prac[i];q.className='qs '+(r.c?'ok':'no');q.textContent=r.c?'✓ من أول محاولة':'أُنجز'}}
function fb(el,ok,msg){var f=$('.fb',el);f.hidden=false;f.className='fb '+(ok?'ok':'no');f.innerHTML=(ok?'أحسنت! ':'')+(msg?'<span class="ar">'+esc(msg)+'</span>':'')}
B.mcq=function(el,it,i){var b=$('.qb',el),ord=shuf(it.o.map(function(_,k){return k}));
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="opts">'+ord.map(function(k){return '<button class="op" data-k="'+k+'">'+Z(it.o[k])+'</button>'}).join('')+'</div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.disabled)return;var k=+x.dataset.k,ok=k===it.a;[].forEach.call(b.querySelectorAll('.op'),function(o){o.disabled=true;if(+o.dataset.k===it.a)o.classList.add('good')});if(!ok)x.classList.add('bad');rec(i,ok);fb(el,ok,it.why)}};
B.tf=function(el,it,i){var b=$('.qb',el);
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="tf"><button class="op" data-v="1"><span class="zh" style="text-align:center">对 ✓</span></button><button class="op" data-v="0"><span class="zh" style="text-align:center">错 ✗</span></button></div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.disabled)return;var v=x.dataset.v==='1',ok=v===it.a;[].forEach.call(b.querySelectorAll('.op'),function(o){o.disabled=true;if((o.dataset.v==='1')===it.a)o.classList.add('good')});if(!ok)x.classList.add('bad');rec(i,ok);fb(el,ok,it.why)}};
B.match=function(el,it,i){var b=$('.qb',el),R=shuf(it.p.map(function(_,k){return k})),sel=null,left=it.p.length,miss=0;
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="mt"><div class="col" id="L'+i+'">'+it.p.map(function(p,k){return '<button class="op" data-k="'+k+'">'+Z(p[0])+'</button>'}).join('')+'</div><div class="col" id="R'+i+'">'+R.map(function(k){return '<button class="op" data-k="'+k+'">'+Z(it.p[k][1])+'</button>'}).join('')+'</div></div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.classList.contains('done'))return;var side=x.parentNode.id.charAt(0);
  if(side==='L'){[].forEach.call(b.querySelectorAll('#L'+i+' .op'),function(o){o.classList.remove('sel')});x.classList.add('sel');sel=x;return}
  if(!sel){toast('اختر من العمود الأول أولاً');return}
  if(sel.dataset.k===x.dataset.k){sel.classList.remove('sel');sel.classList.add('done');x.classList.add('done');sel=null;left--;if(!left){rec(i,miss===0);fb(el,miss===0,miss?'عدد الأخطاء: '+miss:'')}}
  else{miss++;x.classList.add('flash');setTimeout(function(){x.classList.remove('flash')},500)}}};
B.order=function(el,it,i){var b=$('.qb',el),n=it.items.length,pool=shuf(it.items.map(function(_,k){return k})),pl=[],tries=0;
 if(n>1&&pool.join()===it.items.map(function(_,k){return k}).join())pool.reverse();
 function draw(){b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="line" aria-label="الترتيب">'+pl.map(function(k,j){return '<button class="chip" data-r="'+j+'"><span class="nn">'+(j+1)+'</span>'+Z(it.items[k])+'</button>'}).join('')+(pl.length?'':'<span class="mut">اضغط على العناصر بالترتيب الصحيح</span>')+'</div><div class="pool">'+pool.map(function(k){return '<button class="chip" data-p="'+k+'">'+Z(it.items[k])+'</button>'}).join('')+'</div><div class="act"><button class="btn p" data-chk="1"'+(pool.length?' disabled':'')+'>تحقق</button><button class="btn" data-rs="1">إعادة</button><button class="btn" data-sol="1">أظهر الحل</button></div>'}
 draw();
 b.onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.p!=null){var k=+t.dataset.p;pool.splice(pool.indexOf(k),1);pl.push(k);draw()}
  else if(t.dataset.r!=null){pool.push(pl.splice(+t.dataset.r,1)[0]);draw()}
  else if(t.dataset.rs){pool=pool.concat(pl);pl=[];draw();$('.fb',el).hidden=true}
  else if(t.dataset.sol){pl=it.items.map(function(_,k){return k});pool=[];draw();[].forEach.call(b.querySelectorAll('.line .chip'),function(c){c.classList.add('good')});rec(i,false);fb(el,false,'هذا هو الترتيب الصحيح.')}
  else if(t.dataset.chk){var ok=true;[].forEach.call(b.querySelectorAll('.line .chip'),function(c,j){var g=pl[j]===j;if(!g)ok=false;c.classList.add(g?'good':'bad')});tries++;rec(i,ok&&tries===1);fb(el,ok,ok?'':'بعض العناصر في غير موضعها (الأحمر). اضغط «إعادة» وجرّب مجدداً.')}}};
B.cls=function(el,it,i){var b=$('.qb',el),ch=[];
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="rows">'+it.items.map(function(x,k){return '<div class="rw" data-k="'+k+'">'+Z(x[0])+'<div class="cs">'+it.cats.map(function(c,j){return '<button data-j="'+j+'">'+esc(c)+'</button>'}).join('')+'</div></div>'}).join('')+'</div><div class="act"><button class="btn p" data-chk="1">تحقق</button></div>';
 b.onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.j!=null){var rw=t.closest('.rw'),k=+rw.dataset.k;ch[k]=+t.dataset.j;[].forEach.call(rw.querySelectorAll('button'),function(x){x.classList.toggle('sel',x===t)});rw.classList.remove('good','bad')}
  else if(t.dataset.chk){var good=0,all=it.items.length;if(ch.filter(function(x){return x!=null}).length<all){toast('صنّف كل العناصر أولاً');return}
   [].forEach.call(b.querySelectorAll('.rw'),function(rw){var k=+rw.dataset.k,g=ch[k]===it.items[k][1];if(g)good++;rw.classList.remove('good','bad');rw.classList.add(g?'good':'bad')});
   rec(i,good===all);fb(el,good===all,good+' من '+all+(good<all?' — صحّح العناصر الحمراء وأعد التحقق.':''))}}};
B.cloze=function(el,it,i){var b=$('.qb',el),parts=it.q.split('___'),bank=shuf(it.bank||it.a),h='';
 parts.forEach(function(p,k){h+=esc(p);if(k<parts.length-1)h+='<select data-k="'+k+'" aria-label="الفراغ '+(k+1)+'"><option value="">…</option>'+bank.map(function(w){return '<option>'+esc(w)+'</option>'}).join('')+'</select>'});
 b.innerHTML='<div class="q">'+Z(it.q.replace(/___/g,'＿＿'))+'</div><div class="cz">'+h+'</div><div class="act"><button class="btn p" data-chk="1">تحقق</button></div>';
 b.onclick=function(e){var t=e.target.closest('[data-chk]');if(!t)return;var sels=b.querySelectorAll('select'),good=0;[].forEach.call(sels,function(s,k){var g=s.value===it.a[k];if(g)good++;s.classList.remove('good','bad');s.classList.add(g?'good':'bad')});rec(i,good===sels.length);fb(el,good===sels.length,good+' من '+sels.length)}};
function practice(){return '<div class="card sum"><div><b id="psc">0</b> <span class="mut">/ '+D.practice.length+' أُنجزت</span></div><div class="mut" id="pok"></div><button class="btn" id="prs">إعادة التدريبات</button></div>'+D.practice.map(function(it,i){return '<section class="card pq" data-i="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="qty">'+TY[it.t]+'</span><span class="qs" id="s'+i+'"></span></div><div class="qb"></div><div class="fb" hidden></div></section>'}).join('')}
function initPractice(){D.practice.forEach(function(it,i){var el=$('.pq[data-i="'+i+'"]');B[it.t](el,it,i);var r=S.prac[i];if(r){var q=$('#s'+i);q.className='qs '+(r.c?'ok':'no');q.textContent=r.c?'✓ من أول محاولة':'أُنجز'}})}
/* ---------- discuss ---------- */
function discuss(){return D.discuss.map(function(d,i){return '<section class="card" data-d="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="qty">نقاش وكتابة</span></div><div class="q">'+Z(d.q)+'</div><p class="mut" style="margin-top:4px">'+esc(d.ar)+'</p>'+
 '<div class="fr">'+d.frames.map(function(f,k){return '<button data-fr="'+k+'">'+esc(f)+'</button>'}).join('')+'</div>'+
 '<textarea data-ta="'+i+'" placeholder="اكتب إجابتك بالصينية (٥٠ حرفاً على الأقل)…" lang="zh" aria-label="إجابتك"></textarea>'+
 '<div class="mut" style="margin-top:4px"><span data-cc="'+i+'">0</span> حرفاً · المصطلحات المستخدمة:</div><div class="us">'+d.use.map(function(u){return '<span data-u="'+esc(u)+'">'+esc(u)+'</span>'}).join('')+'</div>'+
 '<details class="md"><summary>نموذج إجابة</summary>'+ZA(d.model)+'<div class="act"><button class="btn" data-say-m="'+i+'">🔊 استمع</button></div></details></section>'}).join('')}
function initDisc(){D.discuss.forEach(function(d,i){var ta=$('[data-ta="'+i+'"]'),v=S.txt[i]||'';ta.value=v;chk(i)})}
function chk(i){var ta=$('[data-ta="'+i+'"]'),el=$('[data-d="'+i+'"]'),v=ta.value;$('[data-cc="'+i+'"]').textContent=v.replace(/\s/g,'').length;[].forEach.call(el.querySelectorAll('[data-u]'),function(s){s.classList.toggle('on',v.indexOf(s.dataset.u)>-1)})}
/* ---------- shell ---------- */
var TABS=[['read','📖 القراءة'],['terms','🔤 المصطلحات'],['prac','✍️ التدريبات'],['disc','💬 نقاش']],tab=S.ui.tab||'read';
function upd(){var pd=Object.keys(S.prac).length,ok=0,k;for(k in S.prac)if(S.prac[k].c)ok++;var dn=D.discuss.filter(function(d,i){return (S.txt[i]||'').replace(/\s/g,'').length>=50}).length,tot=D.practice.length+D.discuss.length;
 $('#pgb').style.width=Math.round((pd+dn)/tot*100)+'%';var a=$('#psc');if(a){a.textContent=pd;$('#pok').textContent=pd?'من أول محاولة: '+ok+' من '+pd:''}}
function show(t){$('#pop').hidden=true;tab=t;S.ui.tab=t;save();[].forEach.call(document.querySelectorAll('.pane'),function(p){p.hidden=p.id!=='p-'+t});$('#tabs').innerHTML=TABS.map(function(x){return '<button class="tab" role="tab" aria-selected="'+(x[0]===t)+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('');window.scrollTo(0,0)}
function init(){
 document.title=D.title_ar+' · '+D.title_zh;$('#ttl').innerHTML='<span class="han" lang="zh" dir="ltr">'+esc(D.title_zh)+'</span><span class="mut" style="display:block;font-size:12px;font-weight:400">'+esc(D.title_ar)+'</span>';
 var tools='<div class="tools"><button class="sw" id="spy" aria-pressed="false">拼音 · البينيين</button><button class="sw" id="sar" aria-pressed="false">الترجمة العربية</button><span class="mut">المصطلحات المسطّرة بنقط: اضغط عليها لمعناها</span></div>';
 $('#main').innerHTML='<div id="p-read" class="pane">'+tools+reading()+'</div><div id="p-terms" class="pane" hidden>'+termsTab()+'</div><div id="p-prac" class="pane" hidden>'+practice()+'</div><div id="p-disc" class="pane" hidden>'+discuss()+'</div>';
 initPractice();initDisc();
 if(S.ui.py)document.body.classList.add('py');if(S.ui.ar)document.body.classList.add('ar');syncSw();show(tab);upd();
}
function syncSw(){$('#spy').setAttribute('aria-pressed',document.body.classList.contains('py'));$('#sar').setAttribute('aria-pressed',document.body.classList.contains('ar'))}
var cur=-1;
function pop(i){var t=TERMS[i];cur=i;var p=$('#pop');p.hidden=false;p.innerHTML='<div class="r"><div class="zz">'+esc(t.zh)+'</div><div><div class="pp" style="font-family:var(--font-py);direction:ltr">'+pyh(t.py)+'</div><div>'+esc(t.ar)+'</div></div><div class="cl" style="display:flex;gap:6px"><button class="sm" data-pop="say" aria-label="استمع">🔊</button><button class="sm'+(inRev(t.zh)?' on':'')+'" data-pop="add" aria-label="مراجعة">'+(inRev(t.zh)?'✓':'+')+'</button><button class="sm" data-pop="x" aria-label="إغلاق">✕</button></div></div>'+(t.ex?'<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">'+ZP(sp(t.ex)[0])+'<span class="mut">'+esc(sp(t.ex)[1])+'</span></div>':'')}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-g],[data-tab],[data-pop],[data-say-sec],[data-say-t],[data-add-t],#addall,#spy,#sar,#prs,[data-fr],[data-say-m]');
 if(!t){if(!e.target.closest('#pop')){$('#pop').hidden=true}return}
 var d=t.dataset;
 if(d.g!=null){speak(TERMS[+d.g].zh);pop(+d.g)}
 else if(d.tab)show(d.tab);
 else if(d.pop){if(d.pop==='x')$('#pop').hidden=true;else if(d.pop==='say')speak(TERMS[cur].zh);else{var on=addRev(TERMS[cur].zh);pop(cur);toast(on?'أُضيف إلى مفردات الثقافة':'أُزيل من المراجعة');refreshTerms()}}
 else if(d.saySec!=null)speak(secText(+d.saySec));
 else if(d.sayT!=null)speak(TERMS[+d.sayT].zh);
 else if(d.addT!=null){var on2=addRev(TERMS[+d.addT].zh);toast(on2?'أُضيف إلى مفردات الثقافة':'أُزيل من المراجعة');refreshTerms()}
 else if(t.id==='addall'){TERMS.forEach(function(x){if(!inRev(x.zh))addRev(x.zh)});toast('أُضيفت كل المصطلحات');refreshTerms()}
 else if(t.id==='spy'||t.id==='sar'){var c=t.id==='spy'?'py':'ar';document.body.classList.toggle(c);S.ui[c]=document.body.classList.contains(c)?1:0;save();syncSw()}
 else if(t.id==='prs'){if(confirm('مسح نتائج التدريبات وإعادتها؟')){S.prac={};save();initPractice();[].forEach.call(document.querySelectorAll('.qs'),function(q){q.textContent='';q.className='qs'});[].forEach.call(document.querySelectorAll('.fb'),function(f){f.hidden=true});upd()}}
 else if(d.fr!=null){var sec=t.closest('[data-d]'),i=+sec.dataset.d,ta=$('textarea',sec),f=D.discuss[i].frames[+d.fr],p=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.value=ta.value.slice(0,p)+f+ta.value.slice(p);ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}
 else if(d.sayM!=null)speak(sp(D.discuss[+d.sayM].model)[0]);
});
function refreshTerms(){var y=window.scrollY;$('#p-terms').innerHTML=termsTab();window.scrollTo(0,y)}
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('g')){e.preventDefault();e.target.click()}});
document.addEventListener('input',function(e){var ta=e.target;if(ta.dataset&&ta.dataset.ta!=null){var i=+ta.dataset.ta;S.txt[i]=ta.value;save();chk(i);upd()}});
$('#th').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')};
init();
})();
</script>
</body></html>
