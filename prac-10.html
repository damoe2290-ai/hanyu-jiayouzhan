<script>
(function(){
var D={"n":10,"course":"prac","cname":"القراءة ١","big":"买","title_zh":"我在这儿买光盘","title_ar":"الدرس ١٠ · أشتري الأقراص هنا","intro_ar":"المساومة والتسوّق جزء من الحياة في الصين. تتعلّم في هذا الدرس العملة الصينية، وكيف تتحدث عن أذواقك وهواياتك، وماذا تفعل حين لا تعرف كيف تقول شيئاً.","defpy":1,"minc":12,"tword":"كلمة","tabs":[["read","📖 الدرس"],["terms","🔤 الكلمات"],["prac","✍️ التدريبات"],["disc","💬 تحدّث"]],"sections":[{"h":"一、课文（一）","ar":"النص ١: في المجمّع التجاري","b":[{"dlg":[["王小云｜وانغ شياويون","大为，你在这儿买什么？｜داوي، ماذا تشتري هنا؟"],["马大为｜ما داوي","我买音乐光盘。｜أشتري أقراص موسيقى."],["王小云｜وانغ شياويون","你常常来这儿吗？｜هل تأتي إلى هنا كثيراً؟"],["马大为｜ما داوي","我不常来这儿。星期天我常常跟林娜去小商场。这个商场很大。｜لا آتي إلى هنا كثيراً. يوم الأحد أذهب كثيراً مع لين نا إلى المجمع الصغير. هذا المجمع كبير جداً."],["王小云｜وانغ شياويون","你喜欢什么音乐？｜أي موسيقى تحب؟"],["马大为｜ما داوي","我喜欢中国音乐。这张光盘怎么样？｜أحب الموسيقى الصينية. كيف هذا القرص؟"],["王小云｜وانغ شياويون","这张很好，是《梁祝》，很有名。｜هذا جيد جداً، إنه «ليانغ تشو»، مشهور جداً."],["马大为｜ما داوي","好，我买这张。这儿有没有书和报？｜جيد، سأشتري هذا. هل توجد هنا كتب وصحف؟"],["王小云｜وانغ شياويون","这儿没有书，也没有报。｜لا توجد هنا كتب ولا صحف."],["马大为｜ما داوي","本子呢？｜والدفاتر؟"],["王小云｜وانغ شياويون","有，在那儿买。跟我来，我也买本子。｜نعم، تُباع هناك. تعال معي، أنا أيضاً سأشتري دفاتر."]]}]},{"h":"一、课文（二）","ar":"النص ٢: في السوق (المساومة)","b":[{"dlg":[["师傅｜البائع","先生，您要什么？｜سيدي، ماذا تريد؟"],["丁力波｜دينغ ليبو","你好，师傅。请问，这是什么？｜مرحباً أيها الأخ. عفواً، ما هذا؟"],["师傅｜البائع","您不认识吗？这是香蕉苹果。｜ألا تعرفه؟ هذا «تفاح الموز»."],["丁力波｜دينغ ليبو","对不起，我是问：这个汉语怎么说？｜آسف، أسأل: كيف يُقال هذا بالصينية؟"],["师傅｜البائع","啊，您是外国人。您在哪儿工作？｜آه، أنت أجنبي. أين تعمل؟"],["丁力波｜دينغ ليبو","我在语言学院学习。｜أنا أدرس في معهد اللغات."],["师傅｜البائع","您学习汉语，是不是？您跟我学，很容易：这叫香蕉，这叫香蕉苹果，这也是苹果，那是葡萄……｜أنت تدرس الصينية، أليس كذلك؟ تعلّم معي، الأمر سهل جداً: هذا يسمى موز، وهذا تفاح الموز، وهذا أيضاً تفاح، وذلك عنب…"],["丁力波｜دينغ ليبو","香蕉、苹果、香蕉苹果……，一斤苹果多少钱？｜موز، تفاح، تفاح الموز… كم سعر جين (نصف كيلو) من التفاح؟"],["师傅｜البائع","一斤三块二毛钱。｜جين واحد بثلاثة يوان وعشرين ماو."],["丁力波｜دينغ ليبو","您的苹果真贵。｜تفاحكم غالٍ حقاً."],["师傅｜البائع","一斤三块二不贵。您看，我的苹果大。好，做个朋友，三块钱一斤。｜ثلاثة يوان واثنان ماو ليس غالياً. انظر، تفاحي كبير. حسناً، لنكن أصدقاء، ثلاثة يوان للجين."],["丁力波｜دينغ ليبو","一斤香蕉多少钱？｜كم سعر جين الموز؟"],["师傅｜البائع","两块七毛五分一斤，五块钱两斤。｜يوانان وسبعة ماو وخمسة فن للجين، وخمسة يوان للجينين."],["丁力波｜دينغ ليبو","我买三斤香蕉和两斤香蕉苹果。｜أشتري ثلاثة جين موز وجينين من تفاح الموز."],["师傅｜البائع","一共十四块钱。再送您一个苹果。您还要什么？｜المجموع أربعة عشر يوان. وأهديك تفاحة أخرى. هل تريد شيئاً آخر؟"],["丁力波｜دينغ ليبو","不要了，谢谢。给你钱。｜لا شكراً، لا أريد شيئاً آخر. تفضل المال."],["师傅｜البائع","好，您给我二十块钱，我找您六块钱。再见。｜حسناً، أعطيتني عشرين يواناً وأرجع لك ستة يوان. إلى اللقاء."],["丁力波｜دينغ ليبو","再见！｜إلى اللقاء!"]]}]},{"h":"二、注释","ar":"الملاحظات","b":[{"p":"① 这个商场很大。｜إذا جاء اسم الإشارة «这/那» صفةً للاسم فإننا نضع بينهما كلمة عدّ: 这张光盘، 那个朋友، 那瓶酒."},{"p":"② 先生，您要什么？｜«先生» لقب لمخاطبة الرجل البالغ، ويُستعمل أيضاً احتراماً لعالم أو متخصص رجلاً كان أو امرأة. «您要什么؟» و«您还要什么؟» يقولهما البائعون وموظفو الفنادق لعرض المساعدة."},{"p":"③ 你好，师傅。｜«师傅» صيغة احترام لمخاطبة العمال وأصحاب المهن الخدمية: سائق التاكسي والحافلة، بائع التذاكر، الطباخ، موظف الفندق، وصار استعمالها أوسع اليوم."},{"p":"④ 我是问：这个汉语怎么说？｜«怎么 + فعل» تسأل عن طريقة فعل شيء: 怎么说؟ 怎么做؟ 怎么去؟ 怎么介绍؟"},{"p":"⑤ 您学习汉语，是不是？｜النمط «……，是不是؟» لإبداء رأي أو تخمين مع انتظار رد. الجواب المثبت «是啊»، والمنفي «不（是）». مثال: A: 你喜欢中国音乐，是吗؟ B: 是啊。"},{"p":"⑥ 一斤苹果多少钱？｜«كم سعر جين التفاح؟» والجين (斤) نصف كيلو. يمكن قلب الجملة: 多少钱一斤؟ ← 三块二一斤. في المتاجر الكبرى لا يساوم الناس عادةً، لكن في الأسواق الحرّة والأكشاك كثيراً ما يساومون."},{"p":"⑦ 一斤三块二毛钱。｜وحدات العملة (人民币): 元 (يوان) وتُنطق في الكلام 块، و角 وتُنطق 毛، و分 (فن). وإذا انتهى المبلغ بـ毛 أو 分 يمكن حذف «毛钱/分钱». مثال: 1.75元 ← 一块七毛五. وإذا بدأ المبلغ بـ٢毛 نقول 两毛، وإذا انتهى بـ٢分 نقول 二分: 0.22元 ← 两毛二."},{"key":"不要了，谢谢。｜معناها: «لا، شكراً (لا أريد المزيد)»."}]},{"h":"三、人民币","ar":"العملة الصينية","b":[{"table":{"head":["书面｜الكتابة","口语｜في الكلام","价值｜القيمة"],"rows":[["元","块","١ يوان"],["角","毛","١/١٠ يوان"],["分","分","١/١٠٠ يوان"]]}},{"sl":["一块七毛五｜١.٧٥ يوان","四块八｜٤.٨٠ يوان","两毛二｜٠.٢٢ يوان","三块二毛｜٣.٢٠ يوان","两块七毛五分｜٢.٧٥ يوان","二十块｜٢٠ يوان"]},{"p":"补充词｜كلمات إضافية:"},{"sl":["元｜يوان (كتابياً)","笔｜قلم","支｜كلمة عدّ للأقلام","份｜كلمة عدّ للصحف","本｜كلمة عدّ للكتب والدفاتر","杯｜كوب","售货员｜بائع","作家｜كاتب","便宜｜رخيص","书店｜مكتبة","体育馆｜صالة رياضية","卖｜يبيع"]}]},{"h":"四、关键句","ar":"الجمل المفتاحية","b":[{"sl":["这个商场很大。｜هذا المجمع كبير جداً.","一斤香蕉多少钱？｜كم سعر جين الموز؟","两块七毛五一斤。｜يوانان وسبعة ماو وخمسة فن للجين.","您在哪儿工作？｜أين تعمل؟","我常常跟他来这儿。｜أنا آتي إلى هنا كثيراً معه.","我送你一个苹果。｜أهديك تفاحة.","您给我二十块钱。｜أعطيتني عشرين يواناً.","这个汉语怎么说？｜كيف يُقال هذا بالصينية؟"]}]}],"terms":[{"zh":"在","ar":"في / عند","py":"zài","ex":"我在这儿买光盘。｜أشتري الأقراص هنا."},{"zh":"这儿","ar":"هنا","py":"zhèér","ex":"我常常来这儿。｜آتي إلى هنا كثيراً."},{"zh":"光盘","ar":"قرص (CD)","py":"guāngpán","ex":"我买音乐光盘。｜أشتري أقراص موسيقى."},{"zh":"音乐","ar":"موسيقى","py":"yīnyuè","ex":"我喜欢中国音乐。｜أحب الموسيقى الصينية."},{"zh":"商场","ar":"مجمع تجاري","py":"shāngchǎng","ex":"这个商场很大。｜هذا المجمع كبير جداً."},{"zh":"常常","ar":"كثيراً / غالباً","py":"chángcháng","ex":"我常常来这儿。｜آتي إلى هنا كثيراً."},{"zh":"跟","ar":"مع / يتبع","py":"gēn","ex":"跟我来。｜تعال معي."},{"zh":"有名","ar":"مشهور","py":"yǒumíng","ex":"很有名。｜مشهور جداً."},{"zh":"书","ar":"كتاب","py":"shū","ex":"这儿没有书。｜لا توجد هنا كتب."},{"zh":"报","ar":"صحيفة","py":"bào","ex":"这儿没有报。｜لا توجد هنا صحف."},{"zh":"本子","ar":"دفتر","py":"běnzi","ex":"本子在那儿买。｜الدفاتر تُباع هناك."},{"zh":"那儿","ar":"هناك","py":"nàér","ex":"在那儿买。｜اشترِ هناك."},{"zh":"先生","ar":"سيد / أستاذ","py":"xiānsheng","ex":"先生，您要什么？｜سيدي، ماذا تريد؟"},{"zh":"要","ar":"يريد","py":"yào","ex":"您要什么？｜ماذا تريد؟"},{"zh":"师傅","ar":"أيها الأخ (احتراماً للعامل)","py":"shīfu","ex":"你好，师傅。｜مرحباً أيها الأخ."},{"zh":"香蕉苹果","ar":"تفاح الموز (نوع)","py":"xiāngjiāo píngguǒ","ex":"这是香蕉苹果。｜هذا تفاح الموز."},{"zh":"香蕉","ar":"موز","py":"xiāngjiāo","ex":"一斤香蕉｜جين موز"},{"zh":"苹果","ar":"تفاح","py":"píngguǒ","ex":"一斤苹果多少钱？｜كم سعر جين التفاح؟"},{"zh":"对不起","ar":"آسف","py
