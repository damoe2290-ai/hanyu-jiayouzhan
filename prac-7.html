<script>
(function(){
var D={"n":7,"course":"prac","cname":"القراءة ١","big":"认识","title_zh":"你认识不认识他","title_ar":"الدرس ٧ · هل تعرفه؟ (التعارف)","intro_ar":"من هذا الدرس تبدأ التعارف وتتحدث عن دراستك وتخصصك: كيف تسأل عن اسم شخص وبلده وتخصصه، وكيف تقدّم نفسك وصديقك، وتتعلّم صيغة السؤال «هل … أم لا؟».","defpy":1,"minc":12,"tword":"كلمة","tabs":[["read","📖 الدرس"],["terms","🔤 الكلمات"],["prac","✍️ التدريبات"],["disc","💬 تحدّث"]],"sections":[{"h":"一、课文（一）","ar":"النص ١: لقاء أول مع المعلم","b":[{"p":"场景：开学前一天，林娜和丁力波在语言学院遇到一位老师。｜المشهد: قبل بدء الدراسة بيوم، تلتقي لين نا ودينغ ليبو بمعلم في معهد اللغات."},{"dlg":[["林娜｜لين نا","力波，明天开学，我很高兴。你看，他是不是我们学院的老师？｜ليبو، غداً تبدأ الدراسة وأنا سعيدة جداً. انظر، أليس هذا معلماً في معهدنا؟"],["丁力波｜دينغ ليبو","我问一下。请问，您是我们学院的老师吗？｜سأسأله. عفواً، هل أنت معلم في معهدنا؟"],["张教授｜الأستاذ تشانغ","是，我是语言学院的老师。｜نعم، أنا معلم في معهد اللغات."],["丁力波｜دينغ ليبو","您贵姓？｜بماذا تُكنّى (ما اسم عائلتكم الكريمة)؟"],["张教授｜الأستاذ تشانغ","我姓张，我们认识一下，这是我的名片。｜اسم عائلتي تشانغ، لنتعارف، هذه بطاقتي."],["丁力波｜دينغ ليبو","谢谢。（看名片）啊，您是张教授。我叫丁力波，她叫林娜。我们都是语言学院的学生。｜شكراً. (ينظر إلى البطاقة) آه، أنت الأستاذ تشانغ. اسمي دينغ ليبو واسمها لين نا. كلانا طالب في معهد اللغات."],["林娜｜لين نا","您是语言学院的教授，认识您，我们很高兴。｜أنت أستاذ في معهد اللغات، يسعدنا التعرف عليك."],["张教授｜الأستاذ تشانغ","认识你们，我也很高兴。你们都好吗？｜وأنا سعيد بمعرفتكما أيضاً. هل أنتما بخير؟"],["林娜｜لين نا","谢谢，我们都很好。张教授，您忙不忙？｜شكراً، نحن بخير. أستاذ تشانغ، هل أنت مشغول؟"],["张教授｜الأستاذ تشانغ","我很忙。好，你们请坐，再见！｜أنا مشغول جداً. حسناً، تفضلا بالجلوس، إلى اللقاء!"],["丁力波｜دينغ ليبو","再见！｜إلى اللقاء!"]]}]},{"h":"一、课文（二）","ar":"النص ٢: تقديم صديق","b":[{"p":"场景：林娜给丁力波介绍马大为。｜المشهد: لين نا تقدّم ما داوي إلى دينغ ليبو."},{"dlg":[["丁力波｜دينغ ليبو","林娜，那是谁？｜لين نا، من ذاك؟"],["林娜｜لين نا","那是马大为。你认识不认识他？｜ذاك ما داوي. هل تعرفه؟"],["丁力波｜دينغ ليبو","我不认识他。｜لا أعرفه."],["林娜｜لين نا","我来介绍一下。你好，大为，这是我朋友——｜دعني أقدّم لك. مرحباً داوي، هذا صديقي—"],["丁力波｜دينغ ليبو","你好！我姓丁，叫丁力波。请问，你叫什么名字？｜مرحباً! اسم عائلتي دينغ واسمي دينغ ليبو. عفواً، ما اسمك؟"],["马大为｜ما داوي","我的中文名字叫马大为。你是不是中国人？｜اسمي الصيني ما داوي. هل أنت صيني؟"],["丁力波｜دينغ ليبو","我是加拿大人。我妈妈是中国人，我爸爸是加拿大人。你也是加拿大人吗？｜أنا كندي. أمي صينية وأبي كندي. هل أنت كندي أيضاً؟"],["马大为｜ما داوي","不是，我不是加拿大人，我是美国人。你学习什么专业？｜لا، لست كندياً، أنا أمريكي. ما تخصصك؟"],["丁力波｜دينغ ليبو","我学习美术专业。你呢？｜أدرس الفنون الجميلة. وأنت؟"],["马大为｜ما داوي","我学习文学专业。现在我学习汉语。｜أدرس الأدب. والآن أدرس اللغة الصينية."],["林娜｜لين نا","现在我们都学习汉语，也都是汉语系的学生。｜الآن نحن جميعاً ندرس الصينية ونحن جميعاً طلاب قسم اللغة الصينية."]]}]},{"h":"二、注释","ar":"الملاحظات","b":[{"p":"① 我问一下。｜«一下» بعد الفعل تدل على فعل قصير أو «محاولة»، وتخفّف نبرة الكلام فيبدو أقل رسمية: 认识一下، 介绍一下، 去一下، 坐一下. وعبارتا «我来介绍一下» و«我们认识一下» شائعتان عند اللقاء الأول."},{"p":"② 您是我们学院的老师吗？｜للدلالة على المكان أو المؤسسة التي يعمل بها الشخص تُستخدم الضمائر الجمعية غالباً: 他们学院، 你们系، 我们国家 — وليس «他学院» أو «你系»."},{"p":"③ 啊，您是张教授。｜«啊» تُنطق بالنغمة الرابعة (à) وتعبّر عن فهمٍ مفاجئ أو إعجاب."},{"p":"④ 你叫什么名字？｜طريقة غير رسمية لسؤال الاسم، للكبار مع الصغار أو بين الشباب. الجواب: 我叫丁力波، أو تبدأ باسم العائلة: 我姓丁，叫丁力波."},{"p":"⑤ 我的中文名字叫马大为。｜يمكن وضع اسم قبل اسم ليصفه مباشرة: 中文名字، 汉语老师، 中国人. ولنقل اسم أجنبي إلى الصينية نختار حرفين أو ثلاثة بحسب النطق أو المعنى، مثل David March ← 马大为."},{"key":"中文 و汉语 كلاهما يعني اللغة الصينية؛ «中文» أوسع (مكتوبة ومنطوقة) و«汉语» كانت للمنطوق فقط واليوم يُستعملان بالتبادل.｜«中文» و«汉语» يعنيان اللغة الصينية."}]},{"h":"三、关键句","ar":"الجمل المفتاحية","b":[{"sl":["他是不是我们学院的老师？｜هل هو معلم في معهدنا أم لا؟","你认识不认识他？｜هل تعرفه أم لا؟","我们认识一下，我的中文名字叫马大为。｜لنتعارف، اسمي الصيني ما داوي.","你学习什么专业？｜ما تخصصك؟","我学习美术专业。你呢？｜أدرس الفنون الجميلة، وأنت؟","现在我们都学习汉语，也都是汉语系的学生。｜الآن جميعنا ندرس الصينية وجميعنا طلاب قسم الصينية."]}]},{"h":"四、句型","ar":"الأنماط","b":[{"p":"正反问句：动词/形容词 + 不 + 动词/形容词。｜السؤال الاستفهامي بالإثبات والنفي: فعل/صفة + 不 + نفس الفعل/الصفة."},{"table":{"head":["句型｜النمط","例子｜مثال","回答｜الجواب"],"rows":[["A 不 A","你认识不认识他？｜هل تعرفه؟","我不认识他。｜لا أعرفه."],["是不是","你是不是中国人？｜هل أنت صيني؟","我不是中国人，我是美国人。｜لست صينياً، أنا أمريكي."],["忙不忙","您忙不忙？｜هل أنت مشغ للغات؟ ما اسم عائلتك؟ لنتعارف، يسعدني التعرف عليك."}],"py":{"认识":"rènshi","你认识不认识他":"nǐ rènshi bú rènshi tā","一、课文（一）":"yì, kèwén (yì)","场景：开学前一天，林娜和丁力波在语言学院遇到一位老师。":"chǎng jǐng: kāixué qián yì tiān, Lín Nà hé Dīng Lìbō zài Yǔyán Xuéyuàn yù dào yí wèi lǎoshī.","林娜":"Lín Nà","力波，明天开学，我很高兴。你看，他是不是我们学院的老师？":"lì bō, míngtiān kāixué, wǒ hěn gāoxìng. nǐ kàn, tā shì búshì wǒmen xuéyuàn de lǎoshī?","丁力波":"Dīng Lìbō","我问一下。请问，您是我们学院的老师吗？":"wǒ wèn yíxià. qǐng wèn, nín shì wǒmen xuéyuàn de lǎoshī ma?","张教授":"Zhāng jiàoshòu","是，我是语言学院的老师。":"shì, wǒ shì Yǔyán Xuéyuàn de lǎoshī.","您贵姓？":"nín guìxìng?","我姓张，我们认识一下，这是我的名片。":"wǒ xìng Zhāng, wǒmen rènshi yíxià, zhè shì wǒ de míngpiàn.","谢谢。（看名片）啊，您是张教授。我叫丁力波，她叫林娜。我们都是语言学院的学生。":"xièxie. (kàn míngpiàn) a, nín shì Zhāng jiàoshòu. wǒ jiào Dīng Lìbō, tā jiào Lín Nà. wǒmen dōu shì Yǔyán Xuéyuàn de xuésheng.","您是语言学院的教授，认识您，我们很高兴。":"nín shì Yǔyán Xuéyuàn de jiàoshòu, rènshi nín, wǒmen hěn gāoxìng.","认识你们，我也很高兴。你们都好吗？":"rènshi nǐmen, wǒ yě hěn gāoxìng. nǐmen dōu hǎo ma?","谢谢，我们都很好。张教授，您忙不忙？":"xièxie, wǒmen dōu hěn hǎo. Zhāng jiàoshòu, nín máng bù máng?","我很忙。好，你们请坐，再见！":"wǒ hěn máng. hǎo, nǐmen qǐngzuò, zàijiàn!","再见！":"zàijiàn!","一、课文（二）":"yì, kèwén (èr)","场景：林娜给丁力波介绍马大为。":"chǎng jǐng: Lín Nà gěi Dīng Lìbō jièshào Mǎ Dàwéi.","林娜，那是谁？":"Lín Nà, nà shì shéi?","那是马大为。你认识不认识他？":"nà shì Mǎ Dàwéi. nǐ rènshi bú rènshi tā?","我不认识他。":"wǒ bú rènshi tā.","我来介绍一下。你好，大为，这是我朋友——":"wǒ lái jièshào yíxià. nǐ hǎo, dà wèi, zhè shì wǒ péngyou — —","你好！我姓丁，叫丁力波。请问，你叫什么名字？":"nǐ hǎo! wǒ xìng dīng, jiào Dīng Lìbō. qǐng wèn, nǐ jiào shénme míngzi?","马大为":"Mǎ Dàwéi","我的中文名字叫马大为。你是不是中国人？":"wǒ de Zhōngwén míngzi jiào Mǎ Dàwéi. nǐ shì búshì Zhōngguó rén?","我是加拿大人。我妈妈是中国人，我爸爸是加拿大人。你也是加拿大人吗？":"wǒ shì Jiānádà rén. wǒ māma shì Zhōngguó rén, wǒ bàba shì Jiānádà rén. nǐ yě shì Jiānádà rén ma?","不是，我不是加拿大人，我是美国人。你学习什么专业？":"búshì, wǒ búshì Jiānádà rén, wǒ shì Měiguó rén. nǐ xuéxí shénme zhuānyè?","我学习美术专业。你呢？":"wǒ xuéxí měishù zhuānyè. nǐ ne?","我学习文学专业。现在我学习汉语。":"wǒ xuéxí wénx function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2200)}
var voice=null;function pick(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.filter(function(x){return /^zh/i.test(x.lang)})[0]||null}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function speak(t){if(!window.speechSynthesis){toast('الصوت غير متاح');return}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[“”《》]/g,''));u.lang='zh-CN';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
function toneOf(s){var d=s.normalize('NFD');if(/̄/.test(d))return 1;if(/́/.test(d))return 2;if(/̌/.test(d))return 3;if(/̀/.test(d))return 4;return 5}
function pyh(py){return py.split(' ').map(function(x){return '<span class="t'+toneOf(x)+'">'+esc(x)+'</span>'}).join(' ')}
/* glossary */
var TERMS=D.terms,TI={};TERMS.forEach(function(t,i){TI[t.zh]=i});
var TRE=null;(function(){var a=TERMS.map(function(t){return t.zh}).sort(function(x,y){return y.length-x.length}).map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});if(a.length)TRE=new RegExp(a.join('|'),'g')})();
function gl(z){var e=esc(z);return TRE?e.replace(TRE,function(m){return '<span class="g" data-g="'+TI[m]+'" tabindex="0" role="button">'+m+'</span>'}):e}
function sp(s){var i=s.indexOf('｜');return i<0?[s,'']:[s.slice(0,i),s.slice(i+1)]}
function Z(zh,cls){if(/[\u0600-\u06ff]/.test(zh)&&!/[\u4e00-\u9fff]/.test(zh))return '<span class="arx">'+esc(zh)+'</span>';return '<span class="zb"><span class="zh '+(cls||'')+'" lang="zh">'+gl(zh)+'</span><span class="pyl">'+esc(PY[zh]||'')+'</span></span>'}
function ZA(s,cls){var p=sp(s);return Z(p[0],cls)+(p[1]?'<span class="ar2">'+esc(p[1])+'</span>':'')}
function ZP(zh){return '<span class="zb"><span class="han" lang="zh" dir="ltr">'+esc(zh)+'</span><span class="pyl">'+esc(PY[zh]||'')+'</span></span>'}

function addRev(zh){var h={};try{h=JSON.parse(localStorage.getItem(HUB)||'{}')||{}}catch(e){}h.dues=h.dues||{};h.dues[CRS]=h.dues[CRS]||{};var has=!!h.dues[CRS][zh];if(has)delete h.dues[CRS][zh];else h.dues[CRS][zh]={i:0,t:Date.now()};try{localStorage.setItem(HUB,JSON.stringify(h))}catch(e){}return !has}

function block(b){
 if(b.p)return '<div class="blk p">'+ZA(b.p)+'</div>';

 if(b.cards)return '<div class="cards blk">'+b.cards.map(function(c){return '<div class="cd"><div class="hd"><b>'+gl(c[0])+'</b><span class="ar">'+esc(c[1])+'</span></div>'+(c[2]?ZA(c[2]):'')+'</div>'}).join('')+'</div>';
 if(b.table){var t=b.table;return '<div class="tw blk"><table><thead><tr>'+t.head.map(function(h){return '<th>'+ZA(h)+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+ZA(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 if(b.dlg)return '<div class="dlg blk">'+b.dlg.map(function(l){var q=sp(l[0]),t=sp(l[1]);return '<div class="dl"><div class="sk">'+Z(q[0])+(q[1]?'<span class="ar2">'+esc(q[1])+'</span>':'')+'</div><div class="tx">'+ZA(l[1])+'</div>'+sayBtn(t[0])+'</div>'}).join('')+'</div>';
 if(b.sl)return '<ul class="ul blk sl">'+b.sl.map(function(x){return '<li><div class="sli"><div>'+ZA(x)+'</div>'+sayBtn(sp(x)[0])+'</div></li>'}).join('')+'</ul>';
 return '';
