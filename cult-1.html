<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img,svg{max-width:100%}</style></head><body><title>الدرس الأول · فلاسفة الصين · 中国的哲学家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{--bg:#FBF6EE;--surface:#FFFDF9;--surface2:#F3EBDD;--fg:#2B1D18;--muted:#7B6A5E;--line:#E8DCC8;--accent:#B8322A;--accent-fg:#fff;--accent-soft:#F8E4DF;--seal:#B8322A;--seal-fg:#fff;--gold:#C98A0A;--good:#2E7D4F;--good-soft:#DDF0E2;--bad:#B3261E;--bad-soft:#F7DBD8;--c1:#7A4FA3;--c2:#E0952B;--c3:#2F6DB5;--c4:#2E8B57;--t1:#C0392B;--t2:#A66A00;--t3:#1D7A45;--t4:#2759B8;--t5:#6A7B77;
--font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-han:'Noto Serif SC','Songti SC',serif;--font-py:'IBM Plex Sans','Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.7 var(--font-ui);padding:0 max(16px,env(safe-area-inset-left)) 90px}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}h1,h2,h3,p{margin:0}
.han{font-family:var(--font-han)}.py{font-family:var(--font-py)}.mut{color:var(--muted);font-size:14px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:10px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;font-size:17px;line-height:1.3}
.ib{font-size:20px;line-height:1;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.pg{height:6px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tabs{display:flex;gap:4px;margin-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sw{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.sw[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.banner{border-radius:20px;margin-top:12px;padding:22px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface2))}
.banner .big{font:700 52px/1 var(--font-han);color:var(--accent);min-width:1.6em;text-align:center}
.banner h2{font-size:22px;line-height:1.3}.banner p{color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.sec{margin-top:26px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:21px;line-height:1.35;border-inline-start:5px solid var(--accent);padding-inline-start:10px}
.sec>h2 .har{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--font-ui)}
.zb{display:block}.zb .t{display:block}
.pyl{display:none;font:14px/1.5 var(--font-py);color:var(--muted);direction:ltr;text-align:left;margin-top:1px}
body.py .pyl{display:block}
.ar2{display:none;color:var(--muted);font-size:15px;line-height:1.7;margin-top:2px}
body.ar .ar2{display:block}
.zh{font-family:var(--font-han);font-size:19px;line-height:1.95;direction:ltr;text-align:left;display:block}
.blk{margin-top:12px}
.p .zh{font-size:19px}
.g{border-bottom:2px dotted var(--accent);cursor:pointer;padding-bottom:1px}.g:hover,.g.on{background:var(--accent-soft)}
.key{border-inline-start:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:10px;padding:10px 14px}
.key:before{content:'重点 · نقطة مهمة';display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px}
ul.ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.ul li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tl{display:grid;gap:0;position:relative;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl .lb{font:700 15px/1.3 var(--font-han);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 8px;text-align:center;align-self:start;direction:ltr}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.cd .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cd .hd b{font:700 24px/1.2 var(--font-han);direction:ltr}.cd .hd .ar{font-size:13px;color:var(--muted)}
.cd .zh{font-size:16px;line-height:1.75}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:480px;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);vertical-align:top;text-align:start}
th{background:var(--accent-soft);font-family:var(--font-han)}td:first-child{font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .zh,th .zh{font-size:16px;line-height:1.7}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sm{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.sm.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
/* terms */
.tg{display:grid;gap:8px;margin-top:12px}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tm .z{font:700 26px/1.2 var(--font-han);direction:ltr;min-width:2em;text-align:center}
.tm .ex{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.tm .ex .han{font-size:17px;direction:ltr;display:block;text-align:left}
.tm .pp{font-family:var(--font-py);direction:ltr;text-align:start}
/* practice */
.pq{position:relative}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qn{width:28px;height:28px;border-radius:8px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 14px var(--font-py)}
.qty{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:99px;padding:0 10px}
.qs{margin-inline-start:auto;font-size:13px;font-weight:700}.qs.ok{color:var(--good)}.qs.no{color:var(--bad)}
.q .zh{font-size:19px}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:block;width:100%;text-align:start;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.op .zh{font-size:17px;line-height:1.7}
.op.sel{border-color:var(--accent);background:var(--accent-soft)}
.op.good{border-color:var(--good);background:var(--good-soft)}
.op.bad{border-color:var(--bad);background:var(--bad-soft)}
.op:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--good-soft);color:var(--good)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ar{color:var(--fg)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mt .col{display:grid;gap:8px;align-content:start}
.mt .op{min-height:52px;padding:6px 10px}
.mt .op.done{opacity:.55;border-color:var(--good);background:var(--good-soft)}
.mt .op.flash{border-color:var(--bad);background:var(--bad-soft)}
.line{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr;align-items:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:start;max-width:100%}
.chip .zh{font-size:16px;line-height:1.6}
.chip.bad{border-color:var(--bad);background:var(--bad-soft)}.chip.good{border-color:var(--good);background:var(--good-soft)}
.chip .nn{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:var(--seal);color:var(--seal-fg);font:700 12px var(--font-py);margin-inline-end:6px}
.rows{display:grid;gap:8px;margin-top:10px}
.rw{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.rw.good{border-color:var(--good);background:var(--good-soft)}.rw.bad{border-color:var(--bad);background:var(--bad-soft)}
.rw .cs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cs button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font:600 15px var(--font-han)}
.cs button.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cz{font:19px/2.4 var(--font-han);direction:ltr;text-align:left;margin-top:8px}
.cz select{font:inherit;font-size:16px;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:0 6px;margin:0 3px;max-width:100%}
.cz select.good{border-color:var(--good);background:var(--good-soft)}.cz select.bad{border-color:var(--bad);background:var(--bad-soft)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sum b{font:700 22px var(--font-py)}
/* discuss */
textarea{width:100%;min-height:130px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;font:19px/1.8 var(--font-han);margin-top:10px;resize:vertical;direction:ltr;text-align:left}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fr button{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font:600 15px var(--font-han);direction:ltr}
.us{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.us span{font:600 14px var(--font-han);padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.us span.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
details.md{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface2)}
details.md summary{cursor:pointer;font-weight:600;min-height:32px}
/* popover */
#pop{position:fixed;inset-inline:12px;bottom:12px;z-index:30;max-width:560px;margin-inline:auto;background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#pop .r{display:flex;align-items:center;gap:12px}
#pop .zz{font:700 30px/1.2 var(--font-han);direction:ltr;white-space:nowrap}#pop .r>div:nth-child(2){min-width:0;flex:1}
#pop .cl{flex:none}
.toast{position:fixed;inset:auto 16px 90px;margin:auto;max-width:360px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:40}
.foot{text-align:center;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:520px){.mt{grid-template-columns:1fr}.tl li{grid-template-columns:70px 1fr}.banner{grid-template-columns:1fr;text-align:center}}
</style>

<script>
(function(){
var D={"n":1,"big":"儒道","title_zh":"中国的哲学家","title_ar":"الدرس الأول · فلاسفة الصين","intro_ar":"كونفوشيوس (孔子) ولاوتسي (老子): فكر الأخلاق والنظام الاجتماعي، وفكر الطبيعة والتناغم مع «الطاو».","sections":[{"h":"一、孔子简介","ar":"التعريف بكونفوشيوس","b":[{"p":"孔子（公元前551年—公元前479年）是中国古代著名的思想家、教育家。｜كونفوشيوس (551–479 ق.م) مفكّر ومربٍّ صيني قديم مشهور."},{"p":"他生活在一个战乱不断、社会秩序混乱的时代。他希望通过道德教育和社会改革，实现社会和谐与国家安定。｜عاش في عصرٍ لا تنقطع فيه الحروب ويضطرب فيه النظام الاجتماعي، وأراد أن يحقق الانسجام الاجتماعي واستقرار الدولة بالتربية الأخلاقية والإصلاح الاجتماعي."},{"p":"他的思想对中国文化产生了深远的影响。｜وقد تركت أفكاره أثراً عميقاً في الثقافة الصينية."}]},{"h":"二、孔子的主要思想","ar":"أفكار كونفوشيوس الرئيسية","b":[{"p":"孔子思想有三个重要概念：｜لفكر كونفوشيوس ثلاثة مفاهيم مهمة:"},{"cards":[["仁","الإنسانية / المحبة","关心他人，待人友善，具有爱心。｜الاهتمام بالآخرين، ولطف المعاملة، وامتلاك قلب محب."],["礼","الآداب / الطقوس","遵守社会规范，尊敬长辈，讲究礼貌。｜احترام القواعد الاجتماعية وتوقير الكبار والعناية بالأدب."],["乐","الموسيقى","重视音乐教育，认为音乐有助于陶冶情操、促进社会和谐。｜الاهتمام بالتربية الموسيقية، فهي تهذّب الطباع وتدعم الانسجام الاجتماعي."]]},{"key":"孔子重视道德、礼仪和教育，希望建立一个和谐、有秩序的社会。｜يهتم كونفوشيوس بالأخلاق والآداب والتعليم، ويأمل في بناء مجتمع منسجم ومنظَّم."}]},{"h":"三、周游列国","ar":"الترحال بين الممالك","b":[{"p":"孔子生活的时代，社会动荡，战争频繁。为了实现自己的政治理想，孔子希望各国国君接受他的思想。｜في زمن كونفوشيوس كان المجتمع مضطرباً والحروب متكررة، ولكي يحقق مثله السياسي أراد أن يقبل حكّام الممالك أفكاره."},{"tl":[["55岁左右","孔子带领一些弟子离开家乡，周游列国。｜قاد بعض تلاميذه وغادر وطنه متنقلاً بين الممالك."],["14年","这次旅行持续了十四年。｜استمرت هذه الرحلة أربعة عشر عاماً."],["目的","他希望通过推行“仁”和“礼”，改善社会状况。｜أراد بنشر «الإنسانية» و«الآداب» أن يحسّن أحوال المجتمع."],["结果","虽然他的政治理想没有完全实现，但他继续教育弟子，传播自己的思想。｜لم يتحقق مثله السياسي كاملاً، لكنه واصل تعليم تلاميذه ونشر فكره."],["晚年","回到家乡后，孔子继续从事教育和古代典籍的整理工作。｜بعد عودته إلى وطنه واصل التعليم وتنقيح الكتب الكلاسيكية القديمة."]]},{"key":"周游列国的目的是推行自己的政治理想，实现社会安定。｜غاية الترحال: تطبيق مثله السياسي وتحقيق استقرار المجتمع."}]},{"h":"四、孔子的教育思想","ar":"فكر كونفوشيوس التربوي","b":[{"p":"孔子非常重视教育和学习。他鼓励人们不断学习，提高自己的道德水平和知识能力。｜أولى كونفوشيوس التعليم والتعلّم اهتماماً كبيراً، وشجّع الناس على التعلّم المستمر لرفع مستواهم الأخلاقي وقدرتهم المعرفية."},{"key":"他主张“有教无类”，即教育不应该受到社会等级的限制：教育不分贵贱，人人都应该有学习的机会。｜نادى بـ«التعليم بلا تمييز»: لا ينبغي أن تحدّه الطبقات الاجتماعية، فلا فرق بين شريف ووضيع، ولكل إنسان فرصة للتعلّم."},{"p":"他的许多弟子后来成为重要的政治人物和思想传播者。从汉代开始，儒家思想受到历代统治者的推崇，成为中国传统思想的重要组成部分。｜صار كثير من تلاميذه لاحقاً شخصيات سياسية مهمة وناقلين لفكره. ومنذ عهد هان حظي الفكر الكونفوشيوسي بتبجيل الحكّام عبر العصور، وصار جزءاً مهماً من الفكر الصيني التقليدي."}]},{"h":"五、孔子与中国传统文化","ar":"كونفوشيوس والثقافة الصينية التقليدية","b":[{"ul":["《论语》记录了孔子及其弟子的言论，是了解孔子思想的重要经典。｜«المحاورات» تسجّل أقوال كونفوشيوس وتلاميذه، وهي مرجع أساسي لفهم فكره.","《诗经》《尚书》《春秋》等古代典籍与孔子整理、传承古代文化的传统密切相关。｜ترتبط الكتب القديمة («كتاب الشعر» و«كتاب الوثائق» و«الربيع والخريف») بتقليد كونفوشيوس في تنقيح الثقافة القديمة ونقلها.","孔子的思想长期影响中国的教育、伦理道德和政治文化。｜أثّر فكره زمناً طويلاً في التعليم والأخلاق والثقافة السياسية.","为了纪念孔子，人们在他的家乡山东曲阜建立了孔庙、孔府和孔林。｜تخليداً لذكراه أقام الناس في مسقط رأسه «تشوفو» بمقاطعة شاندونغ معبد كونفوشيوس ودار أسرته وغابة مقابره."]},{"key":"《论语》：孔子及其弟子的言论。 孔庙：纪念和祭祀孔子的场所。 儒家思想：以孔子思想为重要基础的中国传统思想体系。｜«المحاورات»: أقوال كونفوشيوس وتلاميذه. معبد كونفوشيوس: مكان إحياء ذكراه وتقديم القرابين له. الفكر الكونفوشيوسي: منظومة فكرية صينية تقليدية أساسها فكره."}]},{"h":"六、老子简介","ar":"التعريف بلاوتسي","b":[{"p":"老子是中国古代著名的思想家，也是道家思想的重要代表人物。｜لاوتسي مفكّر صيني قديم مشهور، وأحد أهم رموز الفكر الطاوي."},{"p":"据传统记载，老子姓李，名耳，字聃。关于他的生平和具体生活年代，学术界仍存在不同看法。｜تقول الروايات التقليدية إن اسمه «لي إر» وكنيته «دان». ولا يزال الباحثون مختلفين في سيرته وزمن حياته بالتحديد."},{"p":"据《史记》记载，老子曾在周朝担任管理典籍的官职。他的思想对中国哲学、文学、艺术和传统文化产生了深远影响。｜وفق «سجلات المؤرخ» عمل لاوتسي في أسرة تشو موظفاً مسؤولاً عن الكتب. وقد أثّر فكره عميقاً في الفلسفة والأدب والفن والثقافة التقليدية."},{"key":"注意：老子是对他的尊称，“老”不是他的姓。｜تنبيه: «لاوتسي» لقب تبجيل، و«لاو» ليست اسم عائلته."}]},{"h":"七、老子的故事","ar":"قصة لاوتسي","b":[{"p":"传说周朝衰落后，老子骑着青牛来到函谷关。｜تروي الأسطورة أنه بعد ضعف أسرة تشو جاء لاوتسي راكباً ثوراً أخضر إلى ممر هانقو."},{"tl":[["①","守关的人请求他留下自己的思想和学问。｜طلب منه حارس الممر أن يترك فكره وعلمه."],["②","于是，老子留下了《道德经》。｜فترك لاوتسي كتاب «الطاو تي تشينغ»."],["③","后来，老子离开函谷关，关于他的下落没有确切的历史记载。｜ثم غادر الممر، ولا يوجد سجل تاريخي مؤكد عن مصيره."]]},{"p":"他的故事体现了中国传统文化中对智慧、自然和隐逸生活的想象。｜تعكس قصته تصوّر الثقافة الصينية للحكمة والطبيعة وحياة العزلة والزهد."}]},{"h":"八、《道德经》","ar":"كتاب «الطاو تي تشينغ»","b":[{"p":"《道德经》又称《老子》，是中国古代重要的哲学经典。全书传统上约有五千字。｜«الطاو تي تشينغ» ويسمّى أيضاً «لاوتسي»، من أهم الكتب الفلسفية الصينية القديمة، ويضم تقليدياً نحو خمسة آلاف حرف."},{"p":"这本书主要讨论“道”、自然规律以及人与自然的关系。它强调顺应自然、保持简单、减少不必要的干预。｜يناقش الكتاب أساساً «الطاو» وقوانين الطبيعة وعلاقة الإنسان بها، ويؤكد على مسايرة الطبيعة والبساطة وتقليل التدخل غير الضروري."},{"p":"《道德经》被翻译成多种语言，对世界哲学和文化产生了重要影响。｜تُرجم الكتاب إلى لغات كثيرة، وكان له أثر مهم في الفلسفة والثقافة العالميتين."},{"key":"《道德经》是了解老子思想的重要著作。｜«الطاو تي تشينغ» مؤلَّف أساسي لفهم فكر لاوتسي."}]},{"h":"九、老子的主要思想","ar":"أفكار لاوتسي الرئيسية","b":[{"cards":[["道","الطاو (المسار)","“道”是老子哲学的核心概念，被认为是天地万物产生和运行的根本。老子认为，“道”不能完全用语言来解释。｜«الطاو» جوهر فلسفته، وهو أصل نشأة الكون وسيره، ولا يمكن شرحه كاملاً بالكلام."],["道法自然","الطاو يتبع الطبيعة","强调遵循自然规律，提倡人与自然和谐相处，不要过分干预事物的发展。｜التأكيد على اتّباع قوانين الطبيعة والتعايش المنسجم بين الإنسان والطبيعة وعدم الإفراط في التدخل."],["无为","اللافعل (عدم التكلّف)","意思是不妄为、不强求、不进行不必要的干预。｜أي عدم التهوّر وعدم الإكراه وعدم التدخل بلا حاجة."],["不争","عدم التنازع","不主动制造冲突，不盲目争夺名利，提倡谦让、宽容和保持内心平静。｜لا يفتعل الصراع ولا يتهافت على الشهرة والمال، ويدعو إلى التواضع والتسامح وسكينة القلب."]]},{"key":"“无为”不等于什么都不做，而是要顺应事物的规律，采取适当的行动。｜«وو وِي» لا تعني ألا تفعل شيئاً، بل أن تسير مع قوانين الأشياء وتتخذ الإجراء المناسب."},{"p":"总结：老子强调顺应自然、减少强制干预，追求简单、平和的生活。｜الخلاصة: يؤكد لاوتسي على مسايرة الطبيعة وتقليل التدخل القسري، ويسعى إلى حياة بسيطة هادئة."}]},{"h":"十、孔子与老子的比较","ar":"المقارنة بين كونفوشيوس ولاوتسي","b":[{"table":{"head":["比较内容｜وجه المقارنة","孔子｜كونفوشيوس","老子｜لاوتسي"],"rows":[["主要关注｜الاهتمام","道德、教育、社会秩序","自然、宇宙、人生智慧"],["核心概念｜المفاهيم","仁、礼、乐","道、无为、自然"],["主要目标｜الهدف","改善社会，建立和谐秩序","顺应自然，减少不必要的干预"],["代表性经典｜الكتاب","《论语》","《道德经》"],["主要影响｜الأثر","教育、伦理道德、政治文化","哲学、文学、艺术、自然观"]]}},{"p":"共同点：两人都是中国古代重要的思想家；两人的思想都对中国传统文化产生了深远影响；两人都关注人的生活方式以及如何更好地生活。｜أوجه الاتفاق: كلاهما مفكّر صيني قديم مهم، وكلاهما أثّر عميقاً في الثقافة الصينية، وكلاهما اهتم بأسلوب حياة الإنسان وكيف يعيش حياة أفضل."},{"key":"不同点：孔子更重视道德教育和社会秩序；老子更重视自然规律和顺其自然。｜أوجه الاختلاف: كونفوشيوس أكثر اهتماماً بالتربية الأخلاقية والنظام الاجتماعي، ولاوتسي أكثر اهتماماً بقوانين الطبيعة وترك الأمور تجري على طبيعتها."}]}],"terms":[{"zh":"思想家","ar":"مفكّر","py":"sī xiǎng jiā","ex":"孔子是著名的思想家。｜كونفوشيوس مفكّر مشهور."},{"zh":"教育家","ar":"مربٍّ / خبير تعليم","py":"jiào yù jiā","ex":null},{"zh":"战乱","ar":"اضطرابات الحروب","py":"zhàn luàn","ex":null},{"zh":"社会秩序","ar":"النظام الاجتماعي","py":"shè huì zhì xù","ex":null},{"zh":"和谐","ar":"الانسجام / التناغم","py":"hé xié","ex":"他希望建立一个和谐的社会。｜أراد بناء مجتمع منسجم."},{"zh":"安定","ar":"الاستقرار","py":"ān dìng","ex":null},{"zh":"仁","ar":"الإنسانية / المحبة (قيمة كونفوشيوسية)","py":"rén","ex":null},{"zh":"礼","ar":"الآداب والطقوس","py":"lǐ","ex":null},{"zh":"乐","ar":"الموسيقى (هنا)","py":"yuè","ex":null},{"zh":"陶冶情操","ar":"تهذيب الطباع والوجدان","py":"táo yě qíng cāo","ex":null},{"zh":"周游列国","ar":"التنقّل بين الممالك","py":"zhōu yóu liè guó","ex":null},{"zh":"弟子","ar":"تلميذ / مريد","py":"dì zǐ","ex":null},{"zh":"政治理想","ar":"المثل السياسي","py":"zhèng zhì lǐ xiǎng","ex":null},{"zh":"推行","ar":"يطبّق / ينشر (سياسة أو فكرة)","py":"tuī xíng","ex":null},{"zh":"有教无类","ar":"التعليم للجميع بلا تمييز","py":"yǒu jiào wú lèi","ex":"孔子主张“有教无类”。｜نادى كونفوشيوس بالتعليم دون تمييز."},{"zh":"儒家思想","ar":"الفكر الكونفوشيوسي","py":"rú jiā sī xiǎng","ex":null},{"zh":"论语","ar":"«المحاورات» (كتاب أقوال كونفوشيوس)","py":"lún yǔ","ex":null},{"zh":"孔庙","ar":"معبد كونفوشيوس","py":"kǒng miào","ex":null},{"zh":"典籍","ar":"الكتب والمصادر الكلاسيكية","py":"diǎn jí","ex":null},{"zh":"推崇","ar":"يبجّل / يعلي من شأن","py":"tuī chóng","ex":null},{"zh":"伦理道德","ar":"الأخلاق والقيم","py":"lún lǐ dào dé","ex":null},{"zh":"道家","ar":"المدرسة الطاوية","py":"dào jiā","ex":null},{"zh":"道德经","ar":"«الطاو تي تشينغ»","py":"dào dé jīng","ex":null},{"zh":"函谷关","ar":"ممر هانقو (مكان القصة)","py":"hán gǔ guān","ex":null},{"zh":"隐逸","ar":"العزلة والانقطاع عن الدنيا","py":"yǐn yì","ex":null},{"zh":"道","ar":"الطاو / المسار","py":"dào","ex":null},{"zh":"道法自然","ar":"الطاو يتبع الطبيعة","py":"dào fǎ zì rán","ex":null},{"zh":"无为","ar":"اللافعل / عدم التكلّف","py":"wú wéi","ex":null},{"zh":"不争","ar":"عدم التنازع","py":"bù zhēng","ex":null},{"zh":"顺应自然","ar":"مسايرة الطبيعة","py":"shùn yìng zì rán","ex":null},{"zh":"干预","ar":"تدخّل","py":"gān yù","ex":null},{"zh":"谦让","ar":"التواضع والإيثار","py":"qiān ràng","ex":null},{"zh":"宽容","ar":"التسامح","py":"kuān róng","ex":null},{"zh":"尊称","ar":"لقب احترام","py":"zūn chēng","ex":null},{"zh":"曲阜","ar":"تشوفو (مسقط رأس كونفوشيوس)","py":"qū fù","ex":null}],"practice":[{"t":"mcq","q":"孔子希望通过什么来实现社会和谐与国家安定？","o":["战争和法律","道德教育和社会改革","经济贸易","隐居山林"],"a":1,"why":"حسب النص: «通过道德教育和社会改革»."},{"t":"match","q":"连线：概念和意思","p":[["仁","关心他人，待人友善"],["礼","遵守规范，尊敬长辈"],["乐","重视音乐，陶冶情操"],["有教无类","教育不分贵贱"]]},{"t":"tf","q":"孔子周游列国的目的是为了旅游和休息。","a":false,"why":"الغاية: تطبيق مثله السياسي وتحقيق استقرار المجتمع."},{"t":"tf","q":"儒家思想从汉代开始受到历代统治者的推崇。","a":true,"why":"«从汉代开始，儒家思想受到历代统治者的推崇»."},{"t":"order","q":"按顺序排列老子的故事：","items":["老子骑着青牛来到函谷关","守关的人请求他留下思想","老子留下了《道德经》","老子离开函谷关，下落不明"]},{"t":"mcq","q":"为什么说“老”不是老子的姓？","o":["因为他姓李，“老子”是尊称","因为他没有名字","因为他姓孔","因为“老”是地名"],"a":0,"why":"اسمه لي إر، و«لاوتسي» لقب تبجيل."},{"t":"cls","q":"这些内容属于孔子还是老子？","cats":["孔子","老子"],"items":[["《论语》",0],["《道德经》",1],["仁、礼、乐",0],["道法自然",1],["有教无类",0],["无为、不争",1],["孔庙在曲阜",0],["骑青牛过函谷关",1]]},{"t":"cloze","q":"老子的“___”不等于什么都不做，而是要___事物的规律，采取适当的行动。","bank":["无为","顺应","干预","战争"],"a":["无为","顺应"]},{"t":"mcq","q":"下面哪一项最能概括“道法自然”？","o":["努力争夺名利","遵循自然规律，人与自然和谐相处","只重视礼貌","不读书不学习"],"a":1,"why":"«强调遵循自然规律；提倡人与自然和谐相处»."},{"t":"match","q":"连线：典籍和它的主题","p":[["《论语》","孔子及其弟子的言论"],["《道德经》","道与自然规律"],["孔庙","纪念和祭祀孔子的场所"],["儒家思想","以孔子思想为基础的体系"]]},{"t":"tf","q":"孔子和老子都对中国传统文化产生了深远的影响。","a":true,"why":"من أوجه الاتفاق بينهما."},{"t":"cloze","q":"孔子更重视道德教育和___，老子更重视自然规律和___。","bank":["社会秩序","顺其自然","战乱","隐居"],"a":["社会秩序","顺其自然"]}],"discuss":[{"q":"你认为孔子的“有教无类”在今天有什么意义？请写一段话（至少五十个字）。","ar":"ما معنى مبدأ «التعليم للجميع» في عصرنا؟ اكتب فقرة بالصينية.","frames":["我认为……","因为……","比如……","总之，……","在今天，……"],"use":["有教无类","教育","学习","机会"],"model":"我认为“有教无类”在今天很有意义。因为每个人都应该有学习的机会，不管他的家庭条件怎么样。比如，现在很多国家都实行免费教育。总之，教育让社会更公平。｜أرى أن المبدأ مهمّ اليوم، فلكل شخص الحق في فرصة التعلّم أياً كانت ظروف أسرته. مثلاً تقدّم دول كثيرة تعليماً مجانياً. وخلاصة القول إن التعليم يجعل المجتمع أكثر عدلاً."},{"q":"请比较孔子和老子：你更欣赏谁的思想？为什么？","ar":"قارن بين كونفوشيوس ولاوتسي: فكر من تفضّل ولماذا؟","frames":["孔子更重视……","而老子更重视……","相比之下，……","我更欣赏……，因为……"],"use":["仁","礼","无为","顺应自然"],"model":"孔子更重视道德和社会秩序，而老子更重视自然规律。相比之下，我更欣赏老子，因为“顺应自然”能让人保持内心平静。｜كونفوشيوس يهتم أكثر بالأخلاق والنظام الاجتماعي، ولاوتسي بقوانين الطبيعة. وأنا أفضّل لاوتسي لأن «مسايرة الطبيعة» تمنح الإنسان سكينة القلب."},{"q":"请介绍一位你们国家（或你们文化）中的思想家，并说一说他与孔子有什么相同或不同。","ar":"عرّف بمفكّر من ثقافتك وقارنه بكونفوشيوس.","frames":["在我们国家，……是一位著名的思想家。","他主张……","和孔子一样，他也……","不同的是，……"],"use":["思想家","教育","道德","影响"],"model":"在我们的文化里，伊本·赫勒敦是一位著名的思想家。他研究社会的发展。和孔子一样，他也非常重视教育。不同的是，他更关注历史和社会规律。｜في ثقافتنا ابن خلدون مفكّر مشهور يدرس تطوّر المجتمعات. وكونفوشيوس مثله يهتم بالتعليم كثيراً، لكن ابن خلدون يركّز أكثر على التاريخ وقوانين المجتمع."}],"py":{"儒道":"rú dào","中国的哲学家":"zhōng guó de zhé xué jiā","一、孔子简介":"yī, kǒng zǐ jiǎn jiè","孔子（公元前551年—公元前479年）是中国古代著名的思想家、教育家。":"kǒng zǐ (gōng yuán qián 551 nián — gōng yuán qián 479 nián) shì zhōng guó gǔ dài zhù míng de sī xiǎng jiā, jiào yù jiā.","他生活在一个战乱不断、社会秩序混乱的时代。他希望通过道德教育和社会改革，实现社会和谐与国家安定。":"tā shēng huó zài yí gè zhàn luàn bù duàn, shè huì zhì xù hùn luàn de shí dài. tā xī wàng tōng guò dào dé jiào yù hé shè huì gǎi gé, shí xiàn shè huì hé xié yǔ guó jiā ān dìng.","他的思想对中国文化产生了深远的影响。":"tā de sī xiǎng duì zhōng guó wén huà chǎn shēng le shēn yuǎn de yǐng xiǎng.","二、孔子的主要思想":"èr, kǒng zǐ de zhǔ yào sī xiǎng","孔子思想有三个重要概念：":"kǒng zǐ sī xiǎng yǒu sān gè zhòng yào gài niàn:","仁":"rén","关心他人，待人友善，具有爱心。":"guān xīn tā rén, dài rén yǒu shàn, jù yǒu ài xīn.","礼":"lǐ","遵守社会规范，尊敬长辈，讲究礼貌。":"zūn shǒu shè huì guī fàn, zūn jìng zhǎng bèi, jiǎng jiū lǐ mào.","乐":"yuè","重视音乐教育，认为音乐有助于陶冶情操、促进社会和谐。":"zhòng shì yīn yuè jiào yù, rèn wéi yīn yuè yǒu zhù yú táo yě qíng cāo, cù jìn shè huì hé xié.","孔子重视道德、礼仪和教育，希望建立一个和谐、有秩序的社会。":"kǒng zǐ zhòng shì dào dé, lǐ yí hé jiào yù, xī wàng jiàn lì yí gè hé xié, yǒu zhì xù de shè huì.","三、周游列国":"sān, zhōu yóu liè guó","孔子生活的时代，社会动荡，战争频繁。为了实现自己的政治理想，孔子希望各国国君接受他的思想。":"kǒng zǐ shēng huó de shí dài, shè huì dòng dàng, zhàn zhēng pín fán. wèi le shí xiàn zì jǐ de zhèng zhì lǐ xiǎng, kǒng zǐ xī wàng gè guó guó jūn jiē shòu tā de sī xiǎng.","孔子带领一些弟子离开家乡，周游列国。":"kǒng zǐ dài lǐng yī xiē dì zǐ lí kāi jiā xiāng, zhōu yóu liè guó.","这次旅行持续了十四年。":"zhè cì lǚ xíng chí xù le shí sì nián.","目的":"mù dì","他希望通过推行“仁”和“礼”，改善社会状况。":"tā xī wàng tōng guò tuī xíng “rén” hé “lǐ”, gǎi shàn shè huì zhuàng kuàng.","结果":"jié guǒ","虽然他的政治理想没有完全实现，但他继续教育弟子，传播自己的思想。":"suī rán tā de zhèng zhì lǐ xiǎng méi yǒu wán quán shí xiàn, dàn tā jì xù jiào yù dì zǐ, chuán bō zì jǐ de sī xiǎng.","晚年":"wǎn nián","回到家乡后，孔子继续从事教育和古代典籍的整理工作。":"huí dào jiā xiāng hòu, kǒng zǐ jì xù cóng shì jiào yù hé gǔ dài diǎn jí de zhěng lǐ gōng zuò.","周游列国的目的是推行自己的政治理想，实现社会安定。":"zhōu yóu liè guó de mù dì shì tuī xíng zì jǐ de zhèng zhì lǐ xiǎng, shí xiàn shè huì ān dìng.","四、孔子的教育思想":"sì, kǒng zǐ de jiào yù sī xiǎng","孔子非常重视教育和学习。他鼓励人们不断学习，提高自己的道德水平和知识能力。":"kǒng zǐ fēi cháng zhòng shì jiào yù hé xué xí. tā gǔ lì rén men bù duàn xué xí, tí gāo zì jǐ de dào dé shuǐ píng hé zhī shí néng lì.","他主张“有教无类”，即教育不应该受到社会等级的限制：教育不分贵贱，人人都应该有学习的机会。":"tā zhǔ zhāng “yǒu jiào wú lèi”, jí jiào yù bù yīng gāi shòu dào shè huì děng jí de xiàn zhì: jiào yù bù fēn guì jiàn, rén rén dōu yīng gāi yǒu xué xí de jī huì.","他的许多弟子后来成为重要的政治人物和思想传播者。从汉代开始，儒家思想受到历代统治者的推崇，成为中国传统思想的重要组成部分。":"tā de xǔ duō dì zǐ hòu lái chéng wéi zhòng yào de zhèng zhì rén wù hé sī xiǎng chuán bō zhě. cóng hàn dài kāi shǐ, rú jiā sī xiǎng shòu dào lì dài tǒng zhì zhě de tuī chóng, chéng wéi zhōng guó chuán tǒng sī xiǎng de zhòng yào zǔ chéng bù fèn.","五、孔子与中国传统文化":"wǔ, kǒng zǐ yǔ zhōng guó chuán tǒng wén huà","《论语》记录了孔子及其弟子的言论，是了解孔子思想的重要经典。":"“lún yǔ” jì lù le kǒng zǐ jí qí dì zǐ de yán lùn, shì liǎo jiě kǒng zǐ sī xiǎng de zhòng yào jīng diǎn.","《诗经》《尚书》《春秋》等古代典籍与孔子整理、传承古代文化的传统密切相关。":"“shī jīng”“shàng shū”“chūn qiū” děng gǔ dài diǎn jí yǔ kǒng zǐ zhěng lǐ, chuán chéng gǔ dài wén huà de chuán tǒng mì qiè xiāng guān.","孔子的思想长期影响中国的教育、伦理道德和政治文化。":"kǒng zǐ de sī xiǎng cháng qī yǐng xiǎng zhōng guó de jiào yù, lún lǐ dào dé hé zhèng zhì wén huà.","为了纪念孔子，人们在他的家乡山东曲阜建立了孔庙、孔府和孔林。":"wèi le jì niàn kǒng zǐ, rén men zài tā de jiā xiāng shān dōng qū fù jiàn lì le kǒng miào, kǒng fǔ hé kǒng lín.","《论语》：孔子及其弟子的言论。 孔庙：纪念和祭祀孔子的场所。 儒家思想：以孔子思想为重要基础的中国传统思想体系。":"“lún yǔ”: kǒng zǐ jí qí dì zǐ de yán lùn. kǒng miào: jì niàn hé jì sì kǒng zǐ de chǎng suǒ. rú jiā sī xiǎng: yǐ kǒng zǐ sī xiǎng wèi zhòng yào jī chǔ de zhōng guó chuán tǒng sī xiǎng tǐ xì.","六、老子简介":"liù, lǎo zǐ jiǎn jiè","老子是中国古代著名的思想家，也是道家思想的重要代表人物。":"lǎo zǐ shì zhōng guó gǔ dài zhù míng de sī xiǎng jiā, yě shì dào jiā sī xiǎng de zhòng yào dài biǎo rén wù.","据传统记载，老子姓李，名耳，字聃。关于他的生平和具体生活年代，学术界仍存在不同看法。":"jù chuán tǒng jì zǎi, lǎo zǐ xìng lǐ, míng ěr, zì dān. guān yú tā de shēng píng hé jù tǐ shēng huó nián dài, xué shù jiè réng cún zài bù tóng kàn fǎ.","据《史记》记载，老子曾在周朝担任管理典籍的官职。他的思想对中国哲学、文学、艺术和传统文化产生了深远影响。":"jù “shǐ jì” jì zǎi, lǎo zǐ céng zài zhōu cháo dān rèn guǎn lǐ diǎn jí de guān zhí. tā de sī xiǎng duì zhōng guó zhé xué, wén xué, yì shù hé chuán tǒng wén huà chǎn shēng le shēn yuǎn yǐng xiǎng.","注意：老子是对他的尊称，“老”不是他的姓。":"zhù yì: lǎo zǐ shì duì tā de zūn chēng,“lǎo” bú shì tā de xìng.","七、老子的故事":"qī, lǎo zǐ de gù shì","传说周朝衰落后，老子骑着青牛来到函谷关。":"chuán shuō zhōu cháo shuāi luò hòu, lǎo zǐ qí zhe qīng niú lái dào hán gǔ guān.","守关的人请求他留下自己的思想和学问。":"shǒu guān de rén qǐng qiú tā liú xià zì jǐ de sī xiǎng hé xué wèn.","于是，老子留下了《道德经》。":"yú shì, lǎo zǐ liú xià le “dào dé jīng”.","后来，老子离开函谷关，关于他的下落没有确切的历史记载。":"hòu lái, lǎo zǐ lí kāi hán gǔ guān, guān yú tā de xià luò méi yǒu què qiè de lì shǐ jì zǎi.","他的故事体现了中国传统文化中对智慧、自然和隐逸生活的想象。":"tā de gù shì tǐ xiàn le zhōng guó chuán tǒng wén huà zhōng duì zhì huì, zì rán hé yǐn yì shēng huó de xiǎng xiàng.","八、《道德经》":"bā,“dào dé jīng”","《道德经》又称《老子》，是中国古代重要的哲学经典。全书传统上约有五千字。":"“dào dé jīng” yòu chēng “lǎo zǐ”, shì zhōng guó gǔ dài zhòng yào de zhé xué jīng diǎn. quán shū chuán tǒng shàng yuē yǒu wǔ qiān zì.","这本书主要讨论“道”、自然规律以及人与自然的关系。它强调顺应自然、保持简单、减少不必要的干预。":"zhè běn shū zhǔ yào tǎo lùn “dào”, zì rán guī lǜ yǐ jí rén yǔ zì rán de guān xì. tā qiáng diào shùn yìng zì rán, bǎo chí jiǎn dān, jiǎn shǎo bù bì yào de gān yù.","《道德经》被翻译成多种语言，对世界哲学和文化产生了重要影响。":"“dào dé jīng” bèi fān yì chéng duō zhǒng yǔ yán, duì shì jiè zhé xué hé wén huà chǎn shēng le zhòng yào yǐng xiǎng.","《道德经》是了解老子思想的重要著作。":"“dào dé jīng” shì liǎo jiě lǎo zǐ sī xiǎng de zhòng yào zhù zuò.","九、老子的主要思想":"jiǔ, lǎo zǐ de zhǔ yào sī xiǎng","道":"dào","“道”是老子哲学的核心概念，被认为是天地万物产生和运行的根本。老子认为，“道”不能完全用语言来解释。":"“dào” shì lǎo zǐ zhé xué de hé xīn gài niàn, bèi rèn wéi shì tiān dì wàn wù chǎn shēng hé yùn xíng de gēn běn. lǎo zǐ rèn wéi,“dào” bù néng wán quán yòng yǔ yán lái jiě shì.","道法自然":"dào fǎ zì rán","强调遵循自然规律，提倡人与自然和谐相处，不要过分干预事物的发展。":"qiáng diào zūn xún zì rán guī lǜ, tí chàng rén yǔ zì rán hé xié xiāng chǔ, bú yào guò fèn gān yù shì wù de fā zhǎn.","无为":"wú wéi","意思是不妄为、不强求、不进行不必要的干预。":"yì si shì bù wàng wéi, bù qiǎng qiú, bù jìn xíng bù bì yào de gān yù.","不争":"bù zhēng","不主动制造冲突，不盲目争夺名利，提倡谦让、宽容和保持内心平静。":"bù zhǔ dòng zhì zào chōng tū, bù máng mù zhēng duó míng lì, tí chàng qiān ràng, kuān róng hé bǎo chí nèi xīn píng jìng.","“无为”不等于什么都不做，而是要顺应事物的规律，采取适当的行动。":"“wú wéi” bù děng yú shén me dōu bù zuò, ér shì yào shùn yìng shì wù de guī lǜ, cǎi qǔ shì dàng de xíng dòng.","总结：老子强调顺应自然、减少强制干预，追求简单、平和的生活。":"zǒng jié: lǎo zǐ qiáng diào shùn yìng zì rán, jiǎn shǎo qiáng zhì gān yù, zhuī qiú jiǎn dān, píng hé de shēng huó.","十、孔子与老子的比较":"shí, kǒng zǐ yǔ lǎo zǐ de bǐ jiào","比较内容":"bǐ jiào nèi róng","孔子":"kǒng zǐ","老子":"lǎo zǐ","主要关注":"zhǔ yào guān zhù","道德、教育、社会秩序":"dào dé, jiào yù, shè huì zhì xù","自然、宇宙、人生智慧":"zì rán, yǔ zhòu, rén shēng zhì huì","核心概念":"hé xīn gài niàn","仁、礼、乐":"rén, lǐ, yuè","道、无为、自然":"dào, wú wéi, zì rán","主要目标":"zhǔ yào mù biāo","改善社会，建立和谐秩序":"gǎi shàn shè huì, jiàn lì hé xié zhì xù","顺应自然，减少不必要的干预":"shùn yìng zì rán, jiǎn shǎo bù bì yào de gān yù","代表性经典":"dài biǎo xìng jīng diǎn","《论语》":"“lún yǔ”","《道德经》":"“dào dé jīng”","主要影响":"zhǔ yào yǐng xiǎng","教育、伦理道德、政治文化":"jiào yù, lún lǐ dào dé, zhèng zhì wén huà","哲学、文学、艺术、自然观":"zhé xué, wén xué, yì shù, zì rán guān","共同点：两人都是中国古代重要的思想家；两人的思想都对中国传统文化产生了深远影响；两人都关注人的生活方式以及如何更好地生活。":"gòng tóng diǎn: liǎng rén dōu shì zhōng guó gǔ dài zhòng yào de sī xiǎng jiā; liǎng rén de sī xiǎng dōu duì zhōng guó chuán tǒng wén huà chǎn shēng le shēn yuǎn yǐng xiǎng; liǎng rén dōu guān zhù rén de shēng huó fāng shì yǐ jí rú hé gèng hǎo dì shēng huó.","不同点：孔子更重视道德教育和社会秩序；老子更重视自然规律和顺其自然。":"bù tóng diǎn: kǒng zǐ gèng zhòng shì dào dé jiào yù hé shè huì zhì xù; lǎo zǐ gèng zhòng shì zì rán guī lǜ hé shùn qí zì rán.","孔子希望通过什么来实现社会和谐与国家安定？":"kǒng zǐ xī wàng tōng guò shén me lái shí xiàn shè huì hé xié yǔ guó jiā ān dìng?","战争和法律":"zhàn zhēng hé fǎ lǜ","道德教育和社会改革":"dào dé jiào yù hé shè huì gǎi gé","经济贸易":"jīng jì mào yì","隐居山林":"yǐn jū shān lín","连线：概念和意思":"lián xiàn: gài niàn hé yì si","关心他人，待人友善":"guān xīn tā rén, dài rén yǒu shàn","遵守规范，尊敬长辈":"zūn shǒu guī fàn, zūn jìng zhǎng bèi","重视音乐，陶冶情操":"zhòng shì yīn yuè, táo yě qíng cāo","有教无类":"yǒu jiào wú lèi","教育不分贵贱":"jiào yù bù fēn guì jiàn","孔子周游列国的目的是为了旅游和休息。":"kǒng zǐ zhōu yóu liè guó de mù dì shì wèi le lǚ yóu hé xiū xī.","儒家思想从汉代开始受到历代统治者的推崇。":"rú jiā sī xiǎng cóng hàn dài kāi shǐ shòu dào lì dài tǒng zhì zhě de tuī chóng.","«从汉代开始，儒家思想受到历代统治者的推崇».":"« cóng hàn dài kāi shǐ, rú jiā sī xiǎng shòu dào lì dài tǒng zhì zhě de tuī chóng ».","按顺序排列老子的故事：":"àn shùn xù pái liè lǎo zǐ de gù shì:","老子骑着青牛来到函谷关":"lǎo zǐ qí zhe qīng niú lái dào hán gǔ guān","守关的人请求他留下思想":"shǒu guān de rén qǐng qiú tā liú xià sī xiǎng","老子留下了《道德经》":"lǎo zǐ liú xià le “dào dé jīng”","老子离开函谷关，下落不明":"lǎo zǐ lí kāi hán gǔ guān, xià luò bù míng","为什么说“老”不是老子的姓？":"wèi shén me shuō “lǎo” bú shì lǎo zǐ de xìng?","因为他姓李，“老子”是尊称":"yīn wèi tā xìng lǐ,“lǎo zǐ” shì zūn chēng","因为他没有名字":"yīn wèi tā méi yǒu míng zì","因为他姓孔":"yīn wèi tā xìng kǒng","因为“老”是地名":"yīn wèi “lǎo” shì dì míng","这些内容属于孔子还是老子？":"zhè xiē nèi róng shǔ yú kǒng zǐ hái shì lǎo zǐ?","无为、不争":"wú wéi, bù zhēng","孔庙在曲阜":"kǒng miào zài qū fù","骑青牛过函谷关":"qí qīng niú guò hán gǔ guān","老子的“___”不等于什么都不做，而是要___事物的规律，采取适当的行动。":"lǎo zǐ de “___” bù děng yú shén me dōu bù zuò, ér shì yào ___ shì wù de guī lǜ, cǎi qǔ shì dàng de xíng dòng.","老子的“＿＿”不等于什么都不做，而是要＿＿事物的规律，采取适当的行动。":"lǎo zǐ de “＿＿” bù děng yú shén me dōu bù zuò, ér shì yào ＿＿ shì wù de guī lǜ, cǎi qǔ shì dàng de xíng dòng.","顺应":"shùn yìng","干预":"gān yù","战争":"zhàn zhēng","下面哪一项最能概括“道法自然”？":"xià miàn nǎ yī xiàng zuì néng gài kuò “dào fǎ zì rán”?","努力争夺名利":"nǔ lì zhēng duó míng lì","遵循自然规律，人与自然和谐相处":"zūn xún zì rán guī lǜ, rén yǔ zì rán hé xié xiāng chǔ","只重视礼貌":"zhǐ zhòng shì lǐ mào","不读书不学习":"bù dú shū bù xué xí","«强调遵循自然规律；提倡人与自然和谐相处».":"« qiáng diào zūn xún zì rán guī lǜ; tí chàng rén yǔ zì rán hé xié xiāng chǔ ».","连线：典籍和它的主题":"lián xiàn: diǎn jí hé tā de zhǔ tí","孔子及其弟子的言论":"kǒng zǐ jí qí dì zǐ de yán lùn","道与自然规律":"dào yǔ zì rán guī lǜ","孔庙":"kǒng miào","纪念和祭祀孔子的场所":"jì niàn hé jì sì kǒng zǐ de chǎng suǒ","儒家思想":"rú jiā sī xiǎng","以孔子思想为基础的体系":"yǐ kǒng zǐ sī xiǎng wèi jī chǔ de tǐ xì","孔子和老子都对中国传统文化产生了深远的影响。":"kǒng zǐ hé lǎo zǐ dōu duì zhōng guó chuán tǒng wén huà chǎn shēng le shēn yuǎn de yǐng xiǎng.","孔子更重视道德教育和___，老子更重视自然规律和  b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.disabled)return;var v=x.dataset.v==='1',ok=v===it.a;[].forEach.call(b.querySelectorAll('.op'),function(o){o.disabled=true;if((o.dataset.v==='1')===it.a)o.classList.add('good')});if(!ok)x.classList.add('bad');rec(i,ok);fb(el,ok,it.why)}};
B.match=function(el,it,i){var b=$('.qb',el),R=shuf(it.p.map(function(_,k){return k})),sel=null,left=it.p.length,miss=0;
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="mt"><div class="col" id="L'+i+'">'+it.p.map(function(p,k){return '<button class="op" data-k="'+k+'">'+Z(p[0])+'</button>'}).join('')+'</div><div class="col" id="R'+i+'">'+R.map(function(k){return '<button class="op" data-k="'+k+'">'+Z(it.p[k][1])+'</button>'}).join('')+'</div></div>';
 b.onclick=function(e){var x=e.target.closest('.op');if(!x||x.classList.contains('done'))return;var side=x.parentNode.id.charAt(0);
  if(side==='L'){[].forEach.call(b.querySelectorAll('#L'+i+' .op'),function(o){o.classList.remove('sel')});x.classList.add('sel');sel=x;return}
  if(!sel){toast('اختر من العمود الأول أولاً');return}
  if(sel.dataset.k===x.dataset.k){sel.classList.remove('sel');sel.classList.add('done');x.classList.add('done');sel=null;left--;if(!left){rec(i,miss===0);fb(el,miss===0,miss?'عدد الأخطاء: '+miss:'')}}
  else{miss++;x.classList.add('flash');setTimeout(function(){x.classList.remove('flash')},500)}}};
B.order=function(el,it,i){var b=$('.qb',el),n=it.items.length,pool=shuf(it.items.map(function(_,k){return k})),pl=[],tries=0;
 if(n>1&&pool.join()===it.items.map(function(_,k){return k}).join())pool.reverse();
 function draw(){b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="line" aria-label="الترتيب">'+pl.map(function(k,j){return '<button class="chip" data-r="'+j+'"><span class="nn">'+(j+1)+'</span>'+Z(it.items[k])+'</button>'}).join('')+(pl.length?'':'<span class="mut">اضغط على العناصر بالترتيب الصحيح</span>')+'</div><div class="pool">'+pool.map(function(k){return '<button class="chip" data-p="'+k+'">'+Z(it.items[k])+'</button>'}).join('')+'</div><div class="act"><button class="btn p" data-chk="1"'+(pool.length?' disabled':'')+'>تحقق</button><button class="btn" data-rs="1">إعادة</button><button class="btn" data-sol="1">أظهر الحل</button></div>'}
 draw();
 b.onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.p!=null){var k=+t.dataset.p;pool.splice(pool.indexOf(k),1);pl.push(k);draw()}
  else if(t.dataset.r!=null){pool.push(pl.splice(+t.dataset.r,1)[0]);draw()}
  else if(t.dataset.rs){pool=pool.concat(pl);pl=[];draw();$('.fb',el).hidden=true}
  else if(t.dataset.sol){pl=it.items.map(function(_,k){return k});pool=[];draw();[].forEach.call(b.querySelectorAll('.line .chip'),function(c){c.classList.add('good')});rec(i,false);fb(el,false,'هذا هو الترتيب الصحيح.')}
  else if(t.dataset.chk){var ok=true;[].forEach.call(b.querySelectorAll('.line .chip'),function(c,j){var g=pl[j]===j;if(!g)ok=false;c.classList.add(g?'good':'bad')});tries++;rec(i,ok&&tries===1);fb(el,ok,ok?'':'بعض العناصر في غير موضعها (الأحمر). اضغط «إعادة» وجرّب مجدداً.')}}};
B.cls=function(el,it,i){var b=$('.qb',el),ch=[];
 b.innerHTML='<div class="q">'+Z(it.q)+'</div><div class="rows">'+it.items.map(function(x,k){return '<div class="rw" data-k="'+k+'">'+Z(x[0])+'<div class="cs">'+it.cats.map(function(c,j){return '<button data-j="'+j+'">'+esc(c)+'</button>'}).join('')+'</div></div>'}).join('')+'</div><div class="act"><button class="btn p" data-chk="1">تحقق</button></div>';
 b.onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.j!=null){var rw=t.closest('.rw'),k=+rw.dataset.k;ch[k]=+t.dataset.j;[].forEach.call(rw.querySelectorAll('button'),function(x){x.classList.toggle('sel',x===t)});rw.classList.remove('good','bad')}
  else if(t.dataset.chk){var good=0,all=it.items.length;if(ch.filter(function(x){return x!=null}).length<all){toast('صنّف كل العناصر أولاً');return}
   [].forEach.call(b.querySelectorAll('.rw'),function(rw){var k=+rw.dataset.k,g=ch[k]===it.items[k][1];if(g)good++;rw.classList.remove('good','bad');rw.classList.add(g?'good':'bad')});
   rec(i,good===all);fb(el,good===all,good+' من '+all+(good<all?' — صحّح العناصر الحمراء وأعد التحقق.':''))}}};
B.cloze=function(el,it,i){var b=$('.qb',el),parts=it.q.split('___'),bank=shuf(it.bank||it.a),h='';
 parts.forEach(function(p,k){h+=esc(p);if(k<parts.length-1)h+='<select data-k="'+k+'" aria-label="الفراغ '+(k+1)+'"><option value="">…</option>'+bank.map(function(w){return '<option>'+esc(w)+'</option>'}).join('')+'</select>'});
 b.innerHTML='<div class="q">'+Z(it.q.replace(/___/g,'＿＿'))+'</div><div class="cz">'+h+'</div><div class="act"><button class="btn p" data-chk="1">تحقق</button></div>';
 b.onclick=function(e){var t=e.target.closest('[data-chk]');if(!t)return;var sels=b.querySelectorAll('select'),good=0;[].forEach.call(sels,function(s,k){var g=s.value===it.a[k];if(g)good++;s.classList.remove('good','bad');s.classList.add(g?'good':'bad')});rec(i,good===sels.length);fb(el,good===sels.length,good+' من '+sels.length)}};
function practice(){return '<div class="card sum"><div><b id="psc">0</b> <span class="mut">/ '+D.practice.length+' أُنجزت</span></div><div class="mut" id="pok"></div><button class="btn" id="prs">إعادة التدريبات</button></div>'+D.practice.map(function(it,i){return '<section class="card pq" data-i="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="qty">'+TY[it.t]+'</span><span class="qs" id="s'+i+'"></span></div><div class="qb"></div><div class="fb" hidden></div></section>'}).join('')}
function initPractice(){D.practice.forEach(function(it,i){var el=$('.pq[data-i="'+i+'"]');B[it.t](el,it,i);var r=S.prac[i];if(r){var q=$('#s'+i);q.className='qs '+(r.c?'ok':'no');q.textContent=r.c?'✓ من أول محاولة':'أُنجز'}})}
/* ---------- discuss ---------- */
function discuss(){return D.discuss.map(function(d,i){return '<section class="card" data-d="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span><span class="qty">نقاش وكتابة</span></div><div class="q">'+Z(d.q)+'</div><p class="mut" style="margin-top:4px">'+esc(d.ar)+'</p>'+
 '<div class="fr">'+d.frames.map(function(f,k){return '<button data-fr="'+k+'">'+esc(f)+'</button>'}).join('')+'</div>'+
 '<textarea data-ta="'+i+'" placeholder="اكتب إجابتك بالصينية (٥٠ حرفاً على الأقل)…" lang="zh" aria-label="إجابتك"></textarea>'+
 '<div class="mut" style="margin-top:4px"><span data-cc="'+i+'">0</span> حرفاً · المصطلحات المستخدمة:</div><div class="us">'+d.use.map(function(u){return '<span data-u="'+esc(u)+'">'+esc(u)+'</span>'}).join('')+'</div>'+
 '<details class="md"><summary>نموذج إجابة</summary>'+ZA(d.model)+'<div class="act"><button class="btn" data-say-m="'+i+'">🔊 استمع</button></div></details></section>'}).join('')}
function initDisc(){D.discuss.forEach(function(d,i){var ta=$('[data-ta="'+i+'"]'),v=S.txt[i]||'';ta.value=v;chk(i)})}
function chk(i){var ta=$('[data-ta="'+i+'"]'),el=$('[data-d="'+i+'"]'),v=ta.value;$('[data-cc="'+i+'"]').textContent=v.replace(/\s/g,'').length;[].forEach.call(el.querySelectorAll('[data-u]'),function(s){s.classList.toggle('on',v.indexOf(s.dataset.u)>-1)})}
/* ---------- shell ---------- */
var TABS=[['read','📖 القراءة'],['terms','🔤 المصطلحات'],['prac','✍️ التدريبات'],['disc','💬 نقاش']],tab=S.ui.tab||'read';
function upd(){var pd=Object.keys(S.prac).length,ok=0,k;for(k in S.prac)if(S.prac[k].c)ok++;var dn=D.discuss.filter(function(d,i){return (S.txt[i]||'').replace(/\s/g,'').length>=50}).length,tot=D.practice.length+D.discuss.length;
 $('#pgb').style.width=Math.round((pd+dn)/tot*100)+'%';var a=$('#psc');if(a){a.textContent=pd;$('#pok').textContent=pd?'من أول محاولة: '+ok+' من '+pd:''}}
function show(t){$('#pop').hidden=true;tab=t;S.ui.tab=t;save();[].forEach.call(document.querySelectorAll('.pane'),function(p){p.hidden=p.id!=='p-'+t});$('#tabs').innerHTML=TABS.map(function(x){return '<button class="tab" role="tab" aria-selected="'+(x[0]===t)+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('');window.scrollTo(0,0)}
function init(){
 document.title=D.title_ar+' · '+D.title_zh;$('#ttl').innerHTML='<span class="han" lang="zh" dir="ltr">'+esc(D.title_zh)+'</span><span class="mut" style="display:block;font-size:12px;font-weight:400">'+esc(D.title_ar)+'</span>';
 var tools='<div class="tools"><button class="sw" id="spy" aria-pressed="false">拼音 · البينيين</button><button class="sw" id="sar" aria-pressed="false">الترجمة العربية</button><span class="mut">المصطلحات المسطّرة بنقط: اضغط عليها لمعناها</span></div>';
 $('#main').innerHTML='<div id="p-read" class="pane">'+tools+reading()+'</div><div id="p-terms" class="pane" hidden>'+termsTab()+'</div><div id="p-prac" class="pane" hidden>'+practice()+'</div><div id="p-disc" class="pane" hidden>'+discuss()+'</div>';
 initPractice();initDisc();
 if(S.ui.py)document.body.classList.add('py');if(S.ui.ar)document.body.classList.add('ar');syncSw();show(tab);upd();
}
function syncSw(){$('#spy').setAttribute('aria-pressed',document.body.classList.contains('py'));$('#sar').setAttribute('aria-pressed',document.body.classList.contains('ar'))}
var cur=-1;
function pop(i){var t=TERMS[i];cur=i;var p=$('#pop');p.hidden=false;p.innerHTML='<div class="r"><div class="zz">'+esc(t.zh)+'</div><div><div class="pp" style="font-family:var(--font-py);direction:ltr">'+pyh(t.py)+'</div><div>'+esc(t.ar)+'</div></div><div class="cl" style="display:flex;gap:6px"><button class="sm" data-pop="say" aria-label="استمع">🔊</button><button class="sm'+(inRev(t.zh)?' on':'')+'" data-pop="add" aria-label="مراجعة">'+(inRev(t.zh)?'✓':'+')+'</button><button class="sm" data-pop="x" aria-label="إغلاق">✕</button></div></div>'+(t.ex?'<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">'+ZP(sp(t.ex)[0])+'<span class="mut">'+esc(sp(t.ex)[1])+'</span></div>':'')}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-g],[data-tab],[data-pop],[data-say-sec],[data-say-t],[data-add-t],#addall,#spy,#sar,#prs,[data-fr],[data-say-m]');
 if(!t){if(!e.target.closest('#pop')){$('#pop').hidden=true}return}
 var d=t.dataset;
 if(d.g!=null){speak(TERMS[+d.g].zh);pop(+d.g)}
 else if(d.tab)show(d.tab);
 else if(d.pop){if(d.pop==='x')$('#pop').hidden=true;else if(d.pop==='say')speak(TERMS[cur].zh);else{var on=addRev(TERMS[cur].zh);pop(cur);toast(on?'أُضيف إلى مفردات الثقافة':'أُزيل من المراجعة');refreshTerms()}}
 else if(d.saySec!=null)speak(secText(+d.saySec));
 else if(d.sayT!=null)speak(TERMS[+d.sayT].zh);
 else if(d.addT!=null){var on2=addRev(TERMS[+d.addT].zh);toast(on2?'أُضيف إلى مفردات الثقافة':'أُزيل من المراجعة');refreshTerms()}
 else if(t.id==='addall'){TERMS.forEach(function(x){if(!inRev(x.zh))addRev(x.zh)});toast('أُضيفت كل المصطلحات');refreshTerms()}
 else if(t.id==='spy'||t.id==='sar'){var c=t.id==='spy'?'py':'ar';document.body.classList.toggle(c);S.ui[c]=document.body.classList.contains(c)?1:0;save();syncSw()}
 else if(t.id==='prs'){if(confirm('مسح نتائج التدريبات وإعادتها؟')){S.prac={};save();initPractice();[].forEach.call(document.querySelectorAll('.qs'),function(q){q.textContent='';q.className='qs'});[].forEach.call(document.querySelectorAll('.fb'),function(f){f.hidden=true});upd()}}
 else if(d.fr!=null){var sec=t.closest('[data-d]'),i=+sec.dataset.d,ta=$('textarea',sec),f=D.discuss[i].frames[+d.fr],p=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.value=ta.value.slice(0,p)+f+ta.value.slice(p);ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}
 else if(d.sayM!=null)speak(sp(D.discuss[+d.sayM].model)[0]);
});
function refreshTerms(){var y=window.scrollY;$('#p-terms').innerHTML=termsTab();window.scrollTo(0,y)}
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('g')){e.preventDefault();e.target.click()}});
document.addEventListener('input',function(e){var ta=e.target;if(ta.dataset&&ta.dataset.ta!=null){var i=+ta.dataset.ta;S.txt[i]=ta.value;save();chk(i);upd()}});
$('#th').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')};
init();
})();
</script>
</body></html>
