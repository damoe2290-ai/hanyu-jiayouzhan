<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img,svg{max-width:100%}</style>
<title>第一课 · 中国的哲学家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout concept: a study sheet on cool jade-grey paper. Hanzi are the large ink forms, coloured by tone;
   one red seal (课) is the only loud mark. Single column, sticky tab bar, everything else stays quiet. */
:root{
  --bg:#FBF6EE; --surface:#FFFDF9; --surface2:#F3EBDD; --fg:#2B1D18; --muted:#7B6A5E; --line:#E8DCC8;
  --accent:#B8322A; --accent-fg:#FFFFFF; --accent-soft:#F8E4DF;
  --seal:#B8322A; --seal-fg:#FFFFFF; --star:#C98A0A;
  --good:#2E7D4F; --good-soft:#DDF0E2; --bad:#B3261E; --bad-soft:#F7DBD8;
  --t1:#C0392B; --t2:#A66A00; --t3:#1D7A45; --t4:#2759B8; --t5:#6A7B77;
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-han:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --font-py:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A17; --surface:#152622; --surface2:#1C312C; --fg:#EEF3EF; --muted:#9DB3AB; --line:#2A413B;
    --accent:#E0645B; --accent-fg:#2A0E0B; --accent-soft:#2B3A33;
    --seal:#E0645B; --seal-fg:#2A0E0B; --star:#E8B64A;
    --good:#5CCB8A; --good-soft:#173626; --bad:#F08A82; --bad-soft:#3E1D1A;
    --t1:#F0847A; --t2:#E3B04B; --t3:#5CCB8A; --t4:#7FA8F5; --t5:#93A8A3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A17; --surface:#152622; --surface2:#1C312C; --fg:#EEF3EF; --muted:#9DB3AB; --line:#2A413B;
  --accent:#E0645B; --accent-fg:#2A0E0B; --accent-soft:#2B3A33;
  --seal:#E0645B; --seal-fg:#2A0E0B; --star:#E8B64A;
  --good:#5CCB8A; --good-soft:#173626; --bad:#F08A82; --bad-soft:#3E1D1A;
  --t1:#F0847A; --t2:#E3B04B; --t3:#5CCB8A; --t4:#7FA8F5; --t5:#93A8A3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mut{color:var(--muted);font-size:14px}
h1,h2,h3,p{margin:0}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 4px}
.seal{flex:none;width:40px;height:40px;border-radius:4px;background:var(--seal);color:var(--seal-fg);
  display:grid;place-items:center;font:700 24px/1 var(--font-han);transform:rotate(-4deg);
  outline:2px solid var(--seal);outline-offset:2px}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:20px;font-weight:700;line-height:1.3}
.ttl p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ibtn{appearance:none;flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--surface);display:grid;place-items:center;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;
  padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}

/* shared */
.panel{padding-block:20px 24px}
.sec-h{margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:700;line-height:1.35}
.sec-h p{color:var(--muted);font-size:14px;margin-top:2px}
.sub-h{font-size:17px;font-weight:700;margin:26px 0 10px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;
  font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;min-height:40px;justify-content:center}
.chip.tgl.on{background:var(--accent-soft);border-color:var(--accent)}
.spk{appearance:none;flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center;cursor:pointer}
.spk.sm{width:34px;height:34px}
.spk.big{width:84px;height:84px;background:var(--accent);color:var(--accent-fg)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.han{font-family:var(--font-han);font-weight:500}
.py{font-family:var(--font-py)}
.off{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* flashcard */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;cursor:pointer;display:grid;min-height:310px;position:relative}
.face{grid-area:1/1;padding:48px 18px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;animation:pop .22s ease-out}
.face .spk{position:absolute;top:12px;inset-inline-end:12px}
.bigzh{font:500 clamp(64px,22vw,104px)/1.15 var(--font-han)}
.hint{color:var(--muted);font-size:14px}
.fc .pyl{font:500 30px/1.2 var(--font-py)}
.fc .meaning{font-size:26px;font-weight:700;line-height:1.4}
.fc .note{font-size:14px;color:var(--muted);max-width:30em}
.ex{width:100%;border-top:1px dashed var(--line);padding-top:12px;margin-top:6px;display:grid;gap:2px;text-align:start}
.exzh{font:500 22px/1.4 var(--font-han)}
.expy{font:14px var(--font-py);color:var(--muted)}
.exar{font-size:15px;direction:rtl;text-align:right}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.cnt{font:500 15px var(--font-py);color:var(--muted)}
.actrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row{display:grid;grid-template-columns:5.2em 1fr auto auto;gap:12px;align-items:center;padding:10px 4px;
  border-bottom:1px solid var(--line);cursor:pointer}
.row.cur{background:var(--accent-soft);border-radius:10px}
.rz{font:500 26px/1.2 var(--font-han);text-align:start}
.rpy{font:15px var(--font-py)}
.rar{font-size:15px;color:var(--muted)}
.kn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:transparent}
.kn.on{background:var(--good);border-color:var(--good);color:var(--bg)}

/* dialogue */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.lines{display:grid;gap:10px}
.line{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.line.S{background:var(--accent-soft);border-color:transparent}
.line.playing{outline:2.5px solid var(--accent);outline-offset:1px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.who .spk{margin-inline-start:auto}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--font-han);background:var(--fg);color:var(--bg)}
.S .av{background:var(--accent);color:var(--accent-fg)}
.zhline{display:flex;flex-wrap:wrap;gap:4px 2px;direction:ltr;align-items:flex-end}
.tok{appearance:none;background:none;border:0;border-radius:8px;padding:2px 4px;cursor:pointer;display:inline-flex;
  flex-direction:column;align-items:center;color:inherit;font:inherit}
.tok:hover,.tok:focus-visible{background:var(--surface2)}
.tok .py{font-size:12px;line-height:1.5}
.tok .zh{font:500 26px/1.25 var(--font-han)}
.nopy .tok .py{display:none}
.punc{font:500 26px/1.25 var(--font-han);align-self:flex-end;padding-bottom:0}
.arline{color:var(--muted);font-size:15px}
.noar .arline{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.sheet-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.sh-main{display:grid;gap:0}
.sh-zh{font:500 34px/1.2 var(--font-han)}
.sh-py{font:16px var(--font-py)}
.sh-ar{flex:1;font-size:19px;font-weight:700}
.cq{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px}
.cq b{font-weight:600}
.cq .o{display:flex;gap:8px;flex-wrap:wrap}

/* grammar */
.tones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tn{display:grid;gap:4px;justify-items:center;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tn svg{width:56px;height:56px}
.tn .pyl{font:500 24px var(--font-py)}
.tn .nm{font-size:13px;color:var(--muted)}
.tn .ex1{font:500 20px var(--font-han)}
.formula{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 12px;font-size:15px}
.fm{padding:4px 10px;border-radius:8px;background:var(--surface2);font-weight:600}
.fm.k{background:var(--accent);color:var(--accent-fg);font-family:var(--font-han);font-size:18px}
.sentbox{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-top:10px}
.sentbox .zhline{align-items:flex-end}
.qmark{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 4px}
.qa{display:grid;gap:8px;margin-top:10px}
.qa .m{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.qa .m .t{flex:1;display:grid}
.qa .m .z{font:500 22px/1.35 var(--font-han)}

/* writing */
.cvwrap{width:100%;max-width:340px;margin:0 auto}
#cv{width:100%;aspect-ratio:1;display:block;border-radius:14px;touch-action:none;border:1px solid var(--line);cursor:crosshair}
.winfo{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.winfo .big{font:500 44px/1 var(--font-han)}

/* practice */
.stats{display:grid;gap:12px}
.xprow{display:flex;align-items:center;gap:12px}
.xpbar{flex:1;height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{width:62px;text-align:center;font-size:12px;line-height:1.35;opacity:.38;filter:grayscale(1)}
.badge.on{opacity:1;filter:none}
.badge span{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 4px;border-radius:50%;
  border:2px solid var(--seal);color:var(--seal);font:700 22px var(--font-han);background:var(--surface)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.act{appearance:none;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;
  cursor:pointer;display:grid;gap:4px;align-content:start}
.act strong{font-size:16px}
.act small{color:var(--muted);font-size:13px;line-height:1.5}
.act.feat{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.act.feat small{color:inherit;opacity:.85}
.stars{display:flex;gap:2px;color:var(--line)}
.stars .on{color:var(--star)}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.qbar{flex:1;height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.qprompt{display:grid;gap:8px;justify-items:center;text-align:center;margin-bottom:18px}
.qprompt .ar-s{font-size:20px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:54px;padding:10px 14px;
  font-size:18px;font-weight:600;cursor:pointer;text-align:center}
.opt .pyopt{font:500 22px var(--font-py)}
.opt.good{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.slot,.pool{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;min-height:64px;align-items:center;padding:10px;border-radius:14px}
.slot{border:2px dashed var(--line);margin-bottom:12px;background:var(--surface)}
.slot .ph{direction:rtl;color:var(--muted);font-size:14px;margin:0 auto}
.pool{margin-bottom:16px;justify-content:center}
.chip .zh{font:500 24px/1.2 var(--font-han)}
.chip .py{font-size:11px;color:var(--muted)}
.chip.pick{background:var(--accent-soft);border-color:var(--accent)}
.chip.good{background:var(--good-soft);border-color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad)}
.fillsent{font:500 30px/1.6 var(--font-han);direction:ltr}
.blank{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--accent);text-align:center;margin:0 4px}
.blank.good{border-color:var(--good);color:var(--good)}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mi{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:58px;padding:6px 8px;
  cursor:pointer;display:grid;place-items:center;font-size:16px;font-weight:600;line-height:1.35}
.mi .zh{font:500 24px/1.2 var(--font-han)}
.mi .py{font-size:12px;color:var(--muted)}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.ok{border-color:var(--good);background:var(--good-soft);opacity:.7}
.mi.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:16px 0;padding:14px;border-radius:14px;display:grid;gap:6px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .fw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res{display:grid;gap:14px;justify-items:center;text-align:center;padding:12px 0}
.res .stars svg{width:44px;height:44px}
.res h3{font-size:24px}
.res .sc{font:700 44px var(--font-py)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
@media (min-width:560px){
  .tones{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* lesson 8 additions */
[hidden]{display:none!important}
.tg{display:inline-flex;align-items:flex-end;white-space:nowrap}
.il{width:100%;height:100%;display:block;stroke:var(--fg);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.il .a{fill:var(--accent-soft)}.il .b{fill:var(--surface2)}.il .r{fill:var(--seal)}.il .y{fill:var(--star)}.il .w{fill:var(--surface)}.il .k{fill:var(--fg);stroke:none}
.pic{display:block;width:100%;height:100%}
.pic.pb{width:92px;height:92px;margin-bottom:2px}
.pic.pt{width:44px;height:44px}
.picbig{width:140px;height:140px}
.rp{width:44px;height:44px}
.row{grid-template-columns:44px 5.6em 1fr auto auto}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;margin-inline-start:6px;background:var(--surface2);color:var(--muted)}
.scene{display:flex;gap:8px;justify-content:space-around;flex-wrap:wrap;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin:10px 0 6px}
.scene figure{margin:0;display:grid;justify-items:center;gap:4px;width:84px;text-align:center}
.scene .sci{width:68px;height:68px}
.scene figcaption{font-size:12px;color:var(--muted);line-height:1.35}
.line.N{background:var(--surface);border-style:dashed}
.line.L{background:var(--accent-soft);border-color:transparent}
.line.C{background:var(--surface2);border-color:transparent}
.L .av{background:var(--accent);color:var(--accent-fg)}
.C .av{background:var(--seal);color:var(--seal-fg)}
.N .av{background:var(--muted);color:var(--bg)}
.calcard{display:grid;justify-items:center;border:2px solid var(--fg);border-radius:14px;overflow:hidden;width:150px;background:var(--surface)}
.calcard .cm{background:var(--seal);color:var(--seal-fg);width:100%;padding:2px 0;font-weight:700;text-align:center}
.calcard .cd{font:700 56px/1.15 var(--font-py)}
.calcard .cw{padding-bottom:6px;font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font:700 28px var(--font-py);min-width:2ch;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{display:grid;justify-items:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center}
.tile .py{font-size:15px}
.sdg{width:40px;height:40px;flex:none}
.qa .m .t{min-width:0}

.line.S,.line.A{background:var(--accent-soft);border-color:transparent}
.line.X,.line.Y{background:var(--surface2);border-color:transparent}
.S .av,.A .av{background:var(--accent);color:var(--accent-fg)}
.X .av,.Y .av{background:var(--seal);color:var(--seal-fg)}
.cqo{display:inline-flex;flex-direction:column;align-items:center;line-height:1.3;height:auto;padding-block:6px}
.cqo .py{font-size:12px}
.cq>b{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}

table{border-collapse:collapse;width:100%;min-width:420px;background:var(--surface)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);text-align:start;vertical-align:top}

/* ---------- speech ---------- */
var TTS={ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),voice:null,warned:false};
function pickVoice(){
  if(!TTS.ok)return;
  var vs=speechSynthesis.getVoices();
  TTS.voice=vs.filter(function(v){return /^zh[-_]CN/i.test(v.lang)})[0]||vs.filter(function(v){return /^zh/i.test(v.lang)})[0]||null;
}
if(TTS.ok){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function speak(text,done,pitch){
  if(!TTS.ok){toast('الصوت غير متاح في هذا المتصفح');if(done)done();return false}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';
    if(TTS.voice)u.voice=TTS.voice;
    else if(!TTS.warned&&speechSynthesis.getVoices().length){TTS.warned=true;toast('لا يوجد صوت صيني على جهازك، ثبّت صوتاً صينياً من إعدادات النظام')}
    u.rate=S.slow?0.55:0.85;
    u.pitch=pitch||1;
    u.onend=function(){if(done)done()};
    u.onerror=function(){if(done)done()};
    speechSynthesis.speak(u);
    return true;
  }catch(e){if(done)done();return false}
}
function stopSpeech(){try{if(TTS.ok)speechSynthesis.cancel()}catch(e){}}

/* ---------- pinyin helpers ---------- */
function toneOf(s){var d=s.normalize('NFD');if(/̄/.test(d))return 1;if(/́/.test(d))return 2;if(/̌/.test(d))return 3;if(/̀/.test(d))return 4;return 5}
var MARK={1:'̄',2:'́',3:'̌',4:'̀'};
function setTone(s,n){
  var b=s.normalize('NFD').replace(/[̀́̄̌]/g,'').normalize('NFC');
  if(n===5)return b;
  var low=b.toLowerCase(),idx=-1,i;
  if(/[ae]/.test(low))idx=low.search(/[ae]/);
  else if(low.indexOf('ou')>-1)idx=low.indexOf('o');
  else{for(i=low.length-1;i>=0;i--){if('aeiou'.indexOf(low[i])>-1){idx=i;break}}}
  if(idx<0)return b;
  return (b.slice(0,idx+1)+MARK[n]+b.slice(idx+1)).normalize('NFC');
}
function toneVariants(py){
  var syl=py.split(' '),out=[syl.join(' ')],guard=0;
  while(out.length<4&&guard++<80){
    var i=Math.floor(Math.random()*syl.length),cur=toneOf(syl[i]),n=1+Math.floor(Math.random()*5);
    if(n===cur)continue;
    var c=syl.slice();c[i]=setTone(syl[i],n);var j=c.join(' ');
    if(out.indexOf(j)<0)out.push(j);
  }
  return out;
}
function han(zh,py){
  var sy=py.split(' ');
  return Array.from(zh).map(function(c,i){return '<span class="t'+(sy[i]?toneOf(sy[i]):5)+'">'+esc(c)+'</span>'}).join('');
}
function pyhtml(py){return py.split(' ').map(function(s){return '<span class="t'+toneOf(s)+'">'+esc(s)+'</span>'}).join('')}

function pt(e){var cv=$('#cv'),r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function drawCanvas(){
  var cv=$('#cv');if(!cv)return;
  var ctx=cv.getContext('2d'),cs=getComputedStyle(document.documentElement),w=cv.width,h=cv.height;
  var col=function(n){return cs.getPropertyValue(n).trim()};
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=col('--surface');ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=col('--line');ctx.lineWidth=3;ctx.setLineDash([14,12]);
  ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.moveTo(0,0);ctx.lineTo(w,h);ctx.moveTo(w,0);ctx.lineTo(0,h);ctx.stroke();
  ctx.setLineDash([]);
  if(W.ghost){
    ctx.globalAlpha=0.16;ctx.fillStyle=col('--fg');
    ctx.font='500 '+Math.round(w*0.76)+'px "Noto Serif SC","Songti SC","STSong",serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(CHARS[W.i].c,w/2,h/2+h*0.03);

  }
  ctx.strokeStyle=col('--fg');ctx.lineWidth=18;ctx.lineCap='round';ctx.lineJoin='round';
  W.strokes.forEach(function(s){
    ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);

    for(var i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);

  });
}

R.fill=function(q,b){
  var opts=shuffle(q.f.opts);
  b.innerHTML='<div class="qprompt"><span class="mut">أكمل الجملة</span><div class="ar-s">'+q.f.ar+'</div><div class="fillsent">'+esc(q.f.pre)+'<span class="blank" id="blank">&nbsp;</span>'+esc(q.f.post)+'</div></div>'+
    '<div class="pool">'+opts.map(function(o){return '<button class="chip" data-act="fill" data-o="'+esc(o)+'"><span class="zh">'+o+'</span></button>'}).join('')+'</div>';
};
R.match=function(q,b){
  q.sel=null;q.done={};q.err=0;q.errIds={};
  q.left=shuffle(q.words);q.right=shuffle(q.words);
  b.innerHTML='<div class="qprompt"><span class="mut">اربط كل كلمة صينية بمعناها العربي</span></div><div class="mrow">'+
    '<div class="mcol" dir="ltr">'+q.left.map(function(w){return '<button class="mi" data-act="ml" data-i="'+q.words.indexOf(w)+'"><span class="zh">'+esc(w.zh)+'</span><span class="py">'+(S.py?w.py.replace(/ /g,''):'')+'</span></button>'}).join('')+'</div>'+
    '<div class="mcol">'+q.right.map(function(w){return '<button class="mi" data-act="mr" data-i="'+q.words.indexOf(w)+'">'+w.ar+'</button>'}).join('')+'</div></div>';
};
function finishQ(ok,wids,extra){
  if(Q.fin)return;Q.fin=true;
  if(!ok)(wids||[]).forEach(function(i){(Q.miss=Q.miss||{})[i]=1});
  if(ok){
    Q.score++;S.xp+=10;Q.gain+=10;
    (wids||[]).forEach(function(i){if(S.wrong[i]){S.wrong[i]--;if(S.wrong[i]<=0)delete S.wrong[i]}});
  }else{(wids||[]).forEach(function(i){S.wrong[i]=(S.wrong[i]||0)+1})}
  save();
  if(window.zhUI&&zhUI.play)zhUI.play(ok?'ok':'no');
  $('#qfb').innerHTML='<div class="fb '+(ok?'good':'bad')+'"><strong>'+(ok?OKM[Math.floor(Math.random()*OKM.length)]:'ليست الإجابة الصحيحة')+'</strong>'+(extra||'')+'</div>';
  var nb=$('#qnext');nb.textContent=(Q.i===Q.list.length-1)?'عرض النتيجة':'التالي';nb.hidden=false;
  try{nb.scrollIntoView({block:'nearest'})}catch(e){}
}
function endQuiz(){
  var n=Q.list.length,pct=Math.round(Q.score/n*100),st=pct>=90?3:(pct>=60?2:1),kind=Q.kind;
  var before=Math.floor((S.xp-Q.gain)/100)+1,after=Math.floor(S.xp/100)+1;
  if(kind!=='review')S.best[kind]=Math.max(S.best[kind]||0,st);
  award('first');
  if(pct===100)award('perfect');
  if(kind==='all'&&pct>=80)award('master');
  save();updateProg();
  var msg=pct>=90?'ممتاز! أتقنتَ هذا الجزء':(pct>=60?'جيد، راجع الأخطاء وأعد المحاولة':'تحتاج إلى مراجعة، ارجع إلى البطاقات والحوار');
  var starsHtml='<div class="stars">'+[1,2,3].map(function(i){return '<span class="'+(i<=st?'on':'')+'">'+ic('star',44)+'</span>'}).join('')+'</div>';
  var missed=Object.keys(Q.miss||{}).map(Number).filter(function(i){return VOCAB[i]}),nbs=NEWB.splice(0);LASTMISS=missed;
  if(window.zhUI&&zhUI.play&&!nbs.length&&st>=2)zhUI.play('done');   /* a new badge plays its own flourish (zhUI.stamp) */
  if(window.zhUI&&zhUI.summary){
    var nx=document.querySelector('.zh-lnav .zh-next'),nxb=nx&&nx.querySelector('b');
    $('#p-practice').innerHTML=zhUI.summary({starsHtml:starsHtml,msg:msg,score:Q.score,n:n,pct:pct,gain:Q.gain,level:after>before?after:0,
      newBadges:nbs.map(function(k){return BADGES[k]}),missedHtml:missed.map(function(i){return fbWord(VOCAB[i])}).join(''),badgesHtml:zhUI.badges(badgeList(nbs)),retryKind:kind,
      next:nx?{href:nx.getAttribute('href'),label:(nxb?nxb.textContent:'الدرس التالي')}:null});
  }else{
    $('#p-practice').innerHTML='<div class="res"><div class="stars">'+[1,2,3].map(function(i){return '<span class="'+(i<=st?'on':'')+'">'+ic('star',44)+'</span>'}).join('')+'</div>'+
      '<h3>'+msg+'</h3><div class="sc">'+Q.score+' / '+n+'</div><p class="mut">كسبتَ '+Q.gain+' نقطة'+(after>before?' · وصلتَ إلى المستوى '+after:'')+'</p>'+
      '<div class="tools" style="justify-content:center"><button class="btn primary" data-act="start" data-k="'+kind+'">'+ic('redo',18)+' أعد المحاولة</button><button class="btn ghost" data-act="qexit">كل التمارين</button></div></div>';
}
  Q=null;
  if(after>before)toast('مستوى جديد: '+after);
}

/* ---------- events ---------- */
var A={};
A.tab=function(t){setTab(t.dataset.tab)};
A.slow=function(){S.slow=!S.slow;save();syncSlow();toast(S.slow?'صوت بطيء: مفعّل':'صوت بطيء: متوقف')};
A.theme=function(){
  var d=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  var n=d==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem(KEY+'-theme',n)}catch(e){}
  if(tab==='writing')drawCanvas();
};
A.say=function(t){speak(t.dataset.t)};
A.sayline=function(t){var L=DLG[+t.dataset.l];if(speak(L.zh,null,pitchOf(L.who))){S.heard[+t.dataset.l]=1;save();updateProg();checkListener();var s=$('#p-dialogue .sec-h p');if(s)s.textContent='اضغط أي كلمة لترى معناها، واضغط السماعة لتسمع الجملة. سمعتَ '+Object.keys(S.heard).length+' من '+DLG.length+' جمل.'}};
A.tok=function(t){openSheet(DLG[+t.dataset.l].tok[+t.dataset.k])};
A.closesheet=closeSheet;
A.playall=playAll;
A.topic=function(t){TOP=+t.dataset.i;S.seenT=S.seenT||{};S.seenT[TOP]=1;if(Object.keys(S.seenT).length>=D.nt)award('listener');save();updateProg();renderTopics();window.scrollTo(0,0)};
A.tback=function(){TOP=-1;renderTopics();window.scrollTo(0,0)};
A.arall=function(t){S.arx=!S.arx;save();applyAr()};
function applyAr(){$('#app').classList.toggle('noar',!!S.arx);var b=$('#arbtn');if(b)b.setAttribute('aria-pressed',String(!S.arx))}
A.tpy=function(){S.py=!S.py;save();renderVocab()};
A.tar=function(){S.ar=!S.ar;save();renderVocab()};
A.tpy2=function(){S.py=!S.py;save();renderDialogue()};
A.tar2=function(){S.ar=!S.ar;save();renderDialogue()};
A.flip=function(){
  S.flip=!S.flip;
  var fc=$('#fc'),f=$('#fc .front'),b=$('#fc .back');if(!f||!b)return;
  if(fc.classList.contains('f3d')){f.hidden=false;b.hidden=false;fc.classList.add('turning');fc.classList.toggle('flipped',S.flip);clearTimeout(flipT);flipT=setTimeout(function(){f.hidden=S.flip;b.hidden=!S.flip;fc.classList.remove('turning')},700)}
  else{f.hidden=S.flip;b.hidden=!S.flip}
  if(window.zhUI&&zhUI.play)zhUI.play('swish');
};
A.fcsound=function(t){if(!window.zhUI||!zhUI.setSound)return;zhUI.setSound(!zhUI.soundOn());var on=zhUI.soundOn();t.setAttribute('aria-pressed',String(on));t.innerHTML=ic(on?'snd':'mute',20);if(on)zhUI.play('swish')};
A.next=function(){S.card=(S.card+1)%VOCAB.length;S.flip=false;save();renderVocab();var sk=CSND;CSND='swish';if(window.zhUI&&zhUI.play)zhUI.play(sk)};
A.prev=function(){S.card=(S.card-1+VOCAB.length)%VOCAB.length;S.flip=false;save();renderVocab();if(window.zhUI&&zhUI.swish)zhUI.swish()};
function hubRev(zh,on){try{var h=JSON.parse(localStorage.getItem(HUBK)||'{}')||{};h.dues=h.dues||{};h.dues[CRS]=h.dues[CRS]||{};if(on){if(!h.dues[CRS][zh])h.dues[CRS][zh]={i:0,t:Date.now()}}localStorage.setItem(HUBK,JSON.stringify(h))}catch(e){}}
var CSND='swish';
A.know=function(){CSND='ok';S.known[S.card]=true;if(S.wrong[S.card])delete S.wrong[S.card];if(knownCount()===VOCAB.length)award('scholar');save();updateProg();A.next()};
A.addmiss=function(t){LASTMISS.forEach(function(i){hubRev(VOCAB[i].zh,true)});toast('أُضيفت '+LASTMISS.length+' كلمة إلى مراجعة المفردات في الصفحة الرئيسية');if(t){t.disabled=true}};
A.again=function(){hubRev(VOCAB[S.card].zh,true);toast('أُضيفت إلى مراجعة المفردات في الصفحة الرئيسية');delete S.known[S.card];S.wrong[S.card]=(S.wrong[S.card]||0)+1;save();updateProg();A.next()};
A.jump=function(t){S.card=+t.dataset.i;S.flip=false;save();renderVocab();window.scrollTo({top:0,behavior:'smooth'})};
A.cq=function(t){
  var q=+t.dataset.q,i=+t.dataset.i,o=+t.dataset.o,c=CQ[q][i];
  $$('#cq'+q+'_'+i+' .chip').forEach(function(b,j){b.disabled=true;if(j===c.a)b.classList.add('good');else if(j===o)b.classList.add('bad')});
  if(o===c.a){speak(c.o[c.a].zh)}
};
A.s=function(t){G.s=+t.dataset.i;renderGrammar()};
A.adv=function(t){G.a=+t.dataset.i;renderGrammar()};
A.pred=function(t){G.p=+t.dataset.i;renderGrammar()};
A.num=function(t){G.num=+t.dataset.i;renderGrammar()};
A.rmb=function(t){G.rmb=+t.dataset.i;renderGrammar()};
A.it=function(t){G.it=+t.dataset.i;renderGrammar()};
A.pat=function(t){G.pat=+t.dataset.i;renderGrammar()};
A.mw=function(t){G.mw=+t.dataset.i;renderGrammar()};

A.gtok=function(t){openSheet([t.dataset.z,t.dataset.p,t.dataset.a||''])};
A.wfr=function(t){var i=+t.dataset.d,ta=$('[data-wta="'+i+'"]'),f=D.disc[i].frames[+t.dataset.k],p=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.value=ta.value.slice(0,p)+f+ta.value.slice(p);S.txt[i]=ta.value;ta.focus();wchk(i)};
A.wsay=function(t){speak(D.disc[+t.dataset.d].model.split('｜')[0])};
A.wch=function(t){W.i=+t.dataset.i;W.strokes=[];W.cur=null;renderWriting()};
A.wclear=function(){W.strokes=[];W.cur=null;drawCanvas()};
A.wundo=function(){if(!W.strokes.length)return;W.strokes.pop();W.cur=null;drawCanvas()};
A.wghost=function(){W.ghost=!W.ghost;renderWriting()};
A.start=function(t){startQuiz(t.dataset.k)};
A.qexit=function(){Q=null;stopSpeech();renderPractice()};
A.qnext=function(){Q.i++;if(Q.i>=Q.list.length)endQuiz();else{$('#qbody').innerHTML='';renderQ()}};
A.opt=function(t){
  if(!Q||Q.fin)return;
  var q=Q.list[Q.i],i=+t.dataset.i,ok=q.opts[i].ok;
  $$('#qbody .opt').forEach(function(el,j){el.disabled=true;if(q.opts[j].ok)el.classList.add('good');else if(j===i)el.classList.add('bad')});
  finishQ(ok,q.wid,q.fb);
};
A.pick=function(t){
  var q=Q.list[Q.i];if(q.done)return;
  var p=q.pool.filter(function(x){return x.i===+t.dataset.i})[0];q.picked.push(p);drawOrder(q,$('#qbody'));
};
A.unpick=function(t){
  var q=Q.list[Q.i];if(q.done)return;
  q.picked=q.picked.filter(function(x){return x.i!==+t.dataset.i});drawOrder(q,$('#qbody'));
};
A.unpicklast=function(){var q=Q.list[Q.i];if(q.done||!q.picked.length)return;q.picked.pop();drawOrder(q,$('#qbody'))};
A.unpickall=function(){var q=Q.list[Q.i];if(q.done)return;q.picked=[];drawOrder(q,$('#qbody'))};
A.checkorder=function(){
  var q=Q.list[Q.i];if(q.done)return;q.done=true;
  var ok=q.picked.every(function(p,k){return p.i===k});
  $$('#qbody .slot .chip').forEach(function(c){c.disabled=true;c.classList.add(ok?'good':'bad')});
  $$('#qbody [data-act="checkorder"]').forEach(function(c){c.disabled=true});
  finishQ(ok,q.wid,fbSent(q.s));
  if(ok)speak(q.s.zh);
};
A.fill=function(t){
  var q=Q.list[Q.i];if(Q.fin)return;
  var o=t.dataset.o,ok=o===q.f.ans,bl=$('#blank');
  bl.textContent=o;bl.classList.add(ok?'good':'bad');
  $$('#qbody .pool .chip').forEach(function(c){c.disabled=true;if(c.dataset.o===q.f.ans)c.classList.add('good');else if(c===t)c.classList.add('bad')});
  finishQ(ok,q.wid,fbSent({zh:q.f.pre+q.f.ans+q.f.post,py:q.f.py,ar:q.f.ar}));
  if(ok)speak(q.f.pre+q.f.ans+q.f.post);
};
A.ml=function(t){
  var q=Q.list[Q.i];if(Q.fin)return;
  if(q.done[t.dataset.i])return;
  $$('#qbody [data-act="ml"]').forEach(function(b){b.classList.remove('sel')});
  t.classList.add('sel');q.sel=t.dataset.i;
};
A.mr=function(t){
  var q=Q.list[Q.i];if(Q.fin||q.sel===null||q.done[t.dataset.i])return;
  var i=t.dataset.i,L=$('#qbody [data-act="ml"][data-i="'+q.sel+'"]');
  if(i===q.sel){
    q.done[i]=1;t.classList.add('ok');L.classList.remove('sel');L.classList.add('ok');t.disabled=true;L.disabled=true;
    speak(q.words[+i].zh);
    if(Object.keys(q.done).length===q.words.length){
      var errIds=Object.keys(q.errIds).map(Number);
      errIds.forEach(function(k){var vi=VOCAB.indexOf(q.words[k]);if(vi>=0){S.wrong[vi]=(S.wrong[vi]||0)+1;(Q.miss=Q.miss||{})[vi]=1}});
      finishQ(q.err<=1,[],'<div>عدد الأخطاء: '+q.err+'</div>');
    }
  }else{
    q.err++;q.errIds[q.sel]=1;
    t.classList.add('no');L.classList.add('no');
    setTimeout(function(){t.classList.remove('no');L.classList.remove('no')},450);
  }
  q.sel=null;$$('#qbody [data-act="ml"]').forEach(function(b){b.classList.remove('sel')});
};

var app=$('#app');
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!e.target.closest('#sheet')&&!e.target.closest('.tok')&&!$('#sheet').hidden)closeSheet();
  if(!t||!app.contains(t))return;
  var f=A[t.dataset.act];if(f)f(t,e);
});
app.addEventListener('input',function(e){var ta=e.target;if(ta.dataset&&ta.dataset.wta!=null){var i=+ta.dataset.wta;S.txt[i]=ta.value;wchk(i)}});
app.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.id==='fc'){e.preventDefault();A.flip()}
});
window.addEventListener('hashchange',function(){var h=location.hash.replace('#','');if(h&&h!==tab)setTab(h,true)});
document.addEventListener('DOMContentLoaded',function(){
  if(!window.zhUI||!zhUI.swipe)return;
  /* 3D: the card follows the finger and turns like a page (zhUI.cardDrag); no 3D / reduced motion: a plain swipe changes the card */
  if(zhUI.cardDrag)zhUI.cardDrag($('#app'),{sel:'#fc',enabled:function(){var c=$('#fc');return !!c&&c.classList.contains('f3d')},
    under:function(d){var i=(S.card+(d==='next'?1:VOCAB.length-1))%VOCAB.length;return '<div class="face front">'+frontInner(VOCAB[i])+'</div>'},
    commit:function(d){if(d==='next')A.next();else A.prev()}});
  zhUI.swipe($('#app'),'#fc',function(d){var c=$('#fc');if(c&&c.classList.contains('f3d'))return;if(d==='left')A.next();else A.prev()});
  if(tab==='vocab')RENDER[tab]();
});
function syncSlow(){$('#slowbtn').setAttribute('aria-pressed',String(S.slow))}
syncSlow();updateProg();
applyAr();setTab(location.hash.replace('#','')||'topics',true);
})();
</script>
</body></html>
