<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}img,svg{max-width:100%}</style>
<title>汉语加油站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{--bg:#FBF6EE;--surface:#FFFDF9;--surface2:#F3EBDD;--fg:#2B1D18;--muted:#7B6A5E;--line:#E8DCC8;--accent:#B8322A;--accent-fg:#fff;--accent-soft:#F8E4DF;--seal:#B8322A;--seal-fg:#fff;--gold:#C98A0A;--good:#2E7D4F;--good-soft:#DDF0E2;--bad:#B3261E;--bad-soft:#F7DBD8;--c1:#7A4FA3;--c2:#E0952B;--c3:#2F6DB5;--c4:#2E8B57;--c5:#C2410C;--c6:#7C3AED;--t1:#C0392B;--t2:#A66A00;--t3:#1D7A45;--t4:#2759B8;--t5:#6A7B77;
--font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--font-han:'Noto Serif SC','Songti SC',serif;--font-py:'IBM Plex Sans','Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--c5:#F08A5D;--c6:#A78BFA;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A17;--surface:#152622;--surface2:#1C312C;--fg:#EEF3EF;--muted:#9DB3AB;--line:#2A413B;--accent:#E0645B;--accent-fg:#2A0E0B;--accent-soft:#2B3A33;--seal:#E0645B;--seal-fg:#2A0E0B;--gold:#E8B64A;--good:#5CCB8A;--good-soft:#173626;--bad:#F08A82;--bad-soft:#3E1D1A;--c1:#A98BD0;--c2:#EBB058;--c3:#7FA8F5;--c4:#5CCB8A;--c5:#F08A5D;--c6:#A78BFA;--t1:#F0847A;--t2:#E3B04B;--t3:#5CCB8A;--t4:#7FA8F5;--t5:#93A8A3;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--font-ui);padding:0 max(16px,env(safe-area-inset-left)) 64px}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}.narrow{max-width:720px;margin:0 auto}h1,h2,h3,p{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}.mut{color:var(--muted);font-size:14px}
.hdr{position:sticky;top:0;z-index:9;background:var(--bg);padding-block:12px 0}
.top{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border-radius:4px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 24px/1 var(--font-han);transform:rotate(-4deg)}
.top h1{flex:1;font-size:20px}
.ib{font-size:22px;line-height:1;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:6px;margin-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;max-width:200px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}.tab .tag{background:var(--gold);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.hero{background:var(--accent-soft);border-color:transparent}
.hero h2{font-size:22px;margin-bottom:4px}
.grid{display:grid;gap:12px;margin-top:12px}
.course{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.course .n{width:48px;height:48px;border-radius:10px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 26px var(--font-han)}
.course{width:100%;font:inherit;color:inherit;cursor:pointer;text-align:start}.course.soon{opacity:.6;cursor:default}.course.soon .n{background:var(--surface2);color:var(--muted)}
.course b{display:block}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.han{font-family:var(--font-han)}.py{font-family:var(--font-py)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
input[type=search]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.w{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.w .z{font-size:30px;line-height:1.2;min-width:2.2em;text-align:center}
.w .ex{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.sm{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.sm.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tag{font-size:11px;background:var(--surface2);color:var(--muted);border-radius:999px;padding:0 8px;margin-inline-start:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;font-family:var(--font-py)}
.fc{min-height:220px;display:grid;place-items:center;text-align:center;gap:6px;cursor:pointer}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.r0{border-color:var(--bad)!important;color:var(--bad)}.r3{border-color:var(--good)!important;color:var(--good)}
.url{direction:ltr;text-align:left;font:13px var(--font-py);background:var(--surface2);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all;margin-top:6px}
.road li{margin:6px 0}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.banner{position:relative;overflow:hidden;border-radius:20px;margin-top:12px;padding:18px 16px 24px;text-align:center;background:linear-gradient(180deg,#F8E4DF 0%,#FBF1E2 70%,var(--bg) 100%)}
:root[data-theme=dark] .banner{background:linear-gradient(180deg,#1E332D,#152622 80%,var(--bg))}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .banner{background:linear-gradient(180deg,#1E332D,#152622 80%,var(--bg))}}
.banner h2{font-size:clamp(22px,4.5vw,32px);position:relative}.banner p{position:relative;color:var(--muted)}
.banner h2,.banner p{padding-inline:44px}/* keep clear of the vertical 加油！ slogan */
.banner svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.banner .jy{position:absolute;inset-block-start:16px;inset-inline-end:16px;writing-mode:vertical-rl;font:700 22px var(--font-han);color:var(--accent);opacity:.8}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:-52px;position:relative}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(80,40,20,.08);display:grid;gap:10px}
.cc .r1{display:flex;gap:12px;align-items:center}
.cover{flex:none;width:62px;height:84px;border-radius:6px 10px 10px 6px;color:#fff;display:grid;place-items:center;text-align:center;font:700 15px/1.2 var(--font-han);box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.18)}
.cc b{display:block;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.cc.soon{opacity:.6}.cc.soon .r1{align-items:center}@media(max-width:600px){.cc.soon{grid-template-columns:1fr auto;align-items:center}.cc.soon .btn{min-height:40px;padding:0 12px}.cc.soon .cover{width:48px;height:64px;font-size:12px}}
.main2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:880px){.main2{grid-template-columns:1fr 320px}}
.tl{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:620px){.tl{grid-template-columns:240px 1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:2px 12px;font-weight:700}
.scene{border-radius:14px;min-height:170px;background:linear-gradient(180deg,#F8E4DF,#FBF1E2);overflow:hidden}
:root[data-theme=dark] .scene{background:linear-gradient(180deg,#1E332D,#152622)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .scene{background:linear-gradient(180deg,#1E332D,#152622)}}
.scene svg{width:100%;height:100%;display:block}
.side .row2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.side .row2:last-child{border:0}
.side .row2 b{margin-inline-start:auto;font-family:var(--font-py);font-size:18px}
.qt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.qt button{display:grid;justify-items:center;gap:2px;padding:10px 4px;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:600}
.qt button:disabled{opacity:.5;cursor:default}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.feat div{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600}
.feat .ic{color:var(--accent);width:26px;height:26px}
.toast{position:fixed;inset:auto 16px 20px;margin:auto;max-width:360px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:20}

/* Phase 5: dashboard, levels, courses, lesson state badges (no locking: every level and lesson is open) */
.sec{font-size:18px;margin-top:20px}
.dash{display:grid;gap:12px;margin-top:12px}
@media(min-width:760px){.dash{grid-template-columns:1.2fr 1fr}}
.dash .card{margin:0}
.cont{display:grid;gap:8px;align-content:start;border-color:var(--accent)}
.cont .ct{font-size:19px;line-height:1.4;justify-self:start}
.cont .go{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:4px}
.dg{display:grid;gap:12px}
.dgi{display:flex;align-items:center;gap:12px}.dgi>div{display:grid}.dgi>.ic{width:34px;height:34px;color:var(--accent)}
.ring{width:64px;height:64px;flex:none}.ring circle{fill:none;stroke-width:8}.ring .rbg{stroke:var(--surface2)}.ring .rfg{stroke:var(--accent);stroke-linecap:round}.ring .rtx{font:700 22px var(--font-py);fill:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;direction:rtl}
.cd{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface2)}.cd.on{background:var(--good)}.cd.td{outline:2px solid var(--accent);outline-offset:1px}
.dg2{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.dg2 span{display:flex;align-items:center;gap:8px}.dg2 b{font-family:var(--font-py)}
.lvls{display:grid;gap:12px;margin-top:12px}
details.lvl{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:12px}.lvls details.lvl{margin-top:0}
details.lvl>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px}
details.lvl>summary::-webkit-details-marker{display:none}
details.lvl>summary::after{content:'';width:10px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-inline-start:4px;transition:transform .15s}
details.lvl[open]>summary::after{transform:rotate(-135deg)}
.lvn{flex:none;width:44px;height:44px;border-radius:8px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 22px var(--font-py);transform:rotate(-3deg)}
.lvt{flex:1;display:grid}.lvt b{font-size:17px}.pc{font:700 15px var(--font-py);color:var(--accent)}
.lvb{display:grid;gap:12px;padding:0 12px 14px}
@media(min-width:900px){.lvb{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}}
.cb{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cb.open{border-color:var(--accent)}
.cbh{display:flex;gap:12px;align-items:center;width:100%;min-height:72px;padding:10px 12px;background:none;border:0;text-align:start;cursor:pointer}
.cbh .cover{flex:none;width:38px;height:52px;font-size:11px;border-radius:4px 7px 7px 4px;box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.cbh .ci{display:grid;gap:3px;flex:1;min-width:0}.cbh .ci b{font-size:16px;line-height:1.35}
.cbh .bk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:12px}
.cbh .bar{display:block;height:6px}
.chev{flex:none;width:10px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
.cb.open .chev{transform:rotate(-135deg)}
.cbody{display:grid;gap:8px;padding:0 10px 12px}
.lrows{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-height:52px}
.lrow .n{width:34px;height:34px;border-radius:7px;background:var(--seal);color:var(--seal-fg);display:grid;place-items:center;font:700 19px var(--font-han)}
.lrow .lt{display:grid;min-width:0;justify-items:start}
.lrow .lt b{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;line-height:1.4}
.lrow .lt .sub{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.st .ic{width:14px;height:14px}.st.prog{background:var(--accent-soft);color:var(--accent)}.st.done{background:var(--good-soft);color:var(--good)}
.course .st{margin-top:4px}
details.tools>summary{cursor:pointer;min-height:44px;display:flex;align-items:center}

/* Phase 3a: review games */
.gh{font-size:17px;margin-top:16px}.gh2{font-size:16px;margin-top:16px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
@media(min-width:700px){.games{grid-template-columns:repeat(4,1fr)}}
.gcard{display:grid;justify-items:start;align-content:start;gap:2px;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:start}
.gcard .ic{color:var(--accent);width:24px;height:24px}.gcard b{font-size:15px}.gcard .mut{font-size:12px;line-height:1.4}
.gnote{margin-top:8px}
.gm{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:0 max(16px,env(safe-area-inset-left)) 28px;animation:gfade .15s ease-out}
@keyframes gfade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.gm{animation:none}}
.gm-in{max-width:560px;margin:0 auto}
.ghd{position:sticky;top:0;z-index:1;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}
.ghd .btn{display:inline-flex;align-items:center;gap:6px}.ghd .btn .ic{transform:scaleX(-1)}
.gst{display:flex;align-items:center;gap:14px;font-weight:600}.gst span{display:inline-flex;align-items:center;gap:4px}.gst b{font-family:var(--font-py);font-size:18px}.gst .ic{width:18px;height:18px;color:var(--accent)}
.gq{display:grid;gap:10px;text-align:center}
.ghan{font-size:68px;line-height:1.3;margin-top:12px}.gc{margin-top:0}
.gopts{display:grid;gap:10px;margin-top:6px}
.gopt{min-height:58px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:18px;padding:8px 14px;text-align:center}
.gopt.ok{background:var(--good-soft);border-color:var(--good)}.gopt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.gpy{font-size:30px;margin-top:8px}.gar{font-size:24px;line-height:1.5;margin-top:8px}
.gin{width:100%;min-height:62px;font:500 30px var(--font-han);text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);margin-top:12px;padding:0 12px}
.gin:focus{border-color:var(--accent);outline:none}
.gbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}.gbtns .btn{min-width:130px}
.gfb{padding:10px 12px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.gfb.ok{background:var(--good-soft);color:var(--good)}.gfb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--fg);display:grid;gap:2px}.gfb.hint{background:var(--surface2)}
.gans{font-size:30px}
.gend h3{font-size:22px}.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gmiss{display:grid;gap:8px;text-align:start}
.gm1{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:56px}
.gm1 .gz{font-size:28px;line-height:1.2}.gm1 .gt{display:grid;min-width:0}.gm1 .btn{min-height:44px;font-size:13px;padding:0 10px}

/* Phase 3b: real games */
.games.ex{grid-template-columns:repeat(3,1fr)}
.games.ex .gcard{min-height:84px}.games.ex .gcard .mut{font-size:11px}
@media(max-width:420px){.games.ex .gcard b{font-size:13px}}
.gcard.off{opacity:.65;cursor:default}.gcard.off .mut{color:var(--bad)}
.gsub{display:flex;gap:8px;justify-content:center;margin:4px 0 8px}.gsub .btn{min-width:130px}
.gplay{justify-self:center;min-width:160px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.gz2{font-size:30px;line-height:1.2}.gz3{font-size:20px;line-height:1.3}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.mcard{min-height:86px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:4px;font:700 28px var(--font-han);line-height:1.2;color:var(--accent);animation:gfade .15s}
.mcard.open{background:var(--surface);color:var(--fg);border-color:var(--accent)}.mcard.done{background:var(--good-soft);border-color:var(--good);color:var(--fg)}
.mcard .mar{font:600 13px/1.35 var(--font-ui);word-break:break-word}
.gstars{display:flex;gap:6px;justify-content:center}.gstars .ic{width:38px;height:38px}.gstars .on .ic{color:var(--gold);fill:var(--gold)}.gstars .off .ic{color:var(--line)}
.hearts{display:inline-flex;gap:3px}.hearts .ic{width:22px;height:22px}.hearts .on{color:var(--bad)}.hearts .on .ic{fill:var(--bad)}.hearts .off{color:var(--line)}
.fall{position:relative;height:min(42vh,290px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
