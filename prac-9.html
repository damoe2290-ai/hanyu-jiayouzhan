<script>

var D={"n":9,"course":"prac","cname":"القراءة ١","big":"生日","title_zh":"他今年二十岁","title_ar":"الدرس ٩ · عمره هذا العام عشرون عاماً","intro_ar":"كيف يحتفل الصينيون بأعياد الميلاد؟ تتعلّم السؤال عن العمر ومكان الميلاد، وأيام الأسبوع والأشهر والتواريخ والسنوات، وتتعرّف على الأبراج الصينية الاثني عشر.","defpy":1,"minc":12,"tword":"كلمة","tabs":[["read","📖 الدرس"],["terms","🔤 الكلمات"],["prac","✍️ التدريبات"],["disc","💬 تحدّث"]],"sections":[{"h":"一、课文（一）","ar":"النص ١: موعد لحفلة عيد ميلاد","b":[{"dlg":[["王小云｜وانغ شياويون","林娜，你怎么样？忙不忙？｜لين نا، كيف حالك؟ هل أنتِ مشغولة؟"],["林娜｜لين نا","我今天很忙。｜أنا مشغولة جداً اليوم."],["王小云｜وانغ شياويون","明天上午你有没有课？｜هل لديكِ حصة غداً صباحاً؟"],["林娜｜لين نا","明天是星期几？｜غداً أي يوم من الأسبوع؟"],["王小云｜وانغ شياويون","明天是星期四。｜غداً الخميس."],["林娜｜لين نا","我上午、下午都有课。｜عندي حصص صباحاً ومساءً."],["王小云｜وانغ شياويون","你星期日有时间吗？｜هل لديكِ وقت يوم الأحد؟"],["林娜｜لين نا","星期日是几号？｜الأحد هو أي يوم من الشهر؟"],["王小云｜وانغ شياويون","星期日是十月二十七号，是宋华的生日。｜الأحد هو ٢٧ أكتوبر، وهو عيد ميلاد سونغ هوا."],["林娜｜لين نا","是吗？他今年多大？｜حقاً؟ كم عمره هذا العام؟"],["王小云｜وانغ شياويون","宋华一九八二年十月二十七日出生，属狗。他今年二十岁。｜وُلد سونغ هوا في ٢٧ أكتوبر ١٩٨٢، من برج الكلب. عمره هذا العام عشرون سنة."],["林娜｜لين نا","他是哪儿人？｜من أين هو؟"],["王小云｜وانغ شياويون","他是北京人。他爸爸、妈妈都在北京。星期日下午我们有一个聚会，祝贺他的生日。力波、大为都去，你参加不参加？｜هو من بكين، وأبوه وأمه في بكين. بعد ظهر الأحد سنقيم حفلة لتهنئته بعيد ميلاده. ليبو وداوي سيذهبان، هل ستشاركين؟"],["林娜｜لين نا","太好了！我当然参加。中国人生日吃蛋糕吗？｜رائع! بالطبع سأشارك. هل يأكل الصينيون كعكة في عيد الميلاد؟"],["王小云｜وانغ شياويون","吃蛋糕。｜يأكلون كعكة."],["林娜｜لين نا","我买一个大蛋糕，好吗？｜سأشتري كعكة كبيرة، حسناً؟"],["王小云｜وانغ شياويون","好啊。我买两瓶红葡萄酒。｜حسناً. وأنا سأشتري زجاجتي نبيذ أحمر."]]}]},{"h":"一、课文（二）","ar":"النص ٢: حفلة عيد الميلاد","b":[{"dlg":[["林娜｜لين نا","宋华，这是生日蛋糕。祝你生日快乐！｜سونغ هوا، هذه كعكة عيد الميلاد. عيد ميلاد سعيد!"],["宋华｜سونغ هوا","谢谢。蛋糕真漂亮。你们来，我很高兴。｜شكراً. الكعكة جميلة حقاً. يسعدني حضوركم."],["马大为｜ما داوي","今天我们吃北京烤鸭。我很喜欢吃烤鸭。｜اليوم سنأكل بط بكين المشوي. أحب أكل البط المشوي كثيراً."],["丁力波｜دينغ ليبو","我们喝什么酒？｜ماذا سنشرب من الخمر؟（بالنسبة للطلاب: يمكن استبداله بعصير）"],["王小云｜وانغ شياويون","当然喝红葡萄酒，我们还吃寿面。｜بالطبع نبيذ أحمر، وسنأكل أيضاً «نودلز طول العمر»."],["林娜｜لين نا","吃寿面？真有意思。｜نودلز طول العمر؟ هذا ممتع حقاً."],["宋华｜سونغ هوا","林娜，你的生日是哪天？｜لين نا، متى عيد ميلادك؟"],["林娜｜لين نا","十一月十二号。｜١٢ نوفمبر."],["宋华｜سونغ هوا","好，十一月十二号我们再来吃寿面。｜حسناً، في ١٢ نوفمبر سنعود لنأكل نودلز طول العمر."]]}]},{"h":"二、注释","ar":"الملاحظات","b":[{"p":"① 你怎么样？｜تحية بين المعارف والأصدقاء، تشبه «你好吗？»."},{"p":"② 是吗？｜هنا لا تسأل بل تعبّر عن دهشة خفيفة من خبر لا يعرفه المتكلم، مثل: A: 丁力波的哥哥和弟弟都在北京。 B: 是吗？"},{"p":"③ 他今年多大？｜«多 + صفة» للسؤال عن الدرجة، و«大» هنا تعني العمر. «你今年多大؟» تُقال لشخص بالغ أو من جيلك؛ ولطفل نقول «你今年几岁؟»؛ ولكبير السن صيغة أكثر احتراماً (تُدرس في الدرس ١١)."},{"p":"④ 宋华一九八二年十月二十七日出生，属狗。｜من عادة الصينيين تحديد سنة الميلاد بحسب اثني عشر حيواناً بالترتيب: 鼠 الفأر، 牛 الثور، 虎 النمر، 兔 الأرنب، 龙 التنين، 蛇 الثعبان، 马 الحصان، 羊 الخروف، 猴 القرد، 鸡 الديك، 狗 الكلب، 猪 الخنزير. دورة كل ١٢ سنة؛ فسنوات ١٩٨٢ و١٩٩٤ و٢٠٠٦ كلها سنة الكلب (属狗)."},{"p":"⑤ 他是哪儿人？｜عبارة لسؤال مكان الميلاد، ويمكن قول «他哪儿人？». وفي الجواب نذكر عادةً المحافظة أو المدينة. وللسؤال عن الجنسية نقول «哪国人؟»."},{"p":"⑥ 祝你生日快乐！｜عبارة التهنئة بعيد الميلاد. «祝你……» فيها معنى التمنّي مقدّماً، أما «祝贺你……» فتُقال لأمر حدث أو عُلم به."},{"p":"⑦ 我很喜欢吃烤鸭。｜يمكن أن يكون الفعل أو عبارة فعلية مفعولاً به لفعل آخر: 他喜欢说。 我喜欢学习汉语。"},{"key":"我们还吃寿面。｜من العادات الصينية في أعياد الميلاد أكل «نودلز طول العمر» (寿面)؛ فطول الخيط يرمز إلى طول العمر."}]},{"h":"三、星期和月份","ar":"الأسبوع والأشهر والتاريخ","b":[{"table":{"head":["星期｜الأسبوع","中文｜بالصينية","月份｜الشهر","中文｜بالصينية"],"rows":[["الإثنين","星期一","يناير","一月"],["الثلاثاء","星期二","فبراير","二月"],["الأربعاء","星期三","مارس","三月"],["الخميس","星期四","أبريل","四月"],["الجمعة","星期五","مايو","五月"],["السبت","星期六","يونيو","六月"],["الأحد","星期日（星期天）","نوفمبر","十一月"]]}},{"p":"日期：先说年，再说月，再说日（号）。｜التاريخ: السنة ثم الشهر ثم اليوم (号). مثال:"},{"sl":["一九八二年十月二十七号｜٢٧ أكتوبر ١٩٨٢","今天是十一月八号。｜اليوم ٨ نوفمبر.","明天是星期
